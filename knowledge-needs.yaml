      id: cloud-maintenance-schedule
      description: Wants to understand the schedule, frequency, advance notice periods,
        and rescheduling rules for OutSystems Cloud system updates, so that they can
        plan around maintenance windows and avoid unexpected service disruption.
    - name: Cloud update downtime
      id: cloud-update-downtime
      description: Wants to understand the expected downtime during OutSystems Cloud
        system updates based on their infrastructure configuration (single front-end,
        multiple front-ends, load balancer), so that they can assess the impact on
        their production environment.
    - name: PCI DSS patching compliance
      id: pci-dss-patching-compliance
      description: Wants to understand how OutSystems Cloud system updates fulfill
        PCI DSS Requirement 6.2 for timely security patching, so that they can confirm
        their environment meets compliance obligations without taking manual action.
