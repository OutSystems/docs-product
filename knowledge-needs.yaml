  guid: ''
  topics:
  - name: Merging revisions
    id: merging-revisions
    subtopics:
    - name: Resolve merge conflicts
      id: resolve-merge-conflicts
      description: Wants to understand how ODC handles code merges when multiple
        developers publish changes to the same app simultaneously, including when
        ODC merges automatically and when conflicts require manual resolution by
        choosing which changes to keep, so that they can collaborate on an app
        without losing work.
    - name: Compare app revisions
      id: compare-app-revisions
      description: Wants to compare the currently open version of an app against
        a previously published revision or another revision from the server using
        ODC Studio's Compare and Merge options, so that they can review differences
        before deciding what to publish.
    - name: Recover previous merge
      id: recover-previous-merge
      description: Wants to resume or discard an in-progress merge that was automatically
        saved by ODC Studio, so that they can continue resolving conflicts without
        losing earlier merge work or start fresh.
