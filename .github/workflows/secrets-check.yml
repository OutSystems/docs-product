# Weekly check that this repo's secrets are still valid (TK-24597). The logic
# lives in tk-cicd (OutSystems/tk-cicd/.github/workflows/secrets-check.yml); this
# file only schedules it in this repo, because a repo can test only its own
# secrets. A problem is reported to tk-cicd, which posts one Slack alert naming
# the secret and the repo, never a value.
#
# This is the canonical copy of the stub that lives in each consumer repo's
# .github/workflows/secrets-check.yml. It is NOT synced by sync-standards.yml (the
# sync token cannot write workflow files), so each consumer holds a hand-made
# copy that must stay identical to this file: change it here first, then open a PR
# in each consumer repo with the same change. Which secrets a repo should have,
# and how each is tested, is in tk-cicd's .github/repo-settings.yaml.
name: Secrets check

on:
  schedule:
    - cron: '0 7 * * 1'  # Mondays at 07:00 UTC
  workflow_dispatch:
    inputs:
      test-alert:
        description: 'Add a deliberately invalid test secret, to prove the Slack alert works. Only reports from the default branch.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  secrets-check:
    name: Secrets check
    uses: OutSystems/tk-cicd/.github/workflows/secrets-check.yml@main
    with:
      test-alert: ${{ inputs.test-alert == true }}
    secrets: inherit
