      publishing it to the LifeTime environment via Service Center, so that they
      can extend LifeTime with functionality tailored to their organization's
      governance or automation needs.
- name: Getting started with app development
  guid: 08c8e683-27ea-4656-8559-e145b5e05086
  topics:
  - name: Using Service Studio
    id: using-service-studio
    subtopics:
    - name: Log in to an environment
      id: log-in-to-an-environment
    - name: Service Studio overview
      id: service-studio-overview
    - name: Download and set up
      id: download-and-set-up
  - name: Publish and share apps
    id: publish-and-share-apps
    subtopics:
    - name: Try your app and share with end-users
      id: test-share-app-users
    - name: Publish an app
      id: publish-an-app
  - name: Creating apps
    id: creating-apps
    subtopics:
    - name: Choosing the right app type
      id: choose-app-type
    - name: Creating app from scratch
      id: creating-app-from-scratch
    - name: Application templates overview
      id: application-templates-overview
      description: Wants to understand what application templates are, what types are
        available (built-in, custom, and Forge), and what predefined elements they
        provide, when starting to create an OutSystems app in Service Studio, so that
        they can choose the right template for their project.
  - name: Using external OutSystems components
    id: external-outsystems-comp
    subtopics:
    - name: Adding dependencies to a module
      id: add-module-dependency
    - name: Installing Forge component
      id: install-forge-component
    - name: Forge overview
      id: forge-overview
      description: Wants to understand what Forge is, what types of reusable assets (apps, libraries, agentic apps) are available, and how the community-driven sharing model works in OutSystems.
  - name: Submitting assets to Forge
    id: submitting-assets-to-forge
    subtopics:
    - name: Submit asset to Forge
      id: submit-asset-to-forge
      description: Wants to submit a new software asset (app or library) built in their
        organization to the Forge repository from ODC Portal, meeting the
        submission prerequisites and completing the submission wizard, so that
        the asset can be reviewed and made available for other users to install.
    - name: Submit new Forge version
      id: submit-new-forge-version
      description: Wants to resubmit an updated version of an asset already
        published to Forge, using the same asset name and updating the
        description, images, release notes, license, and documentation as needed,
        so that existing installers can update to the new version.
  - name: Troubleshoot Forge
    id: troubleshoot-forge
    subtopics:
    - name: Forge errors
      id: forge-errors
      description: Wants to locate and resolve ODC Forge errors by finding the
        error code in the reference, understanding its cause and impact, and
        following the recommended action, so that they can fix issues affecting
        mobile or reactive web apps.
  - name: Setting up your OutSystems environment
    id: setup-outsystems-env
    subtopics:
    - name: OutSystems overview
      id: outsystems-overview
    - name: Install Azure trial
      id: install-azure-trial
      description: Wants to install the OutSystems 11 trial on Microsoft Azure by
        completing the Azure Portal wizard (resource group, credentials, VM size),
        starting the deployed VM, and connecting Service Studio to the new environment,
        so that they have a working OutSystems trial up and running.
    - name: Missing confirmation email
      id: missing-confirmation-email
      description: 'Wants to troubleshoot not receiving the ODC shared space signup
        confirmation email by checking the spam folder and whitelisting the sender
        address, so they know when to try signing up again if it''s still missing.'
    - name: Timezone sync requirements
      id: timezone-sync-requirements
      description: Wants to understand why all components of an OutSystems 11 environment
        (database, controller, and front-ends) must share the same timezone and be
        synchronized via NTP, so that they can configure their infrastructure correctly
        and avoid unexpected behavior with time-dependent features such as timers
        and BPT.
    - name: Fix .NET Core upgrade
      id: fix-net-core-upgrade
      description: Wants to fix Server.API and Server.Identity failing to initialize
        after upgrading to Platform Server 11.12.2 or later in a self-managed environment,
        caused by a missing .NET Core 3.1 Runtime & Hosting Bundle for Windows, so
        that they can verify the cause and complete the platform upgrade successfully.
    - name: Fix controller duplication
      id: fix-controller-duplication
      description: Wants to fix the Environment Health screen showing a Deployment
        Controller or Front-End server listed twice under different names or IP addresses,
        caused by a mismatch between the server's registered name and the Deployment
        Controller Hostname in Configuration Tool, so that they can resolve the duplication
        and restore an accurate environment health display.
    - name: O11 Windows Event logs
      id: o11-windows-event-logs
      description: Wants to locate the log entries generated by OutSystems 11 platform
        components by opening Windows Event Viewer and navigating to the Application
        folder, so they can inspect service errors, warnings, and informational messages
        in a self-managed environment.
    - name: O11 platform log sources
      id: o11-platform-log-sources
      description: Wants to understand the types (error, warning, information), sources
        (which OutSystems 11 services), and contents of log entries written to Windows
        Event Viewer by the OutSystems platform, so they can correctly interpret log
        entries and identify which component generated a given issue.
    - name: Fix CT symlink downtime
      id: fix-ct-symlink-downtime
      description: Wants to diagnose and recover from application downtime caused by
        running Configuration Tool from different paths via a symbolic link in Platform
        Server 11.10.0, which overwrites configuration files and deletes DLLs, so
        that they can remove affected front-end servers from the load balancer, republish
        all modules, and avoid recurrence.
    - name: Fix site property upgrade
      id: fix-site-property-upgrade
      description: 'Wants to fix the "Value cannot be null. Parameter name: key" error
        that occurs when upgrading O11 Platform Server to 11.10.2 or higher on an
        environment originally installed on version 5 or lower, caused by legacy Site
        Property IDs in non-standard format that were not migrated in version 5, by
        running SQL queries to identify and delete the outdated entries, so that they
        can complete the Service Center installation and the platform upgrade successfully.'
    - name: Fix ODP.NET conflict
      id: fix-odp-net-conflict
      description: Wants to resolve Oracle Data Provider for .NET (ODP.NET) driver errors
        — such as "Unsupported column datatype" and TransformDatabaseToRuntimeValue access
        failures — caused by a conflicting Oracle.ManagedDataAccess.dll version in the
        GAC on the platform server, by removing or replacing the DLL using OraProvCfg.exe,
        so that Configuration Tool, Service Studio, and application runtime stop throwing
        Oracle driver errors.
    - name: ODC shared trial
      id: odc-shared-trial
      description: Wants to understand what the ODC shared space trial is, how long
        it lasts (10 days), who shares it, and what limitations it has compared to
        a paid license (no Forge submissions, no user invites, no connections, limited
        apps, no official support), so they can decide whether it meets their learning
        or exploration needs.
    - name: Shared space permissions
      id: shared-space-permissions
      description: Wants to know what permissions a developer has in an ODC shared
        space, including access to the development stage, assets, logs, configurations,
        end-user management, and Forge, so they can plan what they can build and manage
        during the trial.
    - name: O11 error tracking
      id: o11-error-tracking-setup
      description: Wants to obtain error information in a self-managed O11 installation
        by using Service Center's Monitoring area, querying the OutSystems Log Database
        directly, and reading Windows Event Viewer alerts, so that they can track,
        monitor, and receive alerts about errors in the platform.
    - name: O11 perf counters
      id: o11-perf-counters
      description: Wants to use OutSystems Platform Server's Windows Performance Counters
        to monitor asynchronous job execution, application error rates, screen access,
        and web service access in a self-managed O11 environment, so that they can
        track platform runtime performance using Windows Performance Monitor.
    - name: O11 service error recovery
      id: o11-service-error-recovery
      description: Wants to diagnose and recover from errors in OutSystems 11 platform
        services — including Deployment Controller, Deployment Service, Scheduler
        Service, Log Service, IIS, and Message Queue — by reading error messages,
        checking Service Center Monitoring, and restarting services in a self-managed
        environment, so that they can restore normal platform operation.
    - name: Fix proxy auth 401
      id: fix-proxy-auth-401
      description: Wants to fix the 401 Unauthorized error (or missing app templates)
        when creating a new app in Service Studio, caused by a proxy between the
        developer's computer and Platform Server tampering with authorization tokens,
        by asking IT to confirm the proxy doesn't manipulate authentication headers,
        so that Service Studio can retrieve app templates in a self-managed OutSystems
        11 environment.
    - name: Fix IIS Basic Auth 401
      id: fix-iis-basic-auth-401
      description: Wants to fix the 401 Unauthorized error (or missing app templates)
        when creating a new app in Service Studio, caused by Basic Authentication
        being enabled on the module at the IIS level instead of the required Anonymous
        Authentication, by enabling Anonymous Authentication in IIS, so that Platform
        Server can correctly authenticate requests in a self-managed OutSystems 11
        environment.
- name: Hotfixing
  guid: d8111f11-34b0-4f33-8374-5d9611d507e2
