- name: User Management
  guid: 30a6f6ca-c898-4e05-b5d6-88a6789ca36c
  topics:
  - name: Authentication
    id: authentication
    subtopics:
    - name: Built-in Authentication
      id: built-in-authentication
    - name: Get authenticated user id
      id: get-authenticated-user-id
      description: Wants to retrieve the identifier of the user currently
        authenticated with the server, or a null identifier when
        unauthenticated, inside a server action, service action, or database
        aggregate, using the GetUserId built-in function, so that logic can
        reference or filter data by the current user's identity.
    - name: Extend login validation
      id: extend-login-validation
      description: Wants to add custom server-side validation to the built-in
        end-user login flow by extending the Users data model with a 1-to-1
        related entity, creating a server action that validates the extra data,
        and wiring that action into the Login/DoLogin flow, in OutSystems 11
        Traditional Web, Reactive Web, and Mobile apps, so that additional
        business rules (for example, account expiration or external-system
        checks) can block or allow login beyond the default username/password
        check.
    - name: Custom auth screens
      id: custom-auth-screens
      description: Wants to use and edit the pre-built authentication screens and
        blocks (Login, ChangePassword, RecoverPassword, UserProfile, UserInfo, PasswordPolicy)
        available in the Common UI folder in ODC Studio, so that they can implement
        a custom-branded authentication flow without building it from scratch.
    - name: External login redirect
      id: external-login-redirect
      description: Wants to configure the OnException global handler's
        SecurityException flow to call GetExternalLoginURL and set the
        Destination to the Login screen, in ODC Studio, so that unauthenticated
        users accessing a protected screen are automatically redirected to the
        configured external identity provider's login page.
    - name: External IDPs
      id: external-idps
    - name: External IdP concepts
      id: external-idp-concepts
      description: Wants to understand what external identity providers (IdPs) are,
        why they are beneficial (reduced overhead, enhanced security, SSO), and the
        core concepts of authentication, authorization, and single sign-on in the
        context of ODC, so that they can explain external IdP integration and its
        value before configuring it.
    - name: Lockout
      id: lockout
    - name: Passwords
      id: passwords
    - name: Update user email
      id: update-user-email
      description: Wants to change a logged-in end-user's email address in
        ODC's built-in identity provider by calling StartUpdateEmail to send
        a verification code and FinishUpdateEmail to confirm it, so that the
        user's login email is updated without requiring ODC Portal access.
    - name: Automatic user creation
      id: automatic-user-creation
      description: Wants to resolve the OS-IDCO-CONF-40102 login error, caused
        by the automatic user creation setting being disabled for an external
        IdP configuration in ODC, by either enabling automatic user creation
        or manually provisioning the user account, so that end users can log
        in successfully.
    - name: Username claim mapping
      id: username-claim-mapping
      description: Wants to resolve the OS-IDCO-CONF-40001 login error, caused
        by a missing or misconfigured username claim mapping in the external
        IdP, by verifying the IdP's claim mapping configuration and confirming
        it matches the mapping configured in ODC, so that end users can
        authenticate successfully.
    - name: Duplicate IdP email conflict
      id: duplicate-idp-email-conflict
      description: Wants to resolve the OS-IDCO-CONF-40002 login error, caused
        by an external IdP trying to update a user profile with an email
        address already associated with a different existing user profile
        from another IdP, by removing the conflicting duplicate profile and
        reviewing IdP account-linking configuration, so that end users can
        log in successfully.
    - name: Email verified claim
      id: email-verified-claim
      description: Wants to resolve the OS-UAUC-60040 login error, caused by
        a missing or invalid email_verified claim in the external IdP
        configuration when using the Trust identity provider setting, by
        verifying the IdP's claim mapping to ensure it sends the correct
        data, so that end users can log in successfully.
    - name: Trust IdP email setting
      id: trust-idp-email-setting
      description: 'Wants to know when to set organization user email
        verification to "Trust identity provider" in ODC, so that ODC honors
        the IdP''s email_verified claim instead of performing its own
        verification, when the IdP is known to guarantee verified emails.'
    - name: External IDPs - User Mapping
      id: user-mapping
    - name: External IDPs - LinkedIn
      id: idp-linkedin
    - name: External IDPs - Google
      id: idp-google
    - name: External IDPs - Facebook
      id: idp-facebook
    - name: External IDPs - Apple
      id: idp-apple
    - name: External IDPs - OpenIDP
      id: idp-openidp
    - name: External IDPs - Auth0
      id: idp-auth0
      description: Wants to integrate Auth0 as an external identity provider with
        an OutSystems 11 (Traditional Web) application using the IdP Forge component
        and the SAML protocol, including installing IdP, signing up for Auth0,
        configuring the SAML connection and callback URL in Auth0, and mapping the
        SAML configuration parameters between Auth0 and the IdP Configuration page,
        so that end users can log in via Auth0 single sign-on.
    - name: Migrate SAML provider for domain change
      id: migrate-saml-domain-change
      description: Wants to create and cut over to a new SAML 2.0 provider
        in ODC after an organization or stage domain change, understanding
        that the SP metadata's EntityID and ACS URL are immutable and tied
        to the domain, so that end users can keep authenticating once the
        previous domain is deleted.
    - name: Configure Okta IdP
      id: idp-okta
      description: Wants to register ODC as a trusted OIDC application in
        Okta (grants, redirect URIs, access policies) and configure the
        matching connection in the ODC Portal using the Issuer Metadata URI
        as the Discovery endpoint, entering the Client ID/Secret, and
        confirming claim mapping, so that they can establish a secure OIDC
        handshake between ODC and Okta.
    - name: Assign end-user app roles
      id: assign-end-user-app-roles
      description: Wants to assign Okta-authenticated end-users to an ODC
        application's role (via Invite user or Manage roles in the ODC Portal
        Users section) and set the deployment stage, so that role-based
        access control (RBAC) grants them access to the app after external
        IdP login.
    - name: Map AD Groups to Roles
      id: map-ad-groups-to-roles
      description: Wants to map Active Directory Groups to OutSystems Roles using
        the Active Directory and Active Directory Group Mapping Forge components —
        including installing the components, creating an access token, defining role
        mappings, and updating the login flow to call RefreshUserRoles before session
        creation — in OutSystems 11, so that user permissions managed in Active Directory
        are automatically reflected in OutSystems application roles.
    - name: Sync AD roles schedule
      id: sync-ad-roles-schedule
      description: Wants to configure the schedule of the SyncRoles, SyncGroups,
        and SyncUsers timers provided by the Active Directory Group Mapping component
        — including setting timer schedules in Service Center and triggering on-demand
        synchronisation — in OutSystems 11, so that changes to Active Directory Groups
        are regularly propagated to OutSystems user roles without manual intervention.
    - name: Map O11-ODC groups
      id: map-o11-odc-groups
      description: Wants to map existing O11 end-user groups to their corresponding
        ODC end-user groups by creating an end-user group mapping for each ODC group,
        including enabling the Include Groups Claim option when using the UsersIdP
        component, after setting up single sign-on between O11 and ODC, so that end
        users authenticating through O11 receive the correct permissions in their
        ODC apps.
    - name: Coordinate SSO sessions
      id: coordinate-sso-sessions
      description: Wants to implement coordinated logout pages on both O11 and
        ODC sides (an O11 logout page redirecting to ODC, and an ODC logout
        page redirecting back to O11), work around GetExternalLogoutURL's
        automatic addition of the ODC stage domain to ReturnToURL by adding an
        intermediate PostLogout ODC screen that then redirects to the O11
        logout page, after setting up O11 and ODC single sign-on for external
        authentication, so that terminating one platform's session properly
        ends the shared IdP session instead of triggering an automatic
        re-login, and so that the external IdP session terminates and both O11
        and ODC sessions end correctly during external authentication SSO.
    - name: Fix invalid email
      id: fix-invalid-email
      description: Wants to resolve the "User with invalid email" error that
        appears when an end user authenticates via O11-ODC single sign-on
        (UsersIdP) but lacks a valid email address configured in the O11
        Users app.
