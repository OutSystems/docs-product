knowledge-needs:
- name: (Creating Application) Logic
  guid: b097750b-4f88-4094-a656-2a4359f14c85
  topics:
  - name: Creating Actions
    id: creating-actions
    subtopics:
    - name: What are service actions/when to use service actions
      id: service-actions-when-use
    - name: Server-side vs client-side logic
      id: server-vs-client-logic
    - name: How to create an action
      id: how-to-create-an-action
    - name: Logic Flows
      id: logic-flows
    - name: What are client actions/when to use client actions
      id: client-actions-when-use
    - name: What are server actions/when to use server actions
      id: server-actions-when-use
    - name: Screen-level actions
      id: screen-level-actions
      description: 'Wants to understand the two types of screen-level actions in
        OutSystems Traditional Web Apps: Preparation actions, which run automatically
        before a screen renders to fetch data and set variables, and Screen Actions,
        which run in response to user interactions like clicking a button, so that
        they can add the right logic to each when building a Traditional Web App
        screen.'
    - name: Use AI logic suggestions
      id: use-ai-logic-suggestions
      description: Wants to understand what AI logic suggestions are and how to use
        them in ODC Studio action flows, including accessing suggestions via the AI
        radar, accepting them, and applying tips to improve suggestion quality, so
        that they can build logic faster with ML-guided assistance.
    - name: Enable logic suggestions
      id: enable-logic-suggestions
      description: Wants to enable or disable AI logic suggestions in ODC Studio
        Preferences, so that they can control whether the feature is active during
        development.
    - name: AI logic suggestions model
      id: ai-logic-suggestions-model
      description: Wants to understand how the AI logic suggestions model works,
        including that it uses an OutSystems proprietary ML model trained on anonymized
        patterns running entirely within OutSystems infrastructure rather than external
        LLMs, so that they can make informed decisions about data privacy and tool
        selection.
    - name: Action types overview
      id: action-types-overview
      description: Wants to understand the different types of actions available
        in OutSystems 11 (OutSystems built-in actions, custom actions, and actions
        that handle system events) and when each applies, so that they can choose
        the right type of action when designing application logic.
    - name: Iterate a list
      id: iterate-a-list
      description: Wants to loop over each element in a collection using the
        For Each logic node in OutSystems 11, including setting the Record
        List, Start Index, and Maximum Iterations properties, so that they
        can perform logic recursively on each list item.
    - name: Create conditional paths
      id: create-conditional-paths
      description: Wants to branch logic execution in a screen action based
        on a condition, by using If and Switch nodes in Service Studio, in
        OutSystems 11 (O11) apps, so that different logic paths run depending
        on runtime values.
    - name: Conditional paths (ODC)
      id: create-conditional-paths-odc
      description: Wants to branch logic execution in an action based on a
        condition, by using If nodes in ODC Studio, in OutSystems Developer
        Cloud (ODC) apps, so that different logic paths run depending on
        runtime values.
    - name: Create action via widget
      id: create-action-from-widget-event
      description: Wants to create a new client action directly from a
        widget's event property (for example, a Dropdown's On Change), by
        selecting New Client Action from the property's drop-down list in
        Service Studio/ODC Studio, so that the widget is automatically
        wired to trigger the newly created logic without adding a separate
        action and connector afterward.
    - name: Define async action
      id: define-async-client-action
      description: Wants to make a client action asynchronous and signal its
        completion or failure, by using the $resolve() and $reject() predefined
        functions inside a JavaScript element, in OutSystems 11 Mobile Apps and
        Reactive Web Apps, so that server calls or other async operations can
        resolve or reject a returned promise instead of the client action
        returning synchronously.
    - name: Call async action
      id: call-async-client-action
      description: Wants to consume the promise returned by calling an
        asynchronous client action, by chaining then(onFulfilled, onRejected)
        or catch(onRejected) on the $actions.ActionName() call, in OutSystems 11
        Mobile Apps and Reactive Web Apps, so that they can read the action's
        output parameters and handle unhandled errors or $reject() calls once
        the async action completes.
  - name: Using Events
    id: using-events
    subtopics:
    - name: System Events
      id: system-events
    - name: How to use Events
      id: how-to-use-events
    - name: Screen Events
      id: screen-events
    - name: UI elements Events
      id: ui-elements-events
    - name: Handle block events
      id: handle-block-events
      description: Wants to handle events triggered by a block by mapping a screen
        action to the block's event and accessing the event input parameters, in ODC
        Studio, so that the screen can respond to user interactions happening inside
        the block.
    - name: Trigger block event
      id: trigger-block-event
      description: Wants to create an event on a block and trigger it using a
        Trigger Event node in a client action, in ODC Studio, so that the block
        can notify its parent screen when something occurs inside it.
    - name: Block events O11
      id: block-events
      description: Wants to expose an event on a block and handle it on a screen by
        triggering the event in the block and mapping a screen action to it, so that 
        they can pass data and trigger logic across UI components.
    - name: Screen action as callback
      id: screen-action-as-callback
      description: Wants to assign a screen action as a callback for a UI component's
        provider events using JavaScript and the OutSystems UI API (e.g., SetProviderEvent),
        in Service Studio, so that custom logic runs when a component fires events
        like open or close.
    - name: On Parameters Changed
      id: on-parameters-changed
      description: Wants to refresh a block's displayed information when
        parent-passed input parameters change, by implementing the block's
        On Parameters Changed event handler in Service Studio, so that the
        block reflects updates without needing a full screen refresh.
    - name: Fix OnRender loop warning
      id: fix-onrender-loop-warning
      description: Wants to fix the "Potential Loop at Runtime" warning caused
        by changing screen or block data inside an OnRender action, in Service
        Studio for OutSystems 11, by removing that data change from the
        OnRender action, so that the OnRender event doesn't retrigger itself
        and cause an infinite rendering loop.
    - name: Fix OnAfterFetch loop warning
      id: fix-onafterfetch-loop-warning
      description: Wants to fix the "Potential Loop at Runtime" warning caused
        by refreshing an Aggregate or Data Action inside its own OnAfterFetch
        action, in Service Studio for OutSystems 11, by removing that refresh
        from the OnAfterFetch action, so that the OnAfterFetch event doesn't
        retrigger itself and cause an infinite fetch loop.
  - name: Understanding Exceptions
    id: understanding-exceptions
    subtopics:
    - name: How to handle Exceptions
      id: how-to-handle-exceptions
    - name: Fix empty OnException
      id: fix-empty-onexception
      description: Wants to fix the "Empty 'OnException'" error in Service Studio
        for OutSystems 11, caused by an OnException action flow that doesn't begin
        with an Exception Handler node, by adding an Exception Handler node as the
        first node in the OnException action, so the flow compiles and publishes
        successfully.
    - name: Custom JS error handler
      id: custom-js-error-handler
      description: Wants to define and register a custom JavaScript error handler function,
        using OsRegisterExceptionHandler and its predefined error codes, so they
        can handle JavaScript errors that occur during an Ajax refresh of an
        unescaped expression or during the RunJavaScript action of the
        HTTPRequestHandler extension, in Traditional Web Apps (O11).
    - name: Fix Log Error warning
      id: fix-log-error-warning
      description: 'Wants to fix the audit suggestion warning "''Log Error''
        should be set to ''Yes'' for ''AllExceptions'' error handler at screen
        flow level" by setting the Log Error property to Yes on the screen
        flow''s AllExceptions error handler in Service Studio, so that
        OutSystems logs detailed exception information for troubleshooting,
        in OutSystems 11.'
    - name: Fix error handling warning
      id: fix-error-handling-warning
      description: 'Wants to fix the "Errors are not being handled in the web
        flow" warning in Service Studio for OutSystems 11, caused by a web
        flow lacking error handlers and its Theme lacking a web flow for
        error handling, by adding error handlers to the web flow or changing
        the Theme''s error handling Flow property to one that already
        implements error handling.'
  - name: Using Expressions
    id: using-expressions
    subtopics:
    - name: Operands
      id: operands
    - name: When and how to write expressions
      id: write-expressions-guide
    - name: Scope
      id: scope
    - name: Operators
      id: operators
    - name: Functions
      id: functions
    - name: Check string contains
      id: check-string-contains
      description: Wants to check whether one text string contains another using
        the built-in Index function in OutSystems O11, including a case-insensitive
        variant, so that they can replicate C# String.Contains behavior in logic
        expressions.
    - name: Function default values
      id: function-default-values
      description: Wants to understand why OutSystems built-in functions don't
        raise exceptions during execution, returning the default value of the
        output data type instead when an issue occurs, so that they can predict
        function behavior when writing expressions in ODC Studio.
    - name: Built-in math functions
      id: built-in-math-functions
      description: Wants to know which built-in math functions are available in ODC Studio,
        including their parameters, return types, and availability in server-
        side logic, client-side logic, and database aggregates, so that they can
        perform mathematical calculations in expressions.
    - name: Built-in text functions
      id: built-in-text-functions
      description: Wants to know which built-in text functions are available in ODC Studio,
        including their parameters, return types, and availability in server-
        side logic, client-side logic, and database aggregates, so that they can
        manipulate text values in expressions.
    - name: Organization functions
      id: organization-functions
      description: Wants to know which built-in organization functions are available in ODC
        Studio, including their outputs and availability in server-side logic,
        client-side logic, and database aggregates, so that they can retrieve
        session locale, user agent, and app name information in expressions.
    - name: Built-in date functions
      id: built-in-date-functions
      description: Wants to know which built-in DateTime functions are available
        in ODC Studio (e.g. DiffMonths, DiffQuarters, DiffWeeks, DiffYears,
        GetTicks, Quarter, IsLeapYear), including their parameters and return
        types, so that they can perform date and time calculations in
        expressions.
    - name: DST date calculations
      id: dst-date-calculations
      description: Wants to understand how Daylight Saving Time (DST) transitions
        affect date and time built-in functions in OutSystems 11, including
        unexpected results from client-side JavaScript Date arithmetic during
        DST changes and how server-side Diff* functions always ignore DST and
        use the platform server's time zone, so that they can predict outcomes
        when adding to or comparing dates across a DST boundary.
    - name: Data conversion functions
      id: built-in-conversion-functions
      description: Wants to know which built-in data conversion functions are
        available in OutSystems 11 (e.g. TextToInteger, DecimalToText,
        DateTimeToText, BooleanToInteger), including their parameters, return
        types, and availability in server-side logic, client-side logic, and
        database aggregates, so that they can convert values between data
        types in expressions.
    - name: Format numbers rounding
      id: format-numbers-rounding
      description: Wants to know how to format Currency, Decimal, and Percent
        values into Text (specifying decimal digits, decimal separator, and
        group separator) using FormatCurrency, FormatDecimal, and
        FormatPercent, and understand why rounding results differ between
        server-side logic (round half up) and client-side logic (round half
        to even), so they get consistent formatted output in OutSystems 11.
    - name: Text/phone formatting
      id: text-phone-formatting
      description: Wants to know how to format Text output using FormatText
        (padding a string to a minimum/maximum character count with a
        chosen side and padding character) and FormatPhoneNumber (splitting
        a phone number string into international code, area code, and phone
        number segments with custom separators), so they can build
        formatted text values in OutSystems 11.
    - name: FormatDateTime patterns
      id: formatdatetime-patterns
      description: Wants to know the formatting pattern characters (day,
        month, year, hour, minute, second, AM/PM designators) supported by
        the FormatDateTime function to convert a DateTime value into Text in
        a custom format, including how to escape literal characters, so
        they can display dates and times in a specific format in
        OutSystems 11.
    - name: Built-in URL functions
      id: built-in-url-functions
      description: Wants to know which built-in URL functions are available in OutSystems
        11 (e.g. AddPersonalAreaToURLPath, GetBookmarkableURL,
        GetPersonalAreaName, GetOwnerURLPath, GetExceptionURL), including their
        parameters, return types, and availability in server-side and client-
        side logic, so that they can manage Personal Area URL paths and retrieve
        the current screen's or last exception's URL in expressions.
  - name: Debugging and troubleshooting logic
    id: debug-troubleshoot-logic
    subtopics:
    - name: How to debug and troubleshoot application logic
      id: debug-troubleshoot-app-logic
  - name: Creating Variables
    id: creating-variables
    subtopics:
    - name: Site properties / Settings
      id: site-properties-settings
    - name: Input Parameters
      id: input-parameters
    - name: Local Variables
      id: local-variables
    - name: Output Parameters
      id: output-parameters
    - name: How to use Variables
      id: how-to-use-variables
    - name: Record auto-assign
      id: record-auto-assign
      description: 'Wants to automatically populate a Record variable''s attribute
        values in Service Studio''s Assign Tool, by first assigning the record''s
        identifying attribute in the same Assign node, so they don''t have to
        manually enter each attribute value one by one.'
  - name: Using Structures
    id: using-structures
    subtopics:
    - name: How to create structures
      id: how-to-create-structures
    - name: What are structures
      id: what-are-structures
  - name: Logic performance tips
    id: logic-performance-tips
    description: Wants to apply best practices for optimizing OutSystems 11 application
      logic performance — including using Service Center reports to find bottlenecks,
      limiting timer/batch job run duration with checkpoints, simplifying screen
      preparations, treating Site Properties as constants, avoiding isolated Aggregates,
      and avoiding queries inside conditional preparation branches — so that Traditional
      Web, mobile, and Reactive Web apps run efficiently.
    subtopics:
    - name: Client event fetch
      id: client-event-fetch
      description: Wants to avoid performing local data fetch inside client events
        (On Initialize, On Ready, On Render) in OutSystems mobile apps, and instead
        fetch data via data fetch calls, using the On After Fetch event for dependent
        fetches, so that data fetching runs in parallel with screen rendering instead
        of being fully serialized.
    - name: StringBuilder for large strings
      id: stringbuilder-large-strings
      description: Wants to concatenate many strings, or a few large strings, into
        one large string efficiently in OutSystems 11, using the StringBuilder API
        from the Text Extension (StringBuilder_Append) instead of plain string concatenation,
        so that operations that build large outputs, such as serializing large record
        sets, avoid severe performance degradation.
    - name: Avoid complex data types
      id: avoid-complex-data-types
      description: Wants to fix Service Studio scalability suggestion warnings
        about Binary Data, List, or Record-typed screen input parameters,
        session variables, and entity attributes, by avoiding those complex
        data types on screens/session state (or splitting a Binary Data
        attribute into a separate one-to-one entity), so that OutSystems 11
        apps avoid unnecessary performance overhead.
- name: (Creating Basic) Application Security
  guid: f89b0297-9ba2-48bd-9e84-b56614a7e620
  topics:
  - name: User Roles
    id: user-roles
    subtopics:
    - name: Anonymous
      id: anonymous
    - name: Secure anonymous screens
      id: secure-anonymous-screens
      description: Wants to resolve the Service Studio warning about exposing
        a Server Action for public/anonymous access, by removing the
        Anonymous role from a screen or otherwise validating server-side
        data access, so that public endpoints don't expose sensitive data or
        enable cross-site request forgery attacks.
    - name: Check user role in code
      id: check-user-role-in-code
      description: Wants to verify whether the currently logged-in end-user has
        a specific public role (local or consumed from another app) inside a
        server action or service action, using the CheckEndUserRole built-in
        function with a RoleId input, so that business logic can conditionally
        allow or restrict behavior based on the user's role.
    - name: Check role of user
      id: check-role-of-user
      description: Wants to verify whether a given user (not necessarily the
        current one) has a specific role, inside server-side logic or in
        database/local storage aggregates, using the CheckRole built-in
        function with RoleId and UserId inputs, so that business logic can
        conditionally allow or restrict behavior based on any user's role, in
        OutSystems 11.
    - name: Hierarchical roles choice
      id: hierarchical-roles-choice
      description: Wants to decide whether to use hierarchical roles instead
        of OutSystems' default static roles when designing an application's
        security model, weighing benefits (hierarchical authorization, reduced
        role explosion, runtime configurability) against implementation costs
        (configuration overhead, performance overhead, security risks, lack of
        built-in product support), so they can choose the appropriate role
        model for their app.
    - name: Hierarchical roles demo
      id: hierarchical-roles-demo
      description: Wants to implement the hierarchical roles authorization
        approach in a demo sales application by restricting screen access
        with Screen Roles, controlling displayed information with
        HasAccessByFunctionId, and controlling available actions with
        GetPermissionsByUserId, so they can apply the three authorization
        scenarios (screen access, content visibility, action permissions)
        using hierarchical roles in OutSystems 11.
    - name: Implement hierarchical roles
      id: hierarchical-roles-implementation
      description: Wants to implement a hierarchical roles authorization solution in
        OutSystems 11 by designing a supporting data model, structuring the app
        architecture into layered modules, building BackOffice management
        screens to manage functions and permissions, and creating server actions
        for checking user permissions and function-level access, so they can
        enforce granular, configurable authorization across their app without
        relying on OutSystems' default static roles.
- name: (Creating an Application) Architecture
  guid: 9ce4fe11-dcc9-4b0f-b3ea-545557accdec
  topics:
  - name: Why is architecture relevant?
    id: architecture-relevance
    subtopics:
    - name: Basic architecture concepts
      id: basic-architecture
    - name: Importance of having good architecture from day one
      id: good-architecture-value
  - name: How to build app architecture
    id: app-architecture-basics
    subtopics:
    - name: Map OS concepts with "rest of the world" concepts
      id: map-os-to-global-concepts
  - name: Modules
    id: modules
    subtopics:
    - name: What are modules?
      id: what-are-modules
    - name: Difference between applications and modules
      id: apps-vs-modules
    - name: Clone a module
      id: clone-a-module
      description: 'Wants to clone a module and move it to another application
        in OutSystems 11 Service Studio, using the Module menu''s Clone option
        and the Independent Modules app''s Move action, so that a module built
        in one app can be reused in another without recreating it from
        scratch.'
  - name: Multi-tenant architecture
    id: multi-tenant-architecture
    description: Wants to understand what multi-tenancy is and how OutSystems 11
      implements it through user providers and tenants, so they can design applications
      that isolate data, end-users, and sessions for multiple customers on a single
      deployed application.
    subtopics:
    - name: Set Is Multi-tenant
      id: set-is-multi-tenant
      description: Wants to configure the Is Multi-tenant property on a module's
        Entities, Site Properties, and Timers in OutSystems 11, deciding whether
        each should isolate data per tenant or share it across tenants, so they
        can correctly implement data segmentation when building a multi-tenant
        application.
- name: (Modeling, Consuming and Using) Data
  guid: 184681b2-96da-4711-9efd-53172730bbed
  topics:
  - name: Showing data on a screen/block
    id: display-data-screen-block
    subtopics:
    - name: Replace sample data in a UI element
      id: replace-ui-sample-data
    - name: Bind data to a UI element
      id: bind-data-to-a-ui-element
    - name: Table pagination setup
      id: table-pagination-setup
      description: Wants to add pagination and records-per-page control to a Table
        widget in an OutSystems 11 Screen, so that users can navigate through large
        datasets in configurable page sizes.
    - name: ODC table pagination
      id: odc-table-pagination-setup
      description: Wants to add pagination and records-per-page control to a Table
        widget in ODC Studio, so that users can navigate through large datasets in
        configurable page sizes.
    - name: Table sorting setup
      id: table-sorting-setup
      description: Wants to implement user-triggered column sorting on a Table widget
        using a Dynamic Sort in an Aggregate, so that users can reorder displayed
        records by clicking header cells.
    - name: Sort SQL-fed table
      id: sql-table-sorting-setup
      description: Wants to enable dynamic column sorting on a Table widget whose
        data source is a raw SQL query (not an Aggregate), by setting up an OnSort
        action with an attribute-encoding function in Reactive Web, or the List
        Sort Column Rich Widget in Traditional Web, in OutSystems 11, so users can
        reorder SQL-query-driven table results safely without SQL injection risk.
    - name: Customize table columns
      id: customize-table-columns
      description: Wants to customize the columns of a Table widget — adding, deleting,
        renaming, editing column expressions, and adjusting text alignment — in an
        OutSystems 11 Screen, so that the Table displays the right data fields with
        appropriate labels and formatting.
    - name: Set up Table widget
      id: set-up-table-widget
      description: Wants to add a Table widget to a Screen, bind it to an Aggregate
        as its data source, and configure the displayed columns — including adding,
        deleting, renaming, editing expressions, and adjusting alignment — in ODC
        Studio, so that the employee list is presented correctly in the browser.
    - name: Add Table widget
      id: add-table-widget
      description: Wants to add a Table widget to a Screen and bind it to an Aggregate
        as its data source, so that the screen displays database records in a tabular
        layout.
    - name: Fixed header table
      id: fixed-header-table
      description: Wants to create a vertically scrollable Table Records widget with
        a fixed header row that remains visible while users scroll, by adding a separate
        Table Widget as a static header, applying TableRecords style classes, and
        enclosing the body in a CSS-styled container with overflow-y auto, in Service
        Studio for O11 Traditional Web Apps, so that large datasets are navigable
        without losing column context.
  - name: Securing Data
    id: securing-data
    subtopics:
    - name: Security validations on CRUD
      id: security-crud-validation
  - name: Getting Data from your systems of records
    id: fetch-data-system-records
    subtopics:
    - name: Get data from external db
      id: get-data-from-external-db
  - name: Adding test data
    id: adding-test-data
    subtopics:
    - name: How to bootstrap test data from an excel file
      id: bootstrap-test-data-excel
    - name: How to edit data in Service Studio
      id: edit-data-service-studio
    - name: Manage sample data
      id: manage-sample-data
      description: Wants to export, import, and reset the sample data provided
        by the OutSystemsSampleDataDB module using its public Server Actions
        and Service Center timers, so they can customize or refresh the data
        used by Screen Templates in Service Studio.
  - name: Modeling Data
    id: modeling-data
    subtopics:
    - name: Data relationships
      id: data-relationships
    - name: Static Entities
      id: static-entities
    - name: Create/manipulate entities
      id: create-edit-entities
    - name: Data types
      id: data-types
      description: Wants to understand what data types are available in ODC, their
        default values, and their minimum/maximum constraints, so that variables and
        entity attributes can be correctly typed during app development.
    - name: DateTime UTC behavior
      id: datetime-utc-behavior
      description: Wants to understand how DateTime values are stored in UTC and
        displayed in the device's local time zone — including how client-side,
        server-side, and SQL calls differ — so that time-sensitive data is handled
        correctly across regions.
    - name: Fix invalid data type
      id: fix-invalid-data-type
      description: 'Wants to fix the "Invalid Data Type" error family in Service
        Studio for OutSystems 11, caused by using incompatible data types with
        an operator, setting a property or operator to the wrong data type, or
        assigning a Null Value of a different data type than the Input widget''s
        variable, by matching the operator, property, or Null Value to the
        correct data type, so that the expression or widget configuration
        compiles and publishes successfully.'
    - name: Fix expression overflow
      id: fix-expression-overflow
      description: Wants to resolve the "Expression Overflow" error family in Service
        Studio for OutSystems 11, caused by an invalid Date or Time value, a
        Decimal, Integer, or Long Integer value exceeding its allowed range, an
        expression exceeding its maximum allowed length, or a Text literal
        exceeding its maximum length, so they can correct the underlying value
        or expression and continue publishing or running the app without the
        error.
    - name: Fix invalid indexer
      id: fix-invalid-indexer
      description: 'Wants to fix the "Invalid Record List Indexer" error in Service
        Studio for OutSystems 11, caused by indexing a Record List with a
        non-Integer value or indexing an element that isn''t a List, by
        matching the index value''s data type to Integer or using the []
        operator only on List elements, so that the module compiles and
        publishes successfully.'
    - name: Fix invalid numeric value
      id: fix-invalid-numeric-value
      description: 'Wants to fix the "Invalid Numeric Value" error family in
        Service Studio for OutSystems 11, caused by setting a numeric property
        or entity attribute (Decimals or Length) to a value outside its
        allowed range or of the wrong type, by editing the property or
        attribute to a valid numeric value, so that the module compiles and
        publishes successfully.'
    - name: Fix reserved attribute
      id: fix-reserved-attribute-name
      description: Wants to fix the "'<attribute>' is an invalid attribute name in
        <database>." warning caused by naming an entity attribute using an
        Oracle reserved word, by renaming the attribute to a non-reserved word,
        so that the attribute compiles successfully against an Oracle database,
        in OutSystems 11.
    - name: Fix entity warning
      id: fix-unexpected-entity
      description: 'Wants to fix the "Unexpected Entity" warning family in
        Service Studio for OutSystems 11, caused by an entity composed
        solely of an Auto Number attribute, having more than one Binary
        Data attribute, or specifying an invalid physical table name, by
        adding another attribute, moving binary data to a new entity, or
        correcting the table name, so that the entity compiles and
        publishes successfully.'
    - name: Fix table name changed
      id: fix-table-name-changed
      description: 'Wants to fix the "Entity physical table name was set to..."
        warning in Service Studio for OutSystems 11, caused by the entity''s
        physical table name colliding with an existing external table name in
        the database, by acknowledging Service Studio''s automatic rename to
        a non-conflicting name, so that the entity compiles and publishes
        successfully without a database naming clash.'
    - name: Fix data type warning
      id: fix-unexpected-data-type-warning
      description: 'Wants to fix the "Unexpected Data Type" warning family in
        Service Studio for OutSystems 11, caused by comparing Entity
        identifiers of different data types, using an incorrect data type in
        an expression or Built-in function, or referencing a Static Entity
        Record with the wrong attribute data type, by matching the data types
        involved or setting the correct <Static Entity Name> Identifier type,
        so that the expression or entity compiles and publishes successfully.'
    - name: Fix database warning
      id: fix-database-type-warning
      description: 'Wants to fix the "module ''Database'' property (<database>)
        does not match Platform Server database type (<database>)" warning in
        Service Studio for OutSystems 11, caused by the module''s Database
        property not matching the server''s configured database type, by
        setting the property to the correct database type or "(Both)" and
        validating that SQL queries are compliant with the chosen database,
        so that the module compiles without the mismatch warning.'
    - name: Fix unused attribute
      id: fix-unused-attribute
      description: 'Wants to fix the "Consider deleting the value <value>. It''s
        never used because it refers to the missing attribute <attribute>."
        warning in Service Studio for OutSystems 11, caused by a value being
        set for an attribute that no longer exists on the entity, by deleting
        the unused value entry and verifying the attribute deletion was
        intended, so that the module compiles and publishes successfully.'
  - name: Querying data
    id: querying-data
    subtopics:
    - name: Query fundamentals
      id: query-fundamentals
      description: Wants to understand what a query is and the ways it can be used
        to work with data (retrieving results, performing calculations, combining
        data from different entities, and adding, deleting, or changing data), so
        they can choose the right query approach for a data task in OutSystems.
    - name: Joins
      id: joins
    - name: Fix cross join warning
      id: fix-cross-join-warning
      description: Wants to fix the Service Studio scalability suggestion
        warning that an aggregate is being calculated as a cross join for
        each entity, by adding the missing join condition between the
        entities in the aggregate, so that the query performs an inner or
        outer join instead of unnecessarily evaluating every combination.
    - name: Filter data
      id: filter-data
    - name: Aggregates
      id: aggregates
    - name: Multi-entity aggregate
      id: multi-entity-aggregate
      description: Wants to create an aggregate that joins multiple entities and applies
        filters for a specific input parameter, so that a screen can display related
        records from several data sources in a single query.
    - name: Master-detail aggregates
      id: master-detail-aggregates
      description: Wants to implement a master-detail pattern in a Screen using two
        Aggregates with different Fetch properties (At start and Only on demand),
        so that a list loads immediately while detail data loads only when needed.
    - name: Trigger aggregate refresh
      id: trigger-aggregate-refresh
      description: Wants to trigger an on-demand Aggregate to refresh and update
        the UI asynchronously, by using an Assign node to set a filter parameter
        followed by a Refresh Data node inside a client action triggered by a UI
        event, so that the Screen displays updated data without a full page reload.
    - name: Chain aggregate fetches
      id: chain-aggregate-fetches
      description: Wants to sequence multiple On Demand aggregates so each fetches
        only after the aggregate it depends on has data, using the On After Fetch
        event on each aggregate, so that dependent dropdowns and fields don't try
        to filter using data that isn't loaded yet when a screen first opens.
    - name: Optional aggregate filter
      id: optional-aggregate-filter
      description: Wants to add an optional filter condition to an aggregate using
        a NullIdentifier() comparison against a screen variable, in Service Studio
        for OutSystems 11, so that filtering is skipped when no value is selected,
        in traditional web apps, mobile apps, and reactive web apps.
    - name: Fix invalid aggregate
      id: fix-invalid-aggregate
      description: 'Wants to fix the "Invalid Aggregate" error in Service Studio
        for OutSystems 11, caused by joining entities from multiple databases,
        having duplicate join conditions on the same entities, or applying an
        aggregation function to a calculated column with an incompatible data
        type, so that the module compiles and publishes successfully.'
    - name: Fix invalid dependency
      id: fix-invalid-dependency
      description: 'Wants to fix the "Invalid Data Dependency" error in Service
        Studio for OutSystems 11, caused by conflicting Fetch property values
        between dependent data sources, a data source depending on more than
        one other data source, or a circular reference between data sources,
        by adjusting Fetch properties, merging or referencing data via a
        client variable, or removing the circular dependency, so that the
        module compiles and publishes successfully.'
    - name: Fix maintenance warning
      id: fix-maintenance-suggestion-warning
      description: Wants to fix the "Complete enumeration of <entity> attributes
        found" maintenance suggestion warning in Service Studio, caused by a
        SQL query selecting all attributes individually instead of using the
        entity wildcard, by replacing the attribute list with <entity>.*, so
        that the query is easier to maintain, in OutSystems 11.
  - name: Sharing Data defined in OutSystems
    id: share-data-outsystems
    subtopics:
    - name: Allow other apps to change data
      id: allow-apps-edit-data
    - name: Allow other apps to read data
      id: allow-apps-read-data
  - name: Exporting data
    id: exporting-data
    subtopics:
    - name: Export data to Excel
      id: export-data-to-excel
      description: Wants to export the data of an entity to an Excel worksheet
        using the Record List To Excel action and enable users to download the
        generated file, in OutSystems 11 Reactive Web and Traditional Web apps,
        so that entity records can be shared as an Excel file.
- name: API testing
  guid: 195d823e-8f16-4d32-a66d-7766c6bdd032
  topics:
  - name: Fundamentals of API testing strategies
    id: api-testing-strategy
    subtopics:
    - name: API testing strategies
      id: api-testing-strategies
  - name: Manual API testing
    id: manual-api-testing
    subtopics:
    - name: Manual API tests
      id: manual-api-tests
- name: Access Control and Privileges
  guid: ccc4b848-0f34-4854-bdc3-76e15fd4f42c
  topics:
  - name: Case Management Access Control
    id: case-management-access-control
    subtopics:
    - name: CMF access control
      id: cmf-access-control
      description: Wants to understand what access control is in the Case Management
        Framework in OutSystems 11, including what it restricts, how the default-deny
        behavior works when enabled, and what read and write permissions mean, so
        that they can decide whether and how to apply it to their case app.
    - name: Grant case definition access
      id: grant-case-definition-access
      description: Wants to grant or revoke access to a case definition for a user
        or group in OutSystems 11 using the Case Management Framework server actions,
        so that all existing and future case instances of that definition are accessible
        to the right users.
    - name: Grant case instance access
      id: grant-case-instance-access
      description: Wants to grant access to a specific case instance for a user or
        group in OutSystems 11 using the Case Management Framework server actions
        (Case_GrantAccessToUser / Case_GrantAccessToGroup), so that only the intended
        users or groups can access that individual case instance.
- name: Accessibility
  guid: d4c7eefa-c2fc-445e-81d4-270bbf3ad604
  topics:
  - name: Design for accessibility
    id: design-for-accessibility
  - name: Implement accessibility features (screen readers, contrast...)
    id: accessibility-screen-reader
    subtopics:
    - name: Generate HTML tags
      id: generate-html-tags
      description: Wants to generate semantic HTML tags (h1, nav, fieldset,
        etc.) around UI elements for accessibility, using the HTML Element
        widget's Tag property in Mobile/Reactive Web Apps or the OSTagName
        Extended Property on Container/Placeholder widgets in Traditional Web
        Apps, in Service Studio for O11, so the generated markup uses proper
        semantic tags instead of generic span/div elements.
  - name: Translating apps
    id: translating-apps
    subtopics:
    - name: Migrate Multilingual
      id: migrate-multilingual
      description: Wants to migrate translations, clean up client-action logic
        (GetLocale, SetLocale, GetTranslation, AddTranslations,
        AddTranslationsFromResource), and remove the module dependency from
        the deprecated Multilingual Forge component to the built-in
        multilingual feature, in Service Studio for OutSystems 11, so that
        the app's translations and logic keep working without the
        unsupported Forge component.
- name: Advanced app architecture
  guid: d59b4004-582f-44ee-a1ae-eb75787ba1e0
  topics:
  - name: SOA and Microservices
    id: soa-and-microservices
  - name: ODC Events
    id: odc-events
    subtopics:
    - name: ODC event limits
      id: odc-event-limits
      description: Wants to look up the platform limits for ODC events — maximum payload
        size per event, maximum queue capacity per event type, delivery retry
        count and backoff intervals, and concurrent execution/duration limits —
        so that they can design event payloads, queues, and consumer logic
        within ODC's supported constraints.
  - name: ODC network architecture
    id: odc-network-architecture
    description: Wants to understand OutSystems Developer Cloud (ODC)'s network
      architecture and security components, including the CDN, WAF, Identity
      Service, Load Balancer, TLS encryption, and network isolation between
      customers, so that they can design and secure Platform and Runtime apps
      accordingly
  - name: Trigger ODC event
    id: trigger-odc-event
    description: Wants to create a public event with an input parameter in
      ODC Studio and trigger it from a server action using an IF condition
      and a Trigger Event node, so that the event fires only when a new
      record is created, providing the data a workflow needs to start.
- name: Advanced data handling
  guid: c6a945c1-deaa-4266-9b94-d7b31d9fdf07
  topics:
  - name: When to use Aggregates vs SQL Nodes
    id: agg-vs-sql
  - name: Stored procedures
    id: stored-procedures
  - name: Aggregating data
    id: agregating-data
    subtopics:
    - name: Dynamic sort setup
      id: dynamic-sort-setup
      description: Wants to implement dynamic sorting on calculated attributes in
        an aggregate that uses external entities, so that the sort works correctly
        at runtime without errors or empty results.
    - name: Aggregation functions
      id: aggregation-functions
      description: Wants to understand which aggregation functions are available
        in an Aggregate, what the output contains after applying them, and how
        Group By affects which columns are returned, in OutSystems, so that
        queries return only the expected calculated results.
  - name: SQL
    id: sql
    subtopics:
    - name: Query parameters
      id: query-parameters
    - name: Use SQL
      id: use-sql
    - name: Insert null via SQL
      id: insert-null-via-sql
      description: Wants to insert a null value into a database field when the
        built-in create/update actions default missing values instead (for
        example, writing 0 for an undefined decimal), by using a SQL node with
        Expand Inline and EncodeSql, in OutSystems Service Studio (O11), so
        that null is correctly stored in the database.
    - name: Implement dynamic SQL statements correctly
      id: dynamic-sql-correctly
    - name: SQL operator reference
      id: sql-operator-reference
      description: Wants to know which ANSI-92 operators and functions — comparison,
        logical, arithmetic, string, date/time, conditional, aggregate, and window —
        are supported in SQL queries with external entities in ODC, so they can write
        correct queries without accidentally using unsupported syntax.
    - name: SQL type conversion
      id: sql-type-conversion
      description: Wants to know which type conversion functions (such as CAST,
        DECIMAL_TO_TEXT, TEXT_TO_INTEGER) are available and what behavior to expect
        when converting between data types in SQL queries with external entities in
        ODC, so they can avoid runtime errors and produce correct results.
    - name: SQL NULL behavior
      id: sql-null-behavior
      description: Wants to understand how NULL values behave in SQL operators and
        functions when querying external entities in ODC — including how NULL handling
        differs between push-down and ODC-handled execution in mashup queries — so
        they can write reliable queries that handle NULLs correctly across different
        external systems.
    - name: ANSI-92 syntax basics
      id: ansi-92-syntax-basics
      description: Wants to understand the ANSI-92 SQL syntax rules used in ODC SQL
        nodes — including entity and attribute notation, identifier casing behavior,
        and how to run multiple statements in a single SQL node with transaction
        semantics — so they can write correct queries against external entities without
        syntax errors.
    - name: SQL query execution
      id: sql-query-execution
      description: Wants to understand how ODC parses, normalizes, and executes SQL
        queries against external entities — including push-down behavior for
        single-system queries and performance considerations for mashup queries
        spanning multiple external systems — so they can write efficient and correct
        queries.
    - name: Update SQL statement
      id: update-sql-statement
      description: Wants to update records in an external entity using the ANSI-92
        UPDATE statement in an ODC SQL node — including SET clause syntax, WHERE
        filtering, permissions, return behavior, and data source compatibility —
        so they can correctly modify data in external systems.
    - name: Delete SQL statement
      id: delete-sql-statement
      description: Wants to delete records in an external entity using the ANSI-92
        DELETE statement in an ODC SQL node, including WHERE filtering,
        required permissions, and data source compatibility, so they can
        correctly remove data from external systems.
    - name: Insert/upsert statement
      id: insert-upsert-statement
      description: Wants to create or update records in an external entity using
        the ANSI-92 INSERT or UPSERT statement in an ODC SQL node — including
        sourcing values via VALUES or SELECT, single versus multiple record
        semantics, required permissions, and returned primary key behavior —
        so they can correctly write data to external systems.
    - name: Insert/upsert support
      id: insert-upsert-support
      description: Wants to know which external data sources supported by ODC support
        single-record insert, multiple-record insert, upsert, and insert/upsert
        from a SELECT in an ODC SQL node, so they can determine which operations
        are available before writing a query against a given external system.
  - name: Compound data
    id: compound-data
  - name: Binary data actions
    id: binary-data-actions
    description: Wants to know which actions the BinaryData library provides in ODC,
      including their inputs, outputs, and supported encodings, so that they can
      convert and manipulate binary content correctly in logic flows.
  - name: Dealing with rollbacks
    id: dealing-with-rollbacks
    subtopics:
    - name: Force update conflict
      id: force-update-conflict
      description: Wants to let a user override a detected concurrent-update
        conflict and force-save their changes after being warned, in OutSystems 11,
        so that data isn't silently lost but the user can still choose to overwrite
        when confident their information is current.
    - name: Detect update conflicts
      id: detect-update-conflicts
      description: Wants to implement a pessimistic concurrency strategy that
        detects concurrent update conflicts before saving a record, using
        GetForUpdate to lock the record and comparing audit attributes (such as
        UpdatedOn) between the loaded and current record, in OutSystems 11, so
        that users don't unknowingly overwrite each other's changes.
    - name: Isolation level basics
      id: isolation-level-basics
      description: Wants to understand which operations start and end a database
        transaction in ODC (write operations like Create, Update, Delete, GetForUpdate;
        and Commit, Rollback, or end of Request), and how the Read Committed isolation
        level prevents dirty reads by hiding uncommitted changes from concurrent
        transactions, so that they can reason about data visibility during concurrent
        database operations.
- name: Advanced data modeling
  guid: 9a38cf20-a3dc-491a-8a25-c261c830e9c7
  topics:
  - name: Data performance, caching
    id: data-performance-caching
    subtopics:
    - name: Invalidate app cache
      id: invalidate-app-cache
      description: Wants to invalidate server-side caches (from Aggregates,
        Advanced SQL queries, and server actions using Cache in Minutes) for
        the calling application across all replicas in ODC, using the
        ApplicationInvalidateCache system action, so that stale cached data
        doesn't linger after underlying data changes.
    - name: Connection pool usage
      id: connection-pool-usage
      description: Wants to understand when and how to use connection pooling when
        connecting to external databases (SQL Server, Oracle, PostgreSQL, DB2, MySQL)
        via extensions in OutSystems 11 — including connections from OutSystems
        extensions back to the OutSystems database — so that frequent connections do
        not degrade application performance as load scales up.
    - name: Optimize data transfer
      id: optimize-data-transfer
      description: Wants to understand how OutSystems 11 optimizes server-to-client
        data transfer for Screen Aggregates, Data Actions, and Server Actions used
        in client-side Screen Actions logic in Mobile Apps and Reactive Web Apps,
        so that they know when and why the platform automatically reduces the data
        sent to the client.
    - name: Database query slowdown
      id: database-query-slowdown
      description: Wants to diagnose and fix database queries that slow down after
        deleting or updating a significant number of rows, by checking and updating
        outdated table statistics and checking and defragmenting the table in
        Oracle or SQL Server, in OutSystems 11, so that the query optimizer builds
        accurate access plans and performance recovers.
  - name: Indexes
    id: indexes
    subtopics:
    - name: Index FK reference attribute
      id: index-fk-reference-attribute
      description: Wants to fix the Service Studio scalability suggestion
        recommending an index on an entity's Foreign Key reference
        attribute, by creating that index when the attribute's Delete Rule
        is set to Protect or Delete, so that the OutSystems 11 app avoids
        the performance cost of an unindexed reference lookup.
  - name: Enforcing data integrity
    id: enforcing-data-integrity
  - name: Exposing data via REST webservices
    id: rest-webservice-data
  - name: Data isolation
    id: data-isolation
  - name: Data archiving / cold data
    id: data-archiving-cold-data
  - name: Data synchronization
    id: data-syncronization
- name: Advanced integrations
  guid: fb5d71a9-9ac6-4fda-adea-e89546e0af89
  topics:
  - name: Webservice customization
    id: webservice-customization
    subtopics:
    - name: Customize request and response
      id: custom-request-response
    - name: API rate limit
      id: api-rate-limit
    - name: Customize headers
      id: customize-headers
    - name: Choose log level
      id: choose-log-level
      description: Wants to choose the appropriate logging level for REST APIs and consumed
        SOAP Web Services in OutSystems 11, understanding what each level logs
        and that higher levels increase database storage and may expose
        sensitive parameter values in the environment management console, so
        that they can balance troubleshooting needs against performance and
        security.
  - name: Integration Patterns
    id: integration-patterns
    subtopics:
    - name: Consume O11 entities
      id: consume-o11-entities
      description: Wants to understand how an O11 entity's exposure settings determine
        which entity actions are available when the entity is consumed as an
        external entity in ODC Studio, so that they can correctly use O11 data
        in ODC apps.
    - name: Set up interop DB access
      id: setup-interop-db-access
      description: Wants to set up the initial database access for O11-ODC
        data interoperability in a self-managed infrastructure by creating a
        dedicated database user and granting it read access to O11 system
        tables (application, entity, module metadata, plus SQL Server or
        Oracle-specific system tables), for each O11 environment mapped to
        an ODC stage.
    - name: Grant DB access on entity expose
      id: grant-db-access-entity-expose
      description: Wants to grant the interoperability database user
        read/write access to the new database views and tables created when
        an O11 application entity is exposed or promoted, and read access to
        the views/tables for the User and Tenant system entities, so ODC can
        consume the data.
  - name: Extensions
    id: extensions
    subtopics:
    - name: Choose connector option
      id: choose-connector-option
      description: Wants to choose an approach for migrating from the third-party
        ardoPostgreSQL connector to the OutSystems supported PostgreSQL connector
        in OutSystems 11 (adapting existing extensions and republishing consumers,
        creating new extensions and updating consumer modules, or creating new
        extensions and consumers from scratch), so that they can weigh development
        effort against consumer-testing risk before starting the migration.
    - name: Migrate DB connector
      id: migrate-db-connector
      description: Wants to migrate from the ardoPostgreSQL connector to the
        supported PostgreSQL connector in OutSystems 11 by creating a new database
        connection, updating each affected extension's connection reference,
        refreshing entities, and republishing and testing consumer modules, so
        that existing extensions and consumers keep working under the new
        supported connector.
    - name: Integrate using custom code
      id: custom-code-integration
    - name: Consume via extension
      id: consume-webservice-via-extension
      description: Wants to consume a Web Service that can't be natively imported
        into OutSystems, by creating an Extension in Integration Studio with an
        Action per method, building a matching data model, importing the WSDL
        via Visual Studio's Add Web Reference dialog, and implementing the action
        to call the generated proxy class, so that Service Studio can call the
        Web Service like a built-in action, in OutSystems 11.
    - name: Open extension editor
      id: open-extension-editor
      description: Wants to open the Extension Editor in Integration Studio to
        view and edit an extension's properties, by double-clicking the
        extension node in the Multi-tree Navigator or selecting its tab in the
        Multi-tab Editor, so that they can modify extension properties and
        manage its elements (actions, structures, entities, and resources).
    - name: Fix invalid assembly
      id: fix-invalid-assembly
      description: 'Wants to fix the OS-ELG-MODL-05001 error ("File does not
        contain a valid compiled external library, or the compiled assembly
        was not built using a supported .NET version") by verifying their C#
        project targets a supported .NET version and packaging the compiled
        project into a ZIP correctly before uploading, so that they can
        successfully publish the external library.'
    - name: Fix OSIgnore field error
      id: fix-osignore-field-error
      description: 'Wants to fix the OS-ELG-MODL-05012 error ("The property/field
        decorated by OSIgnore ... is not public") by changing the access modifier
        of an OSIgnore-decorated struct property/field to public in their C#
        external library project, so that they can successfully publish the
        external library.'
    - name: Fix OSInterface duplicate
      id: fix-osinterface-duplicate
      description: 'Wants to fix the OS-ELG-MODL-05008 error ("The interface
        decorated with OSInterface ... is implemented by multiple classes") by
        ensuring only one class implements the OSInterface-decorated interface
        in their C# external library project, so that they can successfully
        publish the external library.'
    - name: Missing file warning
      id: missing-file-warning
      description: 'Wants to resolve the "The file ''<file>'' was not found on
        the file system" warning that occurs when a previously added resource
        file can''t be found on the file system during extension creation,
        merge, or save in Integration Studio, by re-opening the extension to
        recover the files, so that the extension resource is restored.'
    - name: Overwritten file warning
      id: overwritten-file-warning
      description: 'Wants to resolve the "The file ''<file>'' was overridden"
        warning in Integration Studio by understanding that a merge operation
        replaces file-system files with newer, extension-generated ones when
        Last Modified timestamps differ, and by locating the automatic backup
        saved in the extension''s Backups folder, so that they don''t lose
        manual file-system changes.'
    - name: Fix source code warning
      id: fix-source-code-warning
      description: 'Wants to resolve the "The Extension has no [.NET] source
        code to update/compile" warning in Integration Studio by adding at
        least one action to the extension, so that the extension has
        associated source code to update and compile, in OutSystems 11.'
    - name: Fix missing options warning
      id: fix-missing-options-warning
      description: 'Wants to resolve the "The .NET Software Development Kit
        options are not correctly defined" warning that blocks compiling and
        1-Click Publishing an extension, by setting the .NET SDK options
        correctly in the Options Window, in Integration Studio, so that the
        extension compiles and publishes successfully.'
    - name: Fix resource warning
      id: fix-resource-warning
      description: 'Wants to fix the "The Resource <file> should not be included
        in the Extension" or "...has a reserved file name..." warnings in
        OutSystems 11, caused by naming an extension resource with the reserved
        OutSystemsHubEdition prefix or a reserved system filename (for example,
        compressor or web.config), by renaming the resource file to remove the
        prefix or reserved name, so that the resource deploys correctly.'
    - name: Authenticate mTLS library
      id: authenticate-mtls-library
      description: 'Wants to implement mutual TLS (mTLS) authentication in an
        external library''s HTTP client, by loading a client certificate and
        validating the server certificate, so that an OutSystems Developer
        Cloud (ODC) app can securely consume a mTLS-protected REST API.'
    - name: Parse XML XPath
      id: parse-xml-xpath
      description: Wants to extract filtered data from an XML file using XPath expressions
        in a Server Action, by loading the XML document, selecting nodes with an
        XPath expression, and iterating over the matched nodes to read their
        values, using the OutSystems 11 XML Extension, so that only the data
        matching specific criteria is available for downstream business logic
        without processing the entire document.
    - name: Integrate with legacy systems
      id: legacy-systems-integration
      subtopics:
      - name: Access Lotus Notes data
        id: access-lotus-notes-data
        description: Wants to access data from a legacy Lotus Notes/Domino application
          using ODBC and a SQL Server Linked Server, on a 64-bit SQL Server environment,
          so that OutSystems applications can query that legacy data at runtime.
    - name: Regex text search/replace
      id: regex-search-replace
      description: Wants to use the Regex_Search and Regex_Replace server actions
        from the Text extension to search for and replace regular expression
        patterns in text, wrapping them inside a server action instead of a
        client action, so that the regex pattern stays secure server-side in
        a reactive OutSystems app.
    - name: Validate GUID with regex
      id: validate-guid-regex
      description: Wants to build a reusable server action that uses Regex_Search
        with a GUID-matching pattern to check whether a text input is a valid
        GUID, so that they can validate identifiers are properly formatted
        before use in OutSystems 11.
    - name: Extract GUID with regex
      id: extract-guid-regex
      description: Wants to build a reusable server action that uses Regex_Search
        with a GUID-matching pattern to detect and extract a GUID embedded
        within a larger text string, so that they can retrieve the GUID value
        from unstructured text in OutSystems 11.
    - name: Fix SAP connection
      id: fix-sap-connection-error
      description: Wants to fix the "Invalid SAP Connection" error caused by a
        SAP connection with no remote functions linked (never imported, or all
        deleted), by importing at least one remote function or deleting the
        connection, so that the SAP connection compiles and publishes
        successfully in OutSystems 11.
    - name: Fix SAP decimal warning
      id: fix-sap-decimal-warning
      description: Wants to resolve the "This can result in data loss" warning
        caused by an SAP remote function parameter mapped to Decimal that can
        exceed the Decimal data type's supported range or digit length, by
        checking whether the SAP data fits within Decimal's boundaries and
        switching the parameter to Text instead, so that the integration
        avoids runtime errors or silent rounding in OutSystems 11.
    - name: Configure deploy action
      id: configure-deploy-action
      description: Wants to choose the correct Deploy Action for an extension resource in
        Integration Studio based on the resource's file type, so that the
        resource deploys to the right Platform Server location, or is excluded,
        when the module is published.
    - name: Compare resource template
      id: compare-resource-template
      description: Wants to compare a resource file stored on the file system
        against its template file in Integration Studio's Resources tree,
        using the Compare With Template operation and a diff tool set in the
        Options Window, so that they can review and merge changes made
        outside the Resource Editor when Update Source Code can't
        auto-merge them.
    - name: Check import details
      id: check-import-details
      description: Wants to check the Import Details report for an extension
        resource that was added by importing actions from a .NET assembly,
        in Integration Studio's Resource Editor, so that they can review
        additional information about the imported resource.
    - name: Structure element properties
      id: structure-element-properties
      description: Wants to know the properties available when defining a Structure element
        in Integration Studio, including which are mandatory or optional and
        their default values, so that they can correctly configure a structure
        inside an extension.
    - name: File menu operations
      id: file-menu-operations
      description: Wants to know what operations the File menu provides in Integration
        Studio, so that they can manage an extension's lifecycle while working
        in Integration Studio.
    - name: Edit menu operations
      id: edit-menu-operations
      description: Wants to know what operations the Edit menu provides in Integration
        Studio, so that they can perform clipboard actions and access
        environment editing options while working on an extension.
    - name: Help menu operations
      id: help-menu-operations
      description: Wants to know what operations the Help menu provides in Integration
        Studio, so that they can access help resources, product updates, and
        feedback tools while working on an extension.
    - name: Configure .NET SDK options
      id: configure-net-sdk-options
      description: Wants to configure the .NET IDE, .NET Compiler Tool, and
        .NET Compiler Tool Options paths in Integration Studio's Options
        window .NET tab, so that they can compile and edit .NET extensions
        with their preferred development environment and build settings, in
        OutSystems 11.
    - name: Configure proxy auth
      id: configure-is-proxy-auth
      description: Wants to configure proxy authentication settings (enabling
        proxy authentication and setting the proxy user name and password)
        in Integration Studio's Options window Connection tab, so that
        Integration Studio can connect to a Platform Server behind an
        authenticating proxy, in OutSystems 11.
    - name: Select Server window
      id: select-server-window
      description: Wants to know what information the Select Server window requires in
        Integration Studio, so that they can connect to a specific Platform
        Server, in OutSystems 11.
    - name: 1-Click Publish window
      id: 1-click-publish-window
      description: Wants to know what areas and action buttons the 1-Click Publish window
        provides in Integration Studio, so that they can monitor progress,
        review errors and warnings, and manage extension publishing to a
        Platform Server, in OutSystems 11.
    - name: Verify window
      id: verify-window
      description: Wants to know what areas and buttons the Verify window provides in
        Integration Studio, so that they can review verification errors and
        warnings and continue extension publishing, in OutSystems 11.
    - name: Download version window
      id: download-version-window
      description: Wants to know what information and buttons the Download Version from
        Server window provides in Integration Studio, so that they can review
        available versions and download a specific extension version from the
        Platform Server they're connected to.
    - name: Download window
      id: download-window
      description: Wants to know what information and buttons the Download from Server
        window provides in Integration Studio, so that they can review
        extensions they have Download access to and download the latest
        published version from the Platform Server they're connected to.
  - name: Private Gateway
    id: private-gateway
    subtopics:
    - name: Activate private gateway
      id: activate-private-gateway
      description: Wants to activate an ODC Private Gateway for an environment
        stage in ODC Portal and configure the Cloud Connector using the generated
        token and address, so that ODC apps can securely connect to private
        network endpoints.
  - name: Generate PDF reports
    id: generate-pdf-reports
    subtopics:
    - name: Set up HTML2PDF component
      id: setup-html2pdf-component
      description: Wants to install and configure the HTML2PDF Forge component in
        OutSystems 11, including downloading the wkhtmltopdf/wkhtmltoimage binaries
        matching the component's documented version, uploading them in the
        component's admin panel, and adding references to GeneratePDF,
        MakeAbsoluteURL, and GetEntryURL in Service Studio, so that the environment
        is ready to generate PDF reports.
    - name: Create PDF report HTML2PDF
      id: create-pdf-report-html2pdf
      description: Wants to build and generate a PDF report using the HTML2PDF
        component by creating an anonymous screen with a Table Records widget bound
        to an aggregate, then calling GeneratePDF with an absolute URL and a
        Download action from a separate screen, in OutSystems 11, so that end users
        can export screen data as a downloadable PDF file.
    - name: Customize HTML2PDF output
      id: customize-html2pdf-output
      description: Wants to work around HTML2PDF/wkhtmltopdf rendering limitations,
        such as table rows breaking across pages and missing header/footer/pagination
        support, by applying the page-break-inside CSS rule, passing header/footer
        URLs via OtherArgs, and adding pagination JavaScript, in OutSystems 11, so
        that the generated PDF report renders correctly and completely.
  - name: Handling webservice errors
    id: handle-webservice-errors
    subtopics:
    - name: Fix IM unreachable
      id: fix-im-unreachable
      description: 'Wants to resolve the "Integration Manager couldn''t be
        reached" network error in Integration Builder by verifying Integration
        Manager is installed and up to date in the environment''s Dependencies
        settings, and checking that Integration Builder''s network/firewall
        configuration allows access to the environment''s
        OSIntegrationManager_API endpoint, so that they can navigate from
        Integration Builder to Integration Manager to configure integration
        connections.'
    - name: Fix Salesforce API error
      id: fix-salesforce-api-error
      description: 'Wants to resolve a Salesforce error message
        (OS-INBL-API-20000) returned when Integration Builder calls the
        Salesforce API, by retrying later and contacting the Salesforce
        administrator or Salesforce support if the error persists, so that
        they can restore the connection to Salesforce.'
  - name: Workato Connector
    id: workato-connector
    subtopics:
    - name: Install Workato connector
      id: install-workato-connector
      description: Wants to install and configure the OutSystems Workato Connector
        by installing the Forge component, creating an API key with entity access
        rules in the OutSystems environment, and creating a corresponding app
        connection in Workato, so that Workato can securely connect to their
        OutSystems environment.
    - name: Build OutSystems trigger recipe
      id: build-workato-outsystems-trigger-recipe
      description: Wants to build a Workato recipe that triggers on a new or
        updated OutSystems entity record to run an action in another
        application, so that OutSystems changes propagate to other connected
        apps.
    - name: Build Upsert trigger recipe
      id: build-workato-upsert-trigger-recipe
      description: Wants to build a Workato recipe that triggers on an external
        app event to create or update an OutSystems entity record via the
        Upsert record action, so that external app changes are reflected in
        OutSystems.
    - name: Map Workato foreign key
      id: map-workato-foreign-key
      description: Wants to obtain the Id value of a related OutSystems entity
        (a foreign key) before calling the Upsert record action in a Workato
        recipe, by adding a Search records action for the related entity and
        reordering it ahead of the upsert step, so that foreign key attributes
        are populated correctly when creating or updating records from another
        application.
- name: Advanced security
  guid: dedf532a-fe2a-4e93-8316-731133ad6ba1
  topics:
  - name: Handling sensitive data
    id: handling-sensitive-data
    subtopics:
    - name: Data masking
      id: data-masking
    - name: Data encryption
      id: data-encryption
    - name: Secure data in transit
      id: secure-data-in-transit
      description: Wants to protect OutSystems app communications from Man-in-the-Middle
        attacks by using HTTPS/SSL/TLS for Web Flows and Web Services and enabling
        secure cookies with HSTS headers, so that sensitive data and session cookies
        aren't transmitted in plain text.
  - name: External access control
    id: external-access-control
    subtopics:
    - name: ACLs
      id: acls
    - name: Webservice authentication
      id: webservice-authentication
    - name: Credential delegation
      id: credential-delegation
      description: Wants to enable Integrated Authentication credential delegation
        from the browser through OutSystems to a consumed Web Reference, by setting
        the Web Reference's Integrated Authentication property, ensuring
        integrated-auth context in the calling screen/flow/block/action, and
        configuring the OutSystems server as trusted for Kerberos delegation to the
        Web Service server in Active Directory, in OutSystems 11, so that the Web
        Service receives the client's actual domain credentials instead of the
        application's service account.
    - name: Create API client
      id: create-api-client
      description: Wants to create an API client in the ODC portal, configuring its
        identifying details, secret expiration and reminder settings, and per-
        stage permissions, so that OAuth 2.0 client credentials are generated
        for accessing ODC REST APIs and data.
    - name: Copy API client credentials
      id: copy-api-client-credentials
      description: Wants to copy the client ID and client secret of a newly created
        API client immediately after creation, so they can configure them in their
        app to request an access token, since the credentials can't be retrieved
        again once the credentials page is left.
    - name: Suspend API client
      id: suspend-api-client
      description: Wants to suspend access to an API client from the ODC portal,
        so its secrets and access tokens immediately become invalid and can no
        longer be used to access ODC REST APIs.
    - name: Resume API client
      id: resume-api-client
      description: Wants to resume access to a suspended API client from the ODC
        portal, so its secret and access token become valid again, or generate a
        new secret if expired, restoring API access.
    - name: Edit API client permissions
      id: edit-api-client-permissions
      description: Wants to edit the permissions of an existing API client in the
        ODC portal after it was created, so its access to ODC REST APIs and data
        can be updated.
  - name: Injection attacks
    id: injection-attacks
    subtopics:
    - name: Injection attack types
      id: injection-attack-types
      description: Wants to understand what injection attacks are, why they are dangerous,
        and what categories exist, including SQL injection, XSS, interpreter injection,
        file system attacks, and buffer overflow, in the context of OWASP web security,
        so that they can recognize and reason about this vulnerability class when securing
        ODC applications.
    - name: XSS attack types
      id: xss-attack-types
      description: Wants to understand the three categories of Cross-Site Scripting
        attacks, specifically reflected, stored, and DOM-based XSS, including how each
        propagates and their relative severity, so that they can identify the type of
        XSS risk present in their application and apply the right mitigation.
    - name: Prevent injection ODC
      id: prevent-injection-odc
      description: Wants to understand and apply OutSystems ODC's built-in injection
        protections, including IDE injection warnings, Content Security Policy, platform
        default escaping, and Encode functions (EncodeSQL, EncodeHTML, EncodeJavaScript,
        EncodeURL) and parameterized queries, so that they can protect their ODC
        applications against SQL injection and XSS attacks.
    - name: Fix JS injection warning
      id: fix-js-injection-warning
      description: Wants to resolve the Service Studio warning that an expression
        using end-user input isn't protected against JavaScript injection, by
        wrapping it with the EncodeJavascript() built-in function or
        VerifyJavascriptLiteral() from the Sanitization extension, in OutSystems
        11, so that malicious script content can't be injected via that
        expression.
    - name: Fix open redirect warning
      id: fix-open-redirect-warning
      description: Wants to resolve the Service Studio warning that an
        HTTPRequestHandler input parameter derived from end-user input is
        susceptible to open redirect vulnerabilities, by wrapping the
        parameter with the ReplaceURLDomain() function, replacing the
        'External Site' element with a well-known page, or replacing it with
        an External Site element that doesn't take a URL input, in
        OutSystems 11, so that malicious redirect URLs can't be injected via
        that parameter.
    - name: Fix SQL injection warning
      id: fix-sql-injection-warning
      description: Wants to resolve the Service Studio warning that a SQL
        Query Parameter has Expand Inline enabled, including the specific
        case of a parameter used after ORDER BY or GROUP BY, by disabling
        Expand Inline where possible or ensuring the parameter value doesn't
        contain end-user input, in OutSystems 11, so their application isn't
        vulnerable to SQL injection.
  - name: Access control risks
    id: access-control-risks
    description: Wants to protect OutSystems 11 applications from access control
      and permissions vulnerabilities, covering how to secure actions (avoiding
      UI-only disabling/hiding, validating permissions server-side rather than
      only in Preparation, checking permissions before executing code, using
      non-guessable IDs) and information (checking permissions in Preparation
      before displaying data), so that only authorized users can perform actions
      or view data.
  - name: Content security policy
    id: content-security-policy
    subtopics:
    - name: Configure CSP for iOS
      id: configure-csp-ios
      description: Wants to configure Content Security Policy directives with the explicit
        https:// protocol and correct iframe frame-ancestors values, so that
        CSP-protected resources and iframes load successfully in iOS native
        mobile apps built with MABS 12 or later on ODC.
    - name: CSP mobile app propagation
      id: csp-mobile-app-propagation
      description: Wants to understand how activating, updating, or
        deactivating a CSP for a stage propagates to already-installed ODC
        mobile apps, including that no new build is required, changes are
        delivered via a native caching system over HTTP headers, a bundled
        fallback policy applies if the app launches offline right after
        install, and updates are fetched the next time the app is online, so
        that they can predict when CSP changes take effect for existing
        installs.
    - name: CSP misconfiguration risks
      id: csp-misconfiguration-risks
      description: Wants to understand common CSP misconfiguration risks, including missing
        policies breaking functionality, overly permissive wildcard sources
        enabling malicious redirects, omitting the explicit https:// protocol,
        and exceeding the per-stage directive character limit, so that they can
        plan and test a CSP configuration that's neither too restrictive nor too
        permissive.
    - name: Activate CSP for a stage
      id: activate-csp-stage
      description: Wants to activate a Content Security Policy for a stage
        in ODC Portal by toggling CSP status to active, requiring CSP
        Management permissions, so that default restrictive directives are
        automatically applied to protect all apps in that stage.
    - name: Configure CSP directive values
      id: configure-csp-directive-values
      description: Wants to customize CSP directive values, or reset them
        to defaults, in ODC Portal to match their app's specific external
        service dependencies, plugins, and resources, so that the CSP
        allow list permits necessary domains while blocking everything
        else.
    - name: CSP default and required values
      id: csp-default-required-values
      description: Wants to understand what each CSP default value and required value does
        and the impact of removing them, so that they can safely customize their
        app's CSP without breaking functionality.
- name: ODC Workflows
  guid: 8f3c2a1d-6e4b-4a7f-9c0d-2b5e7f1a4c9e
  topics:
  - name: Workflow editor
    id: workflow-editor
    subtopics:
    - name: Configure workflow start
      id: configure-workflow-start
      description: Wants to configure how a workflow begins execution by assigning
        a triggering event to the Start node in ODC's Workflow editor, so that
        the workflow launches automatically when that event occurs.
    - name: Workflow instance labels
      id: workflow-instance-labels
      description: Wants to create a custom instance label expression on the Start node,
        using the start event's input parameters, built-in runtime properties
        for identifying the instance, and built-in functions, in ODC's Workflow
        editor, so that workflow instances are easier to identify and
        troubleshoot in logs and the Portal.
    - name: Add decision activity
      id: add-decision-activity
      description: Wants to add a Decision activity to an ODC workflow, defining
        conditions on the outcomes to route execution down different paths
        based on data values, in ODC's Workflow editor, so that the workflow
        follows the correct path for each case.
    - name: Configure automatic path
      id: configure-automatic-path
      description: Wants to configure the automatic outcome path after a
        Decision activity in an ODC workflow, using automatic activities to
        run service actions and send notifications, in ODC's Workflow editor,
        so that the process completes without manual intervention when
        conditions are met.
    - name: Pause for manual review
      id: pause-for-manual-review
      description: Wants to pause a workflow with a Wait activity until a
        business event occurs, then hand off to a Human activity assigned to
        a role that closes on another event, in ODC's Workflow editor, so that
        a person can complete a required task before the workflow continues.
    - name: Create a workflow
      id: create-workflow
      description: Wants to implement a workflow in ODC Portal by creating it
        in the workflow editor, giving it a unique name, selecting the event
        that triggers the Start node, adding steps through to the End node,
        and publishing it, so that the workflow is ready to run in the app.
  - name: Test a workflow
    id: test-workflow
    description: Wants to verify a workflow works as expected before deploying
      it, by triggering its execution from the app and reviewing instance
      details and errors in the Instances tab of the ODC Portal, so that
      issues are caught before the workflow reaches production.
  - name: Deploy a workflow
    id: deploy-workflow
    description: Wants to deploy a workflow and its app to the QA stage and
      then to the Production stage, understanding that an impact analysis
      runs in the background before each deployment, so that the workflow
      becomes available to end users.
- name: Advanced workflows
  guid: 7a84e09e-c48c-404f-8d9f-728b9f78c88c
  topics:
  - name: Using callbacks
    id: using-callbacks
  - name: Best practices for scalable processes
    id: scalable-process-best-practices
  - name: Extend processes (process entities, APIs, reports)
    id: extend-processes-entities
  - name: Event driven processes
    id: event-driven-processes
  - name: Case Management Framework
    id: case-management-framework
    subtopics:
    - name: Bootstrap CMF app
      id: bootstrap-cmf-app
      description: Wants to create the foundational modules of a case management app
        (core services, workflow, and optional UI) using the Case Management Framework
        in OutSystems 11, so that the basic app structure is in place and ready for
        further case development.
    - name: Bootstrap case config
      id: bootstrap-case-config
      description: Wants to create a bootstrapping timer action that registers the
        case definition and case status definitions into the Case Management Framework
        every time the core services module is published in OutSystems 11, so that
        the configuration is automatically kept in sync with the module.
    - name: Define case status
      id: define-case-status
      description: Wants to define a new case status by adding a record to the
        CaseStatusConfiguration static entity in the core services module in
        OutSystems 11, so that the bootstrapping action can register it with the
        case definition and it becomes available for assignment to case instances.
    - name: Update case status
      id: update-case-status
      description: Wants to update the status of an existing case instance using
        the Case_UpdateStatus action from the CaseServices_API module in OutSystems
        11, so that a case moves to a new valid status when the required conditions
        (valid case ID, valid status, valid state-machine transition) are met.
    - name: Manage CMF delegation
      id: manage-cmf-delegation
      description: Wants to enable users to create, update, or delete a case or
        activity delegation in OutSystems 11 using the Delegation_Create,
        Delegation_CreateOrUpdate, Delegation_Update, and Delegation_Delete actions
        in the CaseConfigurations_API module, so that work can be reassigned to
        another user either for a set time period or indefinitely.
    - name: Use CMF delegation
      id: use-cmf-delegation
      description: Wants to validate an active delegation, retrieve existing
        delegations by ID or user, and correctly pass the DelegatedBy attribute
        when calling case and activity actions in OutSystems 11 using the
        CaseServices_API module, so that delegated actions are properly authorized
        and logged in case history.
    - name: Understand GroupExtended
      id: understand-group-extended
      description: Wants to understand what the GroupExtended entity is in the
        Case Management Framework in OutSystems 11, including how it extends the
        Group system entity, how it supports assigning activities to groups,
        managing group-based case permissions, defining group hierarchies, and
        associating calendars, so that they can decide how to model user groups
        in their case management app.
    - name: Bootstrap CMF groups
      id: bootstrap-cmf-groups
      description: Wants to set up extended case management groups by creating
        a GroupExtendedConfiguration static entity, a Bootstrap_Groups timer,
        and wiring the GroupExtended_CreateOrUpdate action in OutSystems 11,
        and then add group records to the configuration module, so that groups
        are registered in the Group and GroupExtended entities when the module
        is published.
    - name: List case activities
      id: list-case-activities
      description: Wants to retrieve a list of activities assigned to a logged-in
        case worker by adding the Case_GetActivities action and related static
        entity dependencies to the UI module and wiring a Data Action in
        OutSystems 11, so that the activity list can be used as the data source
        for a Table or List widget.
    - name: Enrich activity list
      id: enrich-activity-list
      description: Wants to enrich an activity list with case business entity
        data by modifying the Data Action output parameter to a Record list and
        iterating with a For Each, Aggregate, and ListAppend in OutSystems 11,
        so that case workers can see supplementary case information (such as a
        support ticket subject) alongside each activity.
    - name: List requester cases
      id: list-requester-cases
      description: Wants to retrieve a list of cases created by a logged-in
        requester by adding the Case_GetCases action and RequesterScope static
        entity dependencies to the UI module and wiring a Data Action in
        OutSystems 11, so that the case list can be used as the data source for
        a Table or List widget.
    - name: Enrich requester case list
      id: enrich-requester-case-list
      description: Wants to enrich a requester case list with case business
        entity data by modifying the Data Action output parameter to a Record
        list and iterating with a For Each, Aggregate, and ListAppend in
        OutSystems 11, so that requesters can see supplementary case information
        (such as a support ticket subject) alongside each case they created.
    - name: Translate CMF entities
      id: translate-cmf-entities
      description: Wants to add locales to the Data tab and translate the CMF
        static entities (CaseDefinitionConfiguration, CaseStatusConfiguration,
        Milestones, CaseActions) in the core services module in OutSystems 11,
        so that the Case Management Framework app displays text in the correct
        supported language for end users.
    - name: Enable CMF locale
      id: enable-cmf-locale
      description: Wants to create a SetupCaseConfiguration_Locale server action
        that calls SetCurrentLocale and appends translation records for the case
        definition and case status static entities in OutSystems 11, so that the
        case management app resolves labels in the correct language for a given
        locale at runtime.
    - name: Adapt CMF bootstrap
      id: adapt-cmf-bootstrap
      description: Wants to call the SetupCaseConfiguration_Locale action once
        per target locale in the Bootstrap_CaseConfiguration timer action,
        chaining each call's SetupData output as the next call's input in
        OutSystems 11, so that all desired locale translations are registered
        every time the core services module is published.
    - name: Understand rules engine
      id: understand-rules-engine
      description: Wants to understand the four components of the rules engine
        in the Case Management Framework (Rule, Rule Group, Rule Line, Rule
        Group Output), how they relate to each other, and what result types a
        rule can return, in OutSystems 11, so that they can model business rules
        correctly before setting them up.
    - name: Set up CMF rule
      id: set-up-cmf-rule
      description: Wants to set up a rule in the Case Management Framework by
        creating the Rule, Rule Group, Rule Line, and Rule Group Output records
        using the CaseServices_API in OutSystems 11, so that a business rule is
        ready to be evaluated in a case management application.
    - name: Evaluate CMF rule
      id: evaluate-cmf-rule
      description: Wants to evaluate a rule in the Case Management Framework by
        calling the execution actions in the CaseServices_API Rules Engine folder
        in OutSystems 11, so that the rule result can be used in a case management
        application's logic.
    - name: Fix duplicate transition
      id: fix-duplicate-transition
      description: 'Wants to fix the "We found more than one record for this
        transition" error by deactivating the duplicate CaseStateMachine
        record for a given CaseStatusId and NextCaseStatusId pair using the
        CaseStateMachine_Update action in OutSystems 11, so that the Case
        Management Framework can execute CaseStateMachine_GetByTransition
        successfully.'
    - name: Fix duplicate access grant
      id: fix-duplicate-access-grant
      description: 'Wants to fix the "Access permissions for that Case Definition
        have already been granted to that user/group" error by verifying the
        input parameters passed to the Case Management Framework''s access-granting
        action using Service Studio''s Debugger in OutSystems 11, so that the
        action isn''t called again for a user/group that already has access to
        that case definition.'
    - name: Fix CMF email destination
      id: fix-cmf-email-destination
      description: 'Wants to fix the "Set a destination to send the email" error
        by filling in at least one of the To, Cc, Bcc, ToGroupId, CcGroupId, or
        BccGroupId inputs before calling Email_Send in the Case Management
        Framework in OutSystems 11, so that the framework can successfully
        execute the action.'
    - name: Fix rule data type
      id: fix-rule-data-type
      description: 'Wants to fix the "There was an error processing this rule
        expression. <data-type> can''t be compared with <data-type>" error by
        rewriting the rule so its left and right attribute data types are
        comparable in the Case Management Framework in OutSystems 11, so that
        the rule executes successfully.'
    - name: Fix rule output type
      id: fix-rule-output-type
      description: 'Wants to fix the "The expected rule output type does not
        match this rule type" error by updating the RuleTypeId input value to
        match the configured rule type using the Rule_CreateOrUpdate action in
        the CaseConfigurations_API module in OutSystems 11, so that the Case
        Management Framework can successfully execute the rule.'
    - name: Fix activity action ID
      id: fix-activity-action-id
      description: 'Wants to fix the "Unknown activity action. It must match one
        from ActivityAction." error by verifying the ActivityActionId input
        value against the ActivityAction static entity in the
        CM_ProcessServices_BL module using Service Studio''s Debugger before
        calling Case_PerformActionActivity in the Case Management Framework in
        OutSystems 11, so that the action executes successfully.'
    - name: Fix case purge error
      id: fix-case-purge-error
      description: 'Wants to fix the "Case Definition with the Id
        <case-definition-identifier-value> can''t be purged. Change the
        PurgeTypeId to allow it." error by updating the case definition''s
        PurgeTypeId, DaysToPurgeCase, and DaysToPurgeProcess attributes using
        the CaseDefinition_Update action from the CaseConfigurations_API
        module, or by filling in the missing attributes in the Bootstrap/Setup
        input structures, in OutSystems 11, so that the Case Management
        framework can successfully execute the CaseDefinition_Purge action.'
    - name: Fix activity case mismatch
      id: fix-activity-case-mismatch
      description: 'Wants to fix the "Activity with Id
        <activity-identifier-value> does not belong to Case with Id
        <case-identifier-value>" error by verifying the Activity Identifier
        input value belongs to a process associated with the given case using
        Service Studio''s Debugger before calling Case_DiscardActivity in the
        Case Management Framework in OutSystems 11, so that the action
        executes successfully.'
    - name: Fix invalid GUID
      id: fix-invalid-guid
      description: 'Wants to fix the "<record> Id is not a valid GUID:
        <input-parameter-value>" error by verifying the input parameter''s
        value is a properly formatted GUID using Service Studio''s Debugger
        in OutSystems 11, so that the Case Management Framework action
        executes successfully.'
- name: App Configuration Management
  guid: 22a71e1c-da01-468c-9633-29c791104e7e
  topics:
  - name: App configuration
    id: app-configuration
    subtopics:
    - name: Configure app settings after a deployment
      id: config-app-after-deploy
    - name: App settings
      id: app-settings
    - name: Set app setting secret
      id: set-app-setting-secret
      description: Wants to mark or unmark an app setting as secret in ODC
        Studio and configure its per-stage value in the ODC Portal, so that
        sensitive setting values stay encrypted and hidden, understanding
        that reverting to non-secret clears the value on publish.
    - name: Configure app properties
      id: configure-app-properties
      description: Wants to configure an app, library, or mobile library's general
        properties in ODC Studio, covering identity/branding details and
        advanced behavior settings, so that the app looks and behaves as
        intended.
    - name: Customize validation messages
      id: customize-validation-messages
      description: Wants to customize the validation and upgrade messages shown to
        end users of an app, library, or mobile library, by editing the Messages
        settings page in ODC Studio, so that error and upgrade notifications match
        the app's language, tone, or branding requirements.
    - name: Configure app settings before a deployment
      id: config-app-before-deploy
    - name: Trace query origin
      id: trace-query-origin
      description: Wants to trace a slow SQL query generated by OutSystems back
        to the exact module, screen/action, and Aggregate or SQL element that
        produced it, by enabling the "Add Query Origin to Generated SQL" setting
        in the Factory Configuration component and republishing affected modules,
        in OutSystems 11, so that DBAs can inform developers of the precise
        location of an underperforming query.
    - name: Factory Configuration overview
      id: factory-configuration-overview
      description: Wants to understand what the Factory Configuration Forge plugin is
        and how to install it from Forge for OutSystems 11, so that they can use it
        to manage web.config shared configurations and platform-level settings across
        their Service Center Factory.
    - name: Use settings in logic
      id: use-settings-in-logic
      description: Wants to reference an app setting's value in server-side
        logic (server actions) and client-side logic (client actions) in
        ODC Studio, using a Settings expression directly on the server and
        a wrapper server action for the client, so that hardcoded values
        are avoided and secret settings stay on the server.
    - name: Shared configurations
      id: factory-configuration-shared-configs
      description: Wants to create shared configurations in Factory Configuration using
        XSLT templates (from scratch or pre-made samples) and associate them with eSpaces
        in Service Center, so that web.config customizations persist across module
        deployments in OutSystems 11.
    - name: Platform configurations
      id: factory-configuration-platform-configs
      description: Wants to understand which internal platform configurations are available
        in Factory Configuration's Platform Configurations tab (such as brute force
        protection, slow query threshold, and remember login settings) and what database
        parameters they control, so that they can tune platform-wide behavior in
        OutSystems 11.
  - name: Runbooks for app configuration management
    id: runbook-config-mgmt
    subtopics:
    - name: Manual runbooks for app configuration
      id: manual-runbook-config
  - name: Automated runbooks for app configuration management
    id: automated-runbook-mgmt
    subtopics:
    - name: Automated runbooks for app configuration
      id: automated-runbook-config
- name: App architecture
  guid: 6c1b124d-3ad6-456a-926c-0a843667cd0a
  topics:
  - name: Refactoring
    id: refactoring
    subtopics:
    - name: Convert to library
      id: convert-to-library
      description: Wants to convert an existing Mobile or Reactive module to a
        Library module in OutSystems 11, including resolving disallowed elements
        and TrueChange errors before conversion, so that the module publishes
        successfully as a Library.
  - name: Validating your application architecture
    id: validate-app-architecture
    subtopics:
    - name: Reduce module size
      id: reduce-module-size
      description: Wants to reduce the size of an OutSystems 11 module by identifying
        and fixing its main causes, monolithic single-module architecture, large
        images, large resources, and numerous custom icons, so that the module
        publishes, deploys, and runs efficiently.
  - name: Architecture Canvas
    id: architecture-canvas
  - name: Application composition
    id: application-composition
    subtopics:
    - name: Library module overview
      id: library-module-overview
      description: Wants to understand what a Library module is in OutSystems 11, including
        its stateless, database-agnostic design principles, typical use cases
        such as UI/style guides and reusable connectors or logic utilities,
        which Service Studio elements are available or restricted in a Library,
        and what reference restrictions apply to it, so that they can decide
        when and how to use Libraries in their application architecture.
    - name: Create a Library module
      id: create-library-module
      description: Wants to create a new Library module in Service Studio, by
        creating a Mobile or Reactive Web app (or adding a module to an existing
        one) and choosing Library as the module type, and knows to set the entry
        module to a consuming module when debugging it, so that they have a
        working Library ready to hold reusable stateless components.
    - name: ODC library overview
      id: odc-library-overview
      description: Wants to understand what a library is in OutSystems Developer
        Cloud (ODC), including its stateless design, common use cases such as
        wrapping an external system or centralizing style guides and themes, and
        its role as a shared, cross-portfolio building block with an independent
        lifecycle, so that they can decide when to use a library in their app
        architecture.
  - name: Core module patterns
    id: core-module-patterns
    subtopics:
    - name: Core entity pattern
      id: core-entity-pattern
      description: Wants to understand the core entity pattern in OutSystems 11 — how
        a core module stores data in entities exposed as read-only and centralizes all
        create/update operations — so that multiple applications can consume core business
        data consistently without bypassing the module's encapsulation.
    - name: ECS pattern variations
      id: ecs-pattern-variations
      description: Wants to understand the external core service (ECS) pattern and its
        variations — base ECS, local replica, isolated synchronization, direct integration,
        pub/sub, summary cache, and lazy load — in OutSystems 11, so that the right caching
        and synchronization strategy can be selected when an external system is the system
        of records.
    - name: Transparency service
      id: transparency-service-pattern
      description: Wants to understand the transparency service pattern in OutSystems 11,
        where an integration service with multiple drivers abstracts several external systems
        behind a uniform API, so that core services can retrieve and update data without
        knowing which external system holds it.
    - name: Module reference trade-offs
      id: module-reference-tradeoffs
      description: Wants to understand how to manage module references in OutSystems 11
        — including avoiding circular references, choosing between structures and entities
        for large record flows, and evaluating local web services versus public actions —
        so that the application's reference model stays simple, deployment times are
        minimized, and thread exhaustion is avoided.
    - name: Encapsulate REST APIs
      id: encapsulate-rest-apis
      description: Wants to understand why and how to encapsulate REST API consumption
        inside an ODC library, exposing server actions and public structures instead of
        consuming REST methods directly in the app, so that changes to the REST interface
        only need to be updated once and breaking changes can be managed through library
        versioning.
  - name: Session management
    id: session-management
    subtopics:
    - name: Session lifecycle
      id: session-lifecycle
      description: Wants to understand how a session is created, maintained, and
        ended in OutSystems Traditional Web Apps — including differences between
        Web, Web Service, and Timer sessions — so that they can reason about when
        session state is available during their application's execution.
    - name: Configure session timeout
      id: configure-session-timeout
      description: Wants to configure how long an idle Traditional Web App session
        remains active before the Platform Server automatically ends it, by adjusting
        the session timeout value in the machine.config file, so that end users
        get a session duration appropriate to their app's needs.
    - name: Session variables
      id: session-variables
      description: Wants to understand how session variables persist data during
        a Traditional Web App session — including built-in read-only variables like
        Username and TerminalType, defining custom session variables, their behavior
        in asynchronous logic and consumer/producer module scenarios, and performance
        implications of storing large data — so that they can design session state
        usage correctly for their application.
    - name: Configure tenant sessions
      id: configure-tenant-sessions
      description: Wants to configure how OutSystems 11 binds an end-user's session
        to their tenant during login, including using the default Users application
        versus a custom User Provider with the TenantSwitch system action, so that
        queries and aggregates are automatically scoped to the correct tenant's
        data.
  - name: Mobile libraries
    id: mobile-libraries
    subtopics:
    - name: Mobile libraries overview
      id: mobile-libraries-overview
      description: Wants to understand what mobile libraries are in ODC, how they
        differ from general-purpose libraries in terms of target platform,
        extensibility configurations, and UI component options, and their key use
        cases such as plugin wrappers and reusable mobile UI components, so that
        they can decide when to build a mobile library instead of a general-purpose
        library.
  - name: Library versioning
    id: library-versioning
    subtopics:
    - name: Library revision vs. version
      id: library-revision-vs-version
      description: Wants to understand the distinction between a library's revision
        number and version number in ODC, so that they can choose the right
        update flow for each type of change.
    - name: Test a library revision
      id: test-library-revision
      description: Wants to test a library revision in a test app in ODC before
        releasing it, so that library changes don't break consumers.
    - name: Release a new library version
      id: release-library-version
      description: Wants to release a new library version in ODC using semantic
        versioning and release notes, so that consumers can adopt updates with
        clear compatibility expectations.
    - name: Review accepted library updates
      id: review-accepted-library-updates
      description: Wants to review accepted library updates in consuming apps or
        libraries in ODC, so that they can verify update impact before deciding
        on follow-up actions.
    - name: Roll back accepted library updates
      id: roll-back-accepted-library-updates
      description: Wants to roll back accepted library updates in consuming apps
        or libraries in ODC when needed, so that they can recover safely from
        breaking updates.
  - name: Multi-portfolio architecture
    id: multi-portfolio-architecture
    subtopics:
    - name: Portfolio overview
      id: portfolio-overview
      description: Wants to understand what a portfolio is in OutSystems
        Developer Cloud (ODC), including its place in the organization >
        portfolio > stage > asset hierarchy, the benefits of isolating
        assets by non-functional requirements or governance rules, and
        common use cases (different identity providers, compliance
        boundaries, department-specific delivery, shared building-block
        libraries), so that they can decide whether and how to adopt a
        multi-portfolio structure.
    - name: Identify cross-portfolio needs
      id: identify-cross-portfolio-needs
      description: Wants to identify which business concepts, logic/UI components,
        or data need to be shared across portfolios in a multi-portfolio
        organization, so that they can extract shared functionality into
        libraries or expose it via REST APIs.
    - name: Own shared portfolio libraries
      id: own-shared-portfolio-libraries
      description: Wants to establish clear ownership and governance for
        libraries shared across portfolios, including using a dedicated shared
        building blocks portfolio owned by a platform group or Center of
        Excellence (CoE), so that other portfolios can adopt library updates
        on their own schedule without affecting release cadence.
    - name: Dual-exposure pattern
      id: dual-exposure-pattern
      description: Wants to expose the same business logic both within a
        portfolio (via a service action) and to other portfolios (via a REST
        API) by wrapping both around a shared internal server action, so that
        logic isn't duplicated when assembling a complete multi-portfolio
        architecture.
    - name: Reuse across portfolios
      id: reuse-across-portfolios
      description: Wants to choose between a library (for shared logic) and a
        REST API (for shared data) to share an asset across portfolios in ODC,
        understanding which elements are available cross-portfolio and how to
        manage REST API breaking changes for other portfolios' consumers, so
        that they pick the correct mechanism and avoid disrupting
        cross-portfolio consumers.
    - name: Portfolio boundary design
      id: portfolio-boundary-design
      description: Wants to decide portfolio boundaries by grouping apps that
        share service actions, entities, or bounded-context logic together and
        choosing the correct portfolio at asset creation, since ODC doesn't
        support moving assets between portfolios afterward, so that consumer
        apps keep working and rework is avoided.
    - name: Per-portfolio configs
      id: per-portfolio-configs
      description: Wants to configure portfolio-specific settings, such as REST
        API endpoint URLs, identity providers, and connection strings or
        credentials, when consuming a REST API from another portfolio, so
        that each stage authenticates and connects correctly per portfolio.
    - name: Forge asset ownership
      id: forge-asset-ownership
      description: Wants to understand that in a multi-portfolio ODC
        organization, an installed Forge asset is permanently owned by the
        portfolio chosen at installation (following its stages,
        configurations, and access controls), and that install/update
        permissions, plus any dependencies Forge installs, are scoped to
        that same portfolio, so they select the correct portfolio and
        confirm they have the right permissions before installing or
        updating a Forge asset.
    - name: Clone Forge asset
      id: clone-forge-asset
      description: Wants to clone a locked, installed Forge asset into a
        different portfolio in a multi-portfolio ODC organization when they
        need to modify its implementation, understanding that the clone
        becomes an independent editable copy following the target
        portfolio's stages and access controls while apps keep referencing
        the original until updated, so they can safely customize Forge
        assets without affecting other portfolios.
    - name: Asset & config scope
      id: asset-and-config-scope
      description: Wants to know which types of assets and platform configurations are
        shared across portfolios versus scoped to a single portfolio or
        portfolio stage in ODC, so that they can plan where to create assets and
        apply configurations correctly.
    - name: Confirm portfolio structure for migration
      id: confirm-portfolio-structure
      description: Wants to confirm the target portfolio structure for an ODC
        organization that already has existing apps and libraries before
        starting an incremental migration, so that assets are grouped
        correctly and existing deployments keep working throughout the
        transition.
    - name: Refactor dependencies for portfolio migration
      id: refactor-portfolio-dependencies
      description: Wants to refactor dependencies among existing apps and
        libraries before separating them across ODC portfolios, so that
        cross-portfolio consumers keep working during an incremental
        migration.
    - name: Prepare stages for portfolio migration
      id: prepare-portfolio-stages
      description: Wants to prepare portfolio stages for migrating existing
        apps and libraries incrementally in ODC, so that each asset group can
        be moved and validated in the right environment sequence without
        disrupting active deployments.
    - name: Update roles for portfolio migration
      id: update-portfolio-roles
      description: Wants to update portfolio access roles before and during an
        incremental migration of existing apps and libraries in ODC, so that
        the right teams can manage each portfolio without blocking ongoing
        deployments.
    - name: Migrate asset groups incrementally
      id: migrate-asset-groups-incrementally
      description: Wants to migrate one asset group at a time to portfolios in
        an ODC organization that already has existing apps and libraries,
        validating end-to-end flows before retiring the prior
        implementation, so that existing deployments keep working throughout
        the transition.
- name: Asynchronous processes
  guid: d4964d80-c8da-468a-ab3c-8f59aab61aa5
  topics:
  - name: How to process data using Timers
    id: process-data-timers
    subtopics:
    - name: Timer best practices
      id: timer-best-practices
      description: Wants to implement a long-running Timer correctly by applying best
        practices (timeout prevention, idempotent commits, completeness through batching,
        chaining execution to continue processing when more records remain, and data
        integrity), so that the Timer never aborts due to timeout and all records are
        eventually processed without data corruption or repeated work.
    - name: Configure timer settings
      id: configure-timer-settings
      description: Wants to configure a Timer's schedule (Daily, Weekly, Monthly, When
        Published, Run Now), timeout, and active flag in ODC Portal per deployment stage,
        so the Timer runs at the right time, within resource limits, and with appropriate
        values in each environment.
    - name: Monitor timer logs
      id: monitor-timer-logs
      description: Wants to monitor timer execution by viewing timer logs in the ODC
        Portal, so that they can check whether a timer is running, review its last
        execution time and duration, and investigate errors using log details and
        related activities.
  - name: How to process massive amounts of data in Batch Processing
    id: batch-data-processing
- name: Basic integrations
  guid: c0892f27-0055-4fe6-bb6f-e5a308d37b2a
  topics:
  - name: Integration Patterns - Basics (decision tree)
    id: integration-pattern-basics
  - name: HTTP library actions
    id: http-library-actions
    subtopics:
    - name: Inspect HTTP request
      id: inspect-http-request
      description: Wants to read details of the current HTTP request, such as
        cookies, headers, HTTP method, URL, domain, and submitted files, using
        the ODC HTTP library's Request_Get* actions, in ODC Studio, so that
        server-side logic can react to incoming request data.
    - name: Customize HTTP response
      id: customize-http-response
      description: Wants to customize the current HTTP response by adding a header, setting
        a cookie, or setting the status code, using the ODC HTTP library's
        response actions, in ODC Studio, so that server-side logic can control
        what's sent back to the client.
    - name: Build and submit HTTP URLs
      id: build-submit-http-urls
      description: Wants to generate an absolute URL, replace a URL's domain,
        and submit an outbound HTTP GET request, using the ODC HTTP library's
        Request_AbsoluteURL, Request_ReplaceDomain, and
        Request_SubmitGetRequest actions, in ODC Studio, so that apps can
        normalize URLs and call external HTTP endpoints.
  - name: Expose webservices
    id: expose-webservices
    subtopics:
    - name: Define methods
      id: define-methods
    - name: Error codes
      id: error-codes
    - name: Document APIs
      id: document-apis
    - name: Develop the logic of web services
      id: webservice-logic-dev
    - name: Test SOAP with SoapUI
      id: test-soap-soapui
      description: 'Wants to test a SOAP web service method built in OutSystems by installing
        SoapUI, generating a project from the service''s WSDL, submitting a sample request,
        and inspecting the success/error XML response, so that the method''s behavior can
        be verified before considering it complete.'
    - name: Troubleshoot webservices
      id: troubleshoot-webservices
    - name: Fix REST param type
      id: fix-rest-param-type
      description: 'Wants to fix the "Cannot send a ''Binary Data''/''List''
        parameter" error in a REST API method request in Service Studio for
        OutSystems 11, caused by setting a request parameter to the Binary
        Data or List data type when the method''s request format doesn''t
        support it, by changing the parameter''s data type or the method''s
        request format, so that the REST API method compiles and publishes
        successfully.'
    - name: Fix REST date format
      id: fix-rest-date-format
      description: 'Wants to fix the "Incompatible Date Formats" error in a REST
        API method in Service Studio for OutSystems 11, caused by
        request/response example date values not matching the REST API''s
        configured Date Format property, by changing the API''s Date Format
        property or the example''s date values, so that the REST API method
        compiles and publishes successfully.'
    - name: Fix invalid request format
      id: fix-invalid-request-format
      description: 'Wants to fix the "Invalid Request Format" error for a REST
        API method in Service Studio for OutSystems 11, caused by an invalid
        or missing Request Format property, or by a mismatch between the
        Request Format property and the body input''s data type, by
        correcting the Request Format property or the input parameters, so
        that the REST API method compiles and publishes successfully.'
    - name: Fix invalid response format
      id: fix-invalid-response-format
      description: 'Wants to fix the "Invalid Response Format" error for a REST
        API method in Service Studio for OutSystems 11, caused by an invalid
        or missing Response Format property, by correcting the property or
        removing the output parameters, so that the REST API method compiles
        and publishes successfully.'
    - name: Fix invalid receive in error
      id: fix-invalid-receive-in-error
      description: 'Wants to fix the "Invalid Receive In" error for a REST API
        output parameter in Service Studio for OutSystems 11, caused by an
        output parameter''s data type only being allowed to be received in
        the request body, by correcting the parameter''s ''Receive In''
        property, so that the REST API method compiles and publishes
        successfully.'
  - name: Consume webservices
    id: consume-webservices
    subtopics:
    - name: Authenticate SOAP service
      id: authenticate-soap-service
      description: 'Wants to fix a 401 Unauthorized error when consuming an
        authenticated SOAP web service in OutSystems 11 by saving the WSDL
        locally and importing it from the file system, and by setting the
        username and password with the EnhancedWebReferences extension''s
        SetWebReferenceCredentials action, so that the web service can be
        consumed successfully.'
    - name: Changing endpoints
      id: changing-endpoints
    - name: Consume and refresh methods
      id: consume-refresh-methods
    - name: Show webservice errors
      id: show-webservice-errors
      description: Wants to handle the outcome of a webservice method call in the
        application logic by checking the method's Result.Success output and
        displaying the Result.ErrorMessage in a feedback message when it's false,
        so that end users are informed when an operation like deleting a record
        fails.
    - name: Structures
      id: structures
    - name: Consume SAP OData
      id: consume-sap-odata
      description: Wants to consume an SAP OData service in OutSystems 11 by downloading
        the JSON Swagger specification from SAP API Business Hub and importing it via
        Service Studio's REST consumer in a dedicated module, so that SAP data and
        operations are available as server actions in the application.
    - name: Fix OData dollar params
      id: fix-odata-dollar-params
      description: Wants to work around SAP OData's $-prefixed system query parameter
        encoding issue by implementing an OnBeforeRequest handler in Service Studio
        that re-adds the dollar sign to matching URL query parameters before each
        request, so that filters, ordering, pagination, and other OData system options
        are transmitted correctly.
    - name: Handle SAP OData errors
      id: handle-sap-odata-errors
      description: Wants to implement an OnAfterResponse handler in Service Studio
        that parses SAP OData error responses across three formats (data errors, fault
        errors, and API errors) and throws typed exceptions, so that error handling
        logic in the consuming application can respond appropriately to different
        failure modes.
- name: Basic workflows
  guid: 368a1c9e-0f21-4970-9645-577590bbf1ca
  topics:
  - name: Emails
    id: emails
    subtopics:
    - name: How to send emails
      id: how-to-send-emails
    - name: How to create emails
      id: how-to-create-emails
    - name: Validate email address
      id: validate-email-address
      description: Wants to check whether a text string is a properly formatted
        email address using the EmailAddressValidate built-in function, which
        follows the HTML5 email validation spec, in Service Studio for O11, so
        that they can validate user input before using it in email operations.
    - name: Email link variable
      id: email-link-variable
      description: Wants to generate a direct link to a specific record by building
        the URL with GetEntryURL in the email's Preparation action and passing it
        as an input parameter, in Service Studio for O11 Traditional Web Apps, so
        that clicking the link in the email takes the user straight to that record's
        page instead of a generic landing page.
    - name: Translate email locale
      id: translate-email-locale
      description: Wants to translate the content of an OutSystems email that's
        sent in the default language despite the triggering screen being localized,
        by setting the locale in the email's Preparation action with SetCurrentLocale
        (optionally reading the prior locale via GetCurrentLocale), in Service
        Studio for O11, so that the email is sent in the same language as the
        user's session.
    - name: Find last sent email
      id: find-last-sent-email
      description: Wants to find the timestamp of the last sent email in
        OutSystems 11, either by referencing the Sent_Email and Email_Status
        entities' Sent attribute in Service Studio, or by checking the Email
        Log screen in Service Center's Monitoring tab, so that they can
        verify when an email was actually sent.
    - name: Attach file to email
      id: attach-file-to-email
      description: Wants to attach a file to an outgoing email by configuring the Attach
        File action's required and optional properties in Service Studio for
        O11, so that recipients receive the supporting file directly within the
        email rather than through a separate channel.
  - name: BPT
    id: bpt
    subtopics:
    - name: Connecting processes to the UI
      id: connect-process-ui
    - name: Understanding asynchronous processes
      id: async-processes-basics
    - name: Triggering processes, process flows
      id: trigger-processes
    - name: Design process flow
      id: design-process-flow
      description: Wants to design the behavior of a process using the Process
        Flow editor after creating a process, selecting tools from the Process
        Flow Toolbox to be executed in the flow, so that the process's logic is
        defined.
    - name: Process upgrade impact
      id: process-upgrade-activity-impact
      description: Wants to understand how moving activities in a process flow
        affects executing process instances after publishing, in OutSystems 11,
        so that they can predict which instances get suspended and know to
        review them in Service Center.
    - name: BPMN notation
      id: bpmn-notation
    - name: Patterns for processes (automatic, human, decision)
      id: process-decision-patterns
    - name: Automatic activity errors
      id: automatic-activity-errors
      description: Wants to understand how errors are handled in an Automatic
        Activity in OutSystems 11, by knowing that on error the flow execution
        stops and automatically retries from the beginning until it succeeds
        or the process is terminated, so that they can monitor and resolve
        failing process activities through Service Center.
    - name: Automatic activity scope
      id: automatic-activity-scope
      description: Wants to know what elements are accessible when editing an
        Automatic Activity's flow in OutSystems 11 (process input/output
        parameters, local variables, invoked actions' and queries' output
        parameters), so that they can select the right variable in the
        Expression Editor or Select Variable window.
    - name: Archive BPT processes
      id: archive-bpt-processes
      description: Wants to archive old closed BPT Process instances by creating
        a mirrored set of meta-model entities and using Process_Delete or
        Process_BulkDelete from the BPT_API extension, in OutSystems 11, so
        that BPT queries stay performant as Process volume grows.
    - name: Fix BPT activity timeout
      id: fix-bpt-activity-timeout
      description: Wants to resolve a BPT automatic activity hitting the 5-minute
        timeout by moving the long-running batch logic into a Timer that signals
        the waiting process to proceed, in OutSystems 11, so that thread pool
        resources aren't exhausted and the process can continue.
    - name: Fix missing detail warning
      id: fix-missing-detail-warning
      description: 'Wants to fix the "Please set the ''<process>'' Process
        Detail property to display in Taskbox" warning in OutSystems 11, by
        setting the Detail property on the Human Activity or, if that''s
        unset, on the Process itself (directly, or via the Launch On
        entity''s Label Attribute), in Service Studio, so that a meaningful
        detail text appears under the activity in the Taskbox.'
  - name: Workflow Builder
    id: workflow-builder
    subtopics:
    - name: WFB overview
      id: wfb-overview
      description: Wants to understand what Workflow Builder is and who it's for,
        including business experts, analysts, process owners, IT managers, and
        developers, in OutSystems 11, so that they can decide whether it's the
        right tool for their business process app.
    - name: WFB app building steps
      id: wfb-app-building-steps
      description: Wants to build and publish a business process app in Workflow
        Builder by setting up a form, defining workflow steps, publishing to test,
        and sharing it with end-users via IT, in OutSystems 11, so that they can
        turn a business process into a working app.
    - name: WFB group naming
      id: wfb-group-naming
      description: Wants to understand how Workflow Builder automatically creates
        user groups in the OutSystems Users tool when an app is published to the
        development environment, including the naming conventions for requester and
        activity groups ([WB | App Name | Requesters] and [WB | App Name | Group name]),
        in OutSystems 11, so that IT teams can identify and configure the correct
        groups for end-user access.
    - name: WFB production handoff
      id: wfb-production-handoff
      description: Wants to understand the steps required to move a Workflow Builder
        app from development to production in OutSystems 11, including involving the
        IT team, sharing user group names, and having IT add users in the OutSystems
        Users tool, so that the app is ready for end users to access.
    - name: Update CM dependency
      id: update-cm-dependency
      description: Wants to install or update the Case Management framework
        dependency for a Workflow Builder app in OutSystems 11 by downloading
        the CMF .osp file from Workflow Builder's settings and publishing it
        through Service Center, so that Workflow Builder recognizes the app's
        dependencies as up to date.
    - name: WFB token error
      id: wfb-token-error
      description: Wants to resolve the "Token error" that occurs when Workflow
        Builder doesn't have a valid token to access the environment, by logging
        out and back in (or contacting support if the problem persists), in
        OutSystems 11, so that Workflow Builder can reconnect to the environment.
    - name: WFB app architecture
      id: wfb-app-architecture
      description: Wants to understand the architecture of a Workflow Builder
        generated app (built on Case Management Framework and Business Process
        Technology, including logic, UI, and data model) and how IT can extend
        it using Service Studio, in OutSystems 11, so that they can plan how to
        hand off and evolve the app after publishing.
    - name: WFB delete version error
      id: wfb-delete-version-error
      description: Wants to resolve the "Cannot remove case application version
        since it's not in Draft" error when deleting an application in Workflow
        Builder, by logging out and back in (or contacting support if the problem
        persists), in OutSystems 11, so that they can successfully delete the
        application version.
    - name: WFB icon save error
      id: wfb-icon-save-error
      description: Wants to resolve the "Cannot save icon in the storage" error
        that occurs when Workflow Builder can't save an application icon in
        storage, by retrying later, publishing without an icon, or contacting
        OutSystems Support if the problem persists, in OutSystems 11, so that
        they can proceed without the icon-save failure blocking their work.
    - name: WFB status update error
      id: wfb-status-update-error
      description: 'Wants to resolve the "Specified application version do not
        exists or the status update is invalid" error when performing an
        operation requiring an application status update in Workflow Builder,
        by logging out and back in (or contacting support if the problem
        persists), in OutSystems 11, so that they can successfully complete
        the status update.'
    - name: WFB icon size error
      id: wfb-icon-size-error
      description: 'Wants to resolve the "Application version icon is larger
        than <MaxSize>" error when uploading an icon that exceeds the max
        file size in Workflow Builder, by retrying with a smaller icon or
        contacting OutSystems Support if the problem persists, in OutSystems
        11, so that the application icon upload succeeds.'
    - name: WFB discard version error
      id: wfb-discard-version-error
      description: 'Wants to resolve the "Unable to discard version. It has
        published versions: <ApplicationVersionId>." error that occurs when
        trying to delete an application that''s already published but still
        displays as unpublished in Workflow Builder, by logging out and back
        in (or contacting support if the problem persists), in OutSystems 11,
        so that they can successfully delete the application.'
    - name: WFB attribute data error
      id: wfb-attribute-data-error
      description: 'Wants to resolve the "Attribute data is not valid:
        <OriginalErrorMessage>" error when creating or modifying a field
        with inconsistent data in Workflow Builder, by logging out and back
        in (or contacting support if the problem persists), in OutSystems 11,
        so that they can successfully save the field.'
    - name: WFB attribute type error
      id: wfb-attribute-type-error
      description: 'Wants to resolve the "Cannot change the type of an
        existing attribute: <Name> (<Id>)" error that occurs when trying to
        change the data type of a field that''s already published in
        Workflow Builder, by creating a new field with the desired data
        type instead, in OutSystems 11, so that the application field saves
        successfully.'
    - name: WFB attribute length error
      id: wfb-attribute-length-error
      description: 'Wants to resolve the "Cannot decrease the Length of an
        existing attribute: <Name> (<Id>)" error that occurs when trying to
        decrease the Length of a Text field that''s already published in
        Workflow Builder, by creating a new field with the desired Length
        instead, in OutSystems 11, so that the application field saves
        successfully.'
    - name: WFB dropdown id error
      id: wfb-dropdown-id-error
      description: 'Wants to resolve the "Cannot create new dropdown entry. Id
        is invalid for dropdown: <Name> (<Id>)" error that occurs when
        creating or updating a Dropdown field with inconsistent data in
        Workflow Builder, by deleting and re-creating the unpublished field
        (or contacting support if already published), in OutSystems 11, so
        that they can successfully save the field.'
    - name: WFB group create error
      id: wfb-group-create-error
      description: 'Wants to resolve the "Cannot create Group:
        <OriginalErrorMessage>" error that occurs when creating a group
        where the operation fails for some members, in Workflow Builder,
        by retrying the operation or contacting OutSystems Support if the
        problem persists, in OutSystems 11, so that they can successfully
        create the group.'
- name: Component testing
  guid: 7e2fb431-16fd-487e-8c9b-77fe350b092b
  topics:
  - name: Fundamentals of component testing strategies
    id: component-test-fundamentals
    subtopics:
    - name: Component testing strategies
      id: component-test-strategy
  - name: Manual component testing
    id: manual-component-testing
    subtopics:
    - name: Manual component tests
      id: manual-component-tests
  - name: Automated component testing
    id: component-test-automation
    subtopics:
