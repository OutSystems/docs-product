      id: assign-team-role
    - name: Create a team
      id: create-a-team
- name: Using audit logs for compliance and troubleshooting
  guid: c96ed7dd-90d2-406d-a816-c47269c0d20b
  topics:
  - name: Using audit logs for operational alerts
    id: alerts-audit-logs
    description: Can I detect when a deployment happened outside defined hours?
  - name: Using audit logs for troubleshooting
    id: troubleshoot-audit-logs
  - name: Which compliances can audit trail help me achieve
    id: compliance-audit-logs
  - name: User permissions for audit log access
    id: user-perms-audit-logs
    description: What is the permission model? For example, if I have access to only
      some apps, can I see audit logs for other apps for which I don't have permission?
      Is it per stage?
  - name: Events logged in the audit trail
    id: events-audit-logs
    description: 'Is operation XYZ in ODC Portal audited?

      What is the list of operations and for what scope for auditing?'
  - name: Understanding the structure and fields of an audit log
    id: struct-audit-logs
    description: 'What does each field mean?

      What fields exist?

      What values can each field hold?

      What does each possible value mean?'
  - name: Retention period available for audit trail
    id: retention-audit-logs
  - name: Methods for accessing audit log data
    id: access-audit-logs
    subtopics:
    - name: Stream audit logs
      id: stream-audit-logs
      description: Can I stream audit logs?
    - name: Exporting logs via CSV
      id: export-audit-logs
    - name: Viewing logs in the ODC Portal
      id: view-audit-logs
- name: Business Analysis
  guid: a3f7c821-56e4-4b2d-9d83-1e4c0f2d8b95
  topics:
  - name: Business Vision
    id: business-vision
    subtopics:
    - name: Vision document
      id: vision-document
      description: Wants to understand what a business vision document is and what
        goals it serves, when starting a new project, so that they can align business
        strategy, context, and challenges before development begins.
    - name: Vision statement
      id: vision-statement
      description: Wants to create a vision statement and vision cloud for a project,
        when conducting business analysis, so that they can articulate the primary
        business goals in an inspirational and actionable way.
    - name: Process diagrams
      id: process-diagrams
      description: Wants to create and scope process diagrams for a business vision
        document, when conducting business analysis, so that all stakeholders can
        visually understand the full business process beyond just the application scope.
    - name: Personas
      id: personas
      description: Wants to create personas for a business vision document by observing
        users in action and collecting statistics and context information for each,
        when conducting business analysis, so that they can understand each persona's
        contribution to strategic or tactical goals.
- name: O11 to ODC Migration
  guid: ''
  topics:
  - name: Code Conversion
    id: code-conversion
    subtopics:
    - name: Convert O11 code
      id: convert-o11-code
      description: Wants to understand how to convert O11 app code to ODC using the
        app conversion console, including what the tool does automatically, so that
        they can initiate the code conversion step in their migration plan.
    - name: Publish converted apps
      id: publish-converted-apps
      description: Wants to publish converted ODC apps and libraries after code conversion
        — including downloading each app file, opening it in ODC Studio, fixing dependency
        and TrueChange errors, and publishing producers before consumers — so that
        the converted apps are live in the target ODC stage.
    - name: Tag app before conversion
      id: tag-app-before-conversion
      description: Wants to know how to tag an O11 app in the source environment
        before starting the code conversion process, so that the correct app version
        is picked up by the app conversion console.
    - name: Troubleshoot code conversion
      id: troubleshoot-code-conversion
      description: Wants to identify and collect troubleshooting information when
        an O11 to ODC code conversion ends with errors — including reading conversion
        logs and exporting the troubleshooting zip file — so that they can diagnose
        the failure or provide the necessary data to OutSystems Support.
    - name: Adapt converted SQL
      id: adapt-converted-sql
      description: Wants to validate and adapt SQL nodes in a converted ODC app to
        ensure compatibility with Aurora PostgreSQL — including reviewing auto-converted
        queries, handling limitations (Expand Inline, external entities, BEGIN-END
        blocks), and testing all SQL nodes — so that the converted app's data queries
        work correctly in ODC.
    - name: SQL conversion mapping
      id: sql-conversion-mapping
      description: Wants to understand the exact syntax mappings applied automatically
        when converting O11 SQL nodes to ODC PostgreSQL — including general clauses,
        Oracle-specific functions, data type translations, string concatenation rules,
        temporary tables, and pattern matching — so that they can verify converted
        queries and anticipate what the conversion tool produces.
    - name: Adapt login flows
      id: adapt-login-flows
      description: Wants to manually adapt the login and logout flows of a converted
        ODC app so that end users can authenticate using their existing O11 credentials,
        so that the converted app is usable after migration.
    - name: Review converted app
      id: review-converted-app
      description: Wants to review the On Application Ready and On Application Resume
        event actions and the app and library properties of a converted ODC app, after
        the code conversion tool has merged multiple O11 modules, so that the resulting
        app behaves as expected and has the correct settings.
    - name: Configure converted apps
      id: configure-converted-apps
      description: Wants to configure a converted ODC app after code conversion —
        including Site Properties/Settings (secret and non-secret), custom domains,
        external databases, REST service endpoints, private gateways, and SMTP email
        — so that the app works correctly in ODC before testing and deploying it.
    - name: Connect ODC to O11
      id: connect-odc-to-o11
      description: Wants to verify that their ODC organization is connected to the
        correct O11 infrastructure and, in a multi-portfolio organization, set the
        target ODC portfolio for app conversion, in the ODC Portal, so that conversion
        plans from the Conversion Assessment Tool are available in the app conversion
        console.
    - name: Conversion prerequisites
      id: conversion-prerequisites
      description: Wants to understand the prerequisites and limitations for executing
        an O11 to ODC app conversion — including required infrastructure type, LifeTime
        version, prior preparation steps, and unsupported scenarios (self-managed,
        hybrid, demo environments, ODC self-hosted) — so that they can confirm whether
        their environment is ready before starting the conversion process.
  - name: Data Migration
    id: data-migration
    subtopics:
    - name: Data migration scope
      id: data-migration-scope
      description: Wants to understand what is included in an O11 to ODC data migration
        (entity data, repeat migrations, data model consistency requirements) and the
        available migration types (non-production vs production final), so that they
        can choose the right approach for their migration phase.
    - name: Migrate end users
      id: migrate-end-users
      description: Wants to understand how end-user migration works during O11 to ODC
        data migration, including IdP configuration requirements, one IdP per O11
        environment, user extension tables, role migration, and the option to skip
        end-user migration, so that they can prepare their environment and identity
        setup before migrating.
    - name: Cancel data migration
      id: cancel-data-migration
      description: Wants to know when and how to cancel an in-progress O11 to ODC data
        migration, and understand the impact on app data and end users depending on
        which phase is canceled, so that they can recover safely if a running migration
        needs to be aborted.
    - name: Execute data migration
      id: execute-data-migration
      description: Wants to execute the O11 to ODC data migration using the app conversion
        console in the ODC Portal — including selecting migration type, source environment,
        target stage, end-user migration options, and confirming the setup — so that
        app entity data and end users are transferred to ODC.
    - name: Configure end-user IdP
      id: configure-end-user-idp
      description: Wants to configure an identity provider in ODC for each O11 source
        environment and map it to a target ODC stage in the infrastructure settings,
        including selecting the user profile mapping and username prefix, so that end
        users can be migrated from that O11 environment.
    - name: Fix data migration errors
      id: fix-data-migration-errors
      description: Wants to identify and fix data model inconsistency errors that
        stop an O11 to ODC data migration — including missing entities or attributes,
        attribute property mismatches, and reference attribute mismatches — so that
        they can resolve the root cause and successfully retry the migration.
- name: Infrastructure Setup
  guid: a1c2e3f4-5b6d-7e8f-9a0b-1c2d3e4f5a6b
  topics:
  - name: Reverse Proxy Configuration
    id: reverse-proxy-configuration
    subtopics:
    - name: Configure SSL offloading
      id: configure-ssl-offloading
      description: Wants to configure SSL offloading for OutSystems 11 by setting
        the X-Forwarded-Proto HTTP header at the reverse proxy, inserting the HTTPtoHTTPSproxyHeader
        parameter into the OutSystems database, and configuring the trusted proxy
        address in Service Center, so that the platform correctly identifies and processes
        HTTPS requests when SSL is terminated at the proxy level.
    - name: Rewrite resource URLs
      id: rewrite-resource-urls
      description: Wants to rewrite absolute URLs in OutSystems application resources
        (HTML, CSS, JavaScript) at the reverse proxy level and disable content compression
        at both the platform and application-server level, so that all resource links
        remain valid when an extra path segment is introduced by the reverse proxy.
    - name: Expose app addresses
      id: expose-app-addresses
      description: Wants to configure the reverse proxy to translate their OutSystems
        application's internal address to its externally exposed address, including
        referenced content such as RichWidgets and other cross-app references, so
        that the application and its dependent resources are correctly reachable
        from the internet.
    - name: Adjust keep-alive timeout
      id: adjust-keep-alive-timeout
      description: Wants to configure the keep-alive connection timeout on an Apache-based
        reverse proxy to at least 30 seconds using the KeepAliveTimeout directive,
        so that OutSystems Mobile and Reactive Web apps do not encounter connection
        errors caused by the default 5-second timeout.
  - name: Redis in-memory sessions
    id: redis-in-memory-sessions
    subtopics:
    - name: Redis software prerequisites
      id: redis-software-prereqs
      description: Wants to know which Platform Server and Redis Server versions
        are required to use Redis for in-memory session storage in O11, so they
        can verify their environment meets the minimum software requirements before
        starting setup.
    - name: Redis hardware sizing
      id: redis-hardware-sizing
      description: Wants to understand the minimum hardware specifications for a
        Redis infrastructure — covering both non-productive and production (Redis
        Cluster) environments — so they can provision servers with the right CPU,
        RAM, storage, and network capacity before deploying Redis for OutSystems.
- name: Log streaming (O11)
  guid: 7f3c2a1e-84d0-4b5f-a9c3-e1d06f82b347
  topics:
  - name: Log Streaming overview
    id: log-streaming-overview
    subtopics:
    - name: Understand Log Streaming
      id: log-streaming-understand
      description: Wants to understand what Log Streaming is for a self-managed O11
        installation — including how the bundled Fluent Bit service reads JSON log
        files, transforms them into the Flat Format, and forwards them to an external
        tool — so that they can decide whether to adopt it and know what to expect
        before setup.
    - name: Enable Log Streaming
      id: log-streaming-enable
      description: Wants to enable and configure Log Streaming on a self-managed O11
        installation using the Configuration Tool GUI or CLI, including meeting
        prerequisites, configuring settings, setting up a multi-front-end farm, and
        disabling the feature, so that application logs are forwarded to an external
        observability or SIEM tool.
  - name: Log Streaming operations
    id: log-streaming-ops
    subtopics:
    - name: Troubleshoot Log Streaming
      id: log-streaming-troubleshoot
      description: Wants to diagnose and resolve Log Streaming issues on a self-managed
        O11 installation — using Test Connection, the Fluent Bit service log, the
        Windows Service console, and the metrics endpoint — so that they can identify
        why logs aren't arriving at a destination or the service isn't running.
    - name: Fix streaming timeout
      id: fix-streaming-timeout
      description: Wants to understand and resolve the OS-DP-STREAM-00004 "deadline
        exceeded" error — where the destination server responds with a gRPC 4 error
        when testing the streaming connection in O11 or ODC — so that they can restore
        log and observability data streaming to the destination APM tool.
    - name: Fix streaming not found
      id: fix-streaming-not-found
      description: Wants to understand and resolve the OS-DP-STREAM-00005 "not found"
        error — where the destination server responds with a gRPC 5 error when testing
        the streaming connection in O11 or ODC — so that they can restore log and
        observability data streaming by correcting the endpoint URL in LifeTime Log
        Streaming or the ODC Portal.
    - name: Fix streaming already exists
      id: fix-streaming-already-exists
      description: Wants to understand and resolve the OS-DP-STREAM-00006 "already
        exists" error — where the destination server responds with a gRPC 6 error
        when testing the streaming connection in O11 or ODC — so that they can restore
        log and observability data streaming by verifying the APM tool is working
        and re-establishing the connection.
    - name: Fix streaming permission denied
      id: fix-streaming-permission-denied
      description: Wants to understand and resolve the OS-DP-STREAM-00007 "permission
        denied" error — where the destination server responds with a gRPC 7 error
        when testing the streaming connection in O11 or ODC — so that they can restore
        log and observability data streaming by correcting the authentication credentials
        or endpoint URL in LifeTime Log Streaming or the ODC Portal.
    - name: Fix streaming resource exhausted
      id: fix-streaming-resource-exhausted
      description: Wants to understand and resolve the OS-DP-STREAM-00008 "resource
        exhausted" error — where the destination server responds with a gRPC 8 error
        when testing the streaming connection in O11 or ODC — so that they can restore
        log and observability data streaming by verifying the APM tool is working
        and re-establishing the connection.
    - name: Fix streaming failed precondition
      id: fix-streaming-failed-precondition
      description: Wants to understand and resolve the OS-DP-STREAM-00009 "failed
        precondition" error — where the destination server responds with a gRPC 9
        error when testing the streaming connection in O11 or ODC — so that they
        can restore log and observability data streaming by verifying the APM tool
        is working and re-establishing the connection.
    - name: Fix streaming unknown error
      id: fix-streaming-unknown
      description: Wants to understand and resolve the OS-DP-STREAM-00002 "unknown
        error reaching your destination server" error — where the destination server
        responds with a gRPC 2 (Unknown) error when testing the streaming connection
        in O11 or ODC — so that they can restore log and observability data streaming
        to the destination APM tool.
  - name: Fluent Bit configuration
    id: fluentbit-configuration
    subtopics:
    - name: Configure Fluent Bit output
      id: fluentbit-configure-output
      description: Wants to set up a Fluent Bit output plugin in custom.yaml on a
        self-managed O11 installation, including specifying the output name, match
        tags, match_regex, alias, and reliability settings such as retry_limit, so
        that logs are routed to the chosen APM or SIEM destination reliably.
    - name: Filter streaming logs
      id: fluentbit-filter-logs
      description: Wants to filter streamed logs in Fluent Bit on a self-managed O11
        installation by log type (using tag matching) or by application name (using
        the modify+grep workaround for flat-format field names), so that only the
        desired subset of records reaches a given output.
    - name: Enrich logs with metadata
      id: fluentbit-enrich-logs
      description: Wants to add static metadata fields, copy fields, or rename fields
        in Fluent Bit log records on a self-managed O11 installation using the modify
        filter and dotted-key names, so that streamed logs carry the additional context
        needed by the destination tool.
- name: O11 Data Migration
  guid: ''
  topics:
  - name: Environment Data Migration
    id: environment-data-migration
    subtopics:
    - name: Factory metamodel
      id: factory-metamodel
      description: Wants to understand how OutSystems manages the factory's
        Applications, Espaces, Modules, and Extensions, and their system
        entities (physical tables, producers, and consumers, SS_Key
        uniqueness, and Is Active flags), so that they can correctly
        interpret this data model when planning an O11 data migration
        between environments.
    - name: Plan data migration
      id: plan-data-migration
      description: Wants to understand the recommendations, prerequisites, and
        planning considerations for migrating pure application and hybrid data
        from an O11 production environment to a non-production environment,
        including platform version alignment, database definition differences,
        and downtime considerations, so that they can plan a safe data migration
        process.
    - name: Platform dependencies
      id: map-platform-dependencies
      description: Wants to identify OutSystems Platform system entities (Users,
        Tenants, Multi-Tenant Entities, BPT) that applicational entities have
        foreign key dependencies on, so that they can map and align those
        dependencies between environments before migrating application data.
    - name: Match migration identifiers
      id: match-migration-identifiers
      description: Wants to match entity and attribute physical names, static
        entity record identifiers, and build a foreign keys map between source
        and destination O11 environments, so that migrated data correctly
        references the right records after an O11 data migration.
    - name: Migrate hybrid BPT and users
      id: migrate-hybrid-bpt-users
      description: Wants to migrate hybrid data, including BPT process/activity
        instances, BPT trigger events, and Users/Groups/Roles, between O11
        environments, so that migrated applicational data remains functionally
        consistent after the migration.
    - name: GDPR and data masking
      id: migration-gdpr-data-masking
      description: Wants to account for GDPR compliance requirements and data
        masking when planning an O11 application data migration, so that
        sensitive data stays protected throughout the migration process.
    - name: Date formats and timezones
      id: migration-date-timezone-differences
      description: Wants to reconcile date format and timezone differences
        between source and destination O11 environments during an application
        data migration, so that migrated date and time values remain accurate
        after the move.
    - name: Database catalog metadata
      id: migration-database-catalog-metadata
      description: Wants to account for database catalog metadata when planning
        an O11 application data migration, so that supporting schema details
        needed by the migrated data aren't missed.
    - name: Binary data (BLOB) migration
      id: migration-binary-blob-data
      description: Wants to migrate binary data (BLOB) between O11
        environments as part of an application data migration, so that files
        and other binary content remain available after the migration.
    - name: Espace bootstraps
      id: migration-espace-bootstraps
      description: Wants to handle Espace bootstraps when planning an O11
        application data migration, so that initialization logic and migrated
        data remain aligned in the destination environment.
    - name: Map entity dependencies
      id: map-entity-dependencies
      description: Wants to identify primary keys, foreign keys, other
        constraints, cyclic entity references, and soft key usage in
        application entities, so that they can migrate application data
        without breaking referential integrity or introducing broken
        business logic during an O11 data migration.
