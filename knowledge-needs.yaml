  guid: 184681b2-96da-4711-9efd-53172730bbed
  topics:
  - name: Showing data on a screen/block
    id: display-data-screen-block
    subtopics:
    - name: Replace sample data in a UI element
      id: replace-ui-sample-data
    - name: Bind data to a UI element
      id: bind-data-to-a-ui-element
    - name: Table pagination setup
      id: table-pagination-setup
      description: Wants to add pagination and records-per-page control to a Table
        widget in an OutSystems 11 Screen, so that users can navigate through large
        datasets in configurable page sizes.
    - name: Table sorting setup
      id: table-sorting-setup
      description: Wants to implement user-triggered column sorting on a Table widget
        using a Dynamic Sort in an Aggregate, so that users can reorder displayed
        records by clicking header cells.
    - name: Customize table columns
      id: customize-table-columns
      description: Wants to customize the columns of a Table widget — adding, deleting,
        renaming, editing column expressions, and adjusting text alignment — in an
        OutSystems 11 Screen, so that the Table displays the right data fields with
        appropriate labels and formatting.
    - name: Set up Table widget
      id: set-up-table-widget
      description: Wants to add a Table widget to a Screen, bind it to an Aggregate
        as its data source, and configure the displayed columns — including adding,
        deleting, renaming, editing expressions, and adjusting alignment — in ODC
        Studio, so that the employee list is presented correctly in the browser.
    - name: Add Table widget
      id: add-table-widget
      description: Wants to add a Table widget to a Screen and bind it to an Aggregate
        as its data source, so that the screen displays database records in a tabular
        layout.
