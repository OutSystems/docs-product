  - name: Users in OutSystems
    id: users-in-os
    subtopics:
    - name: Creating Users
      id: creating-users
    - name: Register user actions
      id: register-user-system-actions
      description: Wants to register a new end user in ODC's built-in
        identity provider by calling StartUserRegistration to create the
        user and obtain a temporary password, then FinishUserRegistration
        to activate the password and log the user in, so that a new user
        account becomes usable without going through the standard
        self-registration screens.
    - name: Deleting Users
      id: deleting-users
    - name: Updating Users
      id: updating-users
    - name: Activate deactivated user
      id: activate-deactivated-user
      description: Wants to reactivate a deactivated end-user account in ODC,
        using either the ODC Portal's Management > Users page (Activate User)
        or the ODC user management APIs, so that the user can resolve the
        OS-IDCO-AUTH-40101 error and resume authenticating through the
        external IdP.
    - name: Self Registration
      id: self-registration
    - name: Users and Licensing
      id: users-licensing
    - name: User Types
      id: user-types
    - name: IT vs App Users
      id: it-vs-app-users
      description: Wants to understand the difference between IT Users and Application
        Users in O11, including how each is managed under a separate User Provider
        (Service Center vs Users app) and how multi-tenancy can create further isolated
        user spaces, so that they can correctly identify which user space a given login
        belongs to.
    - name: Login provider mismatch
      id: login-provider-mismatch
      description: Wants to diagnose why a login works in one OutSystems user provider
        (for example, Service Center) but fails in another (for example, the Users
        app), by understanding the common causes — inactive user, different password,
        external authentication configuration, or multi-tenancy — so that they can
        resolve the login failure.
  - name: Governance principles
    id: governance-principles
    subtopics:
    - name: Deleting apps and libraries
      id: delete-apps-libraries
    - name: Modify IT Users in LT
      id: modify-it-users-in-lt
    - name: Delete IT Users in LT
      id: delete-it-users-in-lt
    - name: Create IT Users in LT
      id: create-it-users-in-lt
    - name: Built-in Roles
      id: built-in-roles
    - name: IT User management in LT
      id: it-user-management-in-lt
    - name: Governance strategies
      id: governance-strategies
    - name: Permission model in LT
      id: permission-model-in-lt
    - name: Permission model for semi-autonomous dev deployments up to QA
      id: permission-model-qa
    - name: Role assignment
      id: role-assignment
    - name: Permission governance
      id: permission-governance
      description: Wants to know the recommended practices for managing permissions
        in ODC, including starting with least privilege, using clear naming, avoiding
        the Administrator role unless necessary, testing roles before rollout, and
        auditing permissions regularly, so that they can govern access securely and
        maintainably across their organization.
  - name: Multi-portfolio user management
    id: multi-portfolio-user-management
    subtopics:
    - name: Centralized user access
      id: centralized-user-access
      description: Wants to understand how ODC manages users (members,
        end-users, and API clients) at the organization level rather than
        per portfolio, with a single user profile and organization roles
        that include portfolio-scoped permissions, in a multi-portfolio
        organization, so that they don't create redundant per-portfolio
        accounts and understand the centralized user model.
    - name: Configure portfolio roles
      id: configure-portfolio-roles
      description: Wants to configure organization roles' portfolio-level permissions
        across the available permission categories for one or more portfolios,
        including relying on the built-in Administrator role for automatic
        access to all portfolios or the Developer role scoped to the main
        portfolio, and designing custom cross-portfolio or portfolio-specific
        roles, in a multi-portfolio ODC organization, so that each user gets the
        correct level of access per portfolio.
    - name: End-users in portfolios
      id: end-users-in-portfolios
      description: Wants to understand how end-users are managed in a
        multi-portfolio ODC organization, including that a single end-user
        profile is shared and counted once toward the organization-level
        end-user limit while end-user groups and IdP assignments remain
        portfolio-specific, so that they can plan end-user access and
        authentication correctly across portfolios.
  - name: Subscription and entitlement management
    id: subscription-entitlement-management
    subtopics:
    - name: Retrieve subscription data
      id: retrieve-subscription-data
      description: Wants to retrieve ODC subscription, entitlement, and usage
        data by asset and environment, using the Subscription API v1 REST
        endpoints, so they can programmatically monitor account status and
        resource consumption.
    - name: AO counting rules
      id: ao-counting-rules
      description: Wants to know how application objects (AOs) are counted for
        screens, entities/database tables, API methods, and events in
        OutSystems 11 and OutSystems Developer Cloud, including special cases
        such as libraries, imported Forge components, and objects reused
        across multiple apps, so that they can accurately estimate the AO
        footprint of their apps.
    - name: AO limits and usage
      id: ao-limits-usage
      description: Wants to check their licensed AO capacity and current AO
        usage across production runtimes, using Service Center in OutSystems
        11 or the Subscription section of the ODC Portal, so that they can
        manage AO consumption and know when to request a capacity upgrade.
    - name: View subscription entitlements
      id: view-subscription-entitlements
      description: Wants to view their organization's and portfolios' subscription details
        and entitlement consumption across resource types, along with available
        add-ons, using the Subscription page in ODC Portal, so that they can
        monitor usage and know when to request an upgrade.
    - name: Agent Execution counting
      id: agent-execution-counting
      description: Wants to know how Agent Executions are counted in OutSystems,
        understanding that each CallAgent action call at runtime counts as one
        Execution regardless of the number of actions, tools, or AI model calls
        performed within that call, so that they can accurately estimate Agent
        Execution consumption for licensing purposes.
