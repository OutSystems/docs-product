      id: assign-a-role-for-an-app
    - name: Permission model for autonomous dev deployments up to PP
      id: permission-model-pp
    - name: Assign a role within a team
      id: assign-team-role
    - name: Create a team
      id: create-a-team
- name: Using audit logs for compliance and troubleshooting
  guid: c96ed7dd-90d2-406d-a816-c47269c0d20b
  topics:
  - name: Using audit logs for operational alerts
    id: alerts-audit-logs
    description: Can I detect when a deployment happened outside defined hours?
  - name: Using audit logs for troubleshooting
    id: troubleshoot-audit-logs
  - name: Which compliances can audit trail help me achieve
    id: compliance-audit-logs
  - name: User permissions for audit log access
    id: user-perms-audit-logs
    description: What is the permission model? For example, if I have access to only
      some apps, can I see audit logs for other apps for which I don't have permission?
      Is it per stage?
  - name: Events logged in the audit trail
    id: events-audit-logs
    description: 'Is operation XYZ in ODC Portal audited?

      What is the list of operations and for what scope for auditing?'
  - name: Understanding the structure and fields of an audit log
    id: struct-audit-logs
    description: 'What does each field mean?

      What fields exist?

      What values can each field hold?

      What does each possible value mean?'
  - name: Retention period available for audit trail
    id: retention-audit-logs
  - name: Methods for accessing audit log data
    id: access-audit-logs
    subtopics:
    - name: Stream audit logs
      id: stream-audit-logs
      description: Can I stream audit logs?
    - name: Exporting logs via CSV
      id: export-audit-logs
    - name: Viewing logs in the ODC Portal
      id: view-audit-logs
- name: Business Analysis
  guid: a3f7c821-56e4-4b2d-9d83-1e4c0f2d8b95
  topics:
  - name: Business Vision
    id: business-vision
    subtopics:
    - name: Vision document
      id: vision-document
      description: Wants to understand what a business vision document is and what
        goals it serves, when starting a new project, so that they can align business
        strategy, context, and challenges before development begins.
    - name: Vision statement
      id: vision-statement
      description: Wants to create a vision statement and vision cloud for a project,
        when conducting business analysis, so that they can articulate the primary
        business goals in an inspirational and actionable way.
    - name: Process diagrams
      id: process-diagrams
      description: Wants to create and scope process diagrams for a business vision
        document, when conducting business analysis, so that all stakeholders can
        visually understand the full business process beyond just the application scope.
    - name: Personas
      id: personas
      description: Wants to create personas for a business vision document by observing
        users in action and collecting statistics and context information for each,
        when conducting business analysis, so that they can understand each persona's
        contribution to strategic or tactical goals.
- name: O11 to ODC Migration
  guid: ''
  topics:
  - name: Code Conversion
    id: code-conversion
    subtopics:
    - name: Convert O11 code
      id: convert-o11-code
      description: Wants to understand how to convert O11 app code to ODC using the
        app conversion console, including what the tool does automatically, so that
        they can initiate the code conversion step in their migration plan.
    - name: Publish converted apps
      id: publish-converted-apps
      description: Wants to publish converted ODC apps and libraries after code conversion
        — including downloading each app file, opening it in ODC Studio, fixing dependency
        and TrueChange errors, and publishing producers before consumers — so that
        the converted apps are live in the target ODC stage.
    - name: Tag app before conversion
      id: tag-app-before-conversion
      description: Wants to know how to tag an O11 app in the source environment
        before starting the code conversion process, so that the correct app version
        is picked up by the app conversion console.
    - name: Troubleshoot code conversion
      id: troubleshoot-code-conversion
      description: Wants to identify and collect troubleshooting information when
        an O11 to ODC code conversion ends with errors — including reading conversion
        logs and exporting the troubleshooting zip file — so that they can diagnose
        the failure or provide the necessary data to OutSystems Support.
    - name: Adapt converted SQL
      id: adapt-converted-sql
      description: Wants to validate and adapt SQL nodes in a converted ODC app to
        ensure compatibility with Aurora PostgreSQL — including reviewing auto-converted
        queries, handling limitations (Expand Inline, external entities, BEGIN-END
        blocks), and testing all SQL nodes — so that the converted app's data queries
        work correctly in ODC.
    - name: SQL conversion mapping
      id: sql-conversion-mapping
      description: Wants to understand the exact syntax mappings applied automatically
        when converting O11 SQL nodes to ODC PostgreSQL — including general clauses,
        Oracle-specific functions, data type translations, string concatenation rules,
        temporary tables, and pattern matching — so that they can verify converted
        queries and anticipate what the conversion tool produces.
    - name: Adapt login flows
      id: adapt-login-flows
      description: Wants to manually adapt the login and logout flows of a converted
        ODC app so that end users can authenticate using their existing O11 credentials,
        so that the converted app is usable after migration.
    - name: Review converted app
      id: review-converted-app
      description: Wants to review the On Application Ready and On Application Resume
        event actions and the app and library properties of a converted ODC app, after
        the code conversion tool has merged multiple O11 modules, so that the resulting
        app behaves as expected and has the correct settings.
    - name: Configure converted apps
      id: configure-converted-apps
      description: Wants to configure a converted ODC app after code conversion —
        including Site Properties/Settings (secret and non-secret), custom domains,
        external databases, REST service endpoints, private gateways, and SMTP email
        — so that the app works correctly in ODC before testing and deploying it.
    - name: Connect ODC to O11
      id: connect-odc-to-o11
      description: Wants to verify that their ODC organization is connected to the
        correct O11 infrastructure and, in a multi-portfolio organization, set the
        target ODC portfolio for app conversion, in the ODC Portal, so that conversion
        plans from the Conversion Assessment Tool are available in the app conversion
        console.
    - name: Conversion prerequisites
      id: conversion-prerequisites
      description: Wants to understand the prerequisites and limitations for executing
        an O11 to ODC app conversion — including required infrastructure type, LifeTime
        version, prior preparation steps, and unsupported scenarios (self-managed,
        hybrid, demo environments, ODC self-hosted) — so that they can confirm whether
        their environment is ready before starting the conversion process.
  - name: Code Patterns
    id: code-patterns
    subtopics:
    - name: Fix built-in function pattern
      id: fix-built-in-function-pattern
      description: Wants to manually replace O11 built-in functions that don't exist in ODC
        with their ODC equivalents or manual workarounds after O11 to ODC code
        conversion, so that migrated app logic keeps working under ODC's
        architecture.
    - name: Multipart REST pattern
      id: multipart-rest-pattern
      description: Wants to unblock an O11 to ODC code conversion when the app consumes
        a REST API using a multipart/form-data request, by removing that REST call
        in O11 before converting, since ODC doesn't yet support that request format.
    - name: Incompatible built-in functions
      id: incompatible-built-in-functions
      description: Wants to identify O11 built-in functions incompatible with ODC
        architecture, either restricted from use inside aggregates or removed
        entirely, after O11 to ODC code conversion, so that they can rework the
        affected logic instead of applying a direct fix.
    - name: Traditional Web modules
      id: trad-web-modules-pattern
      description: Wants to convert Traditional Web modules to Service or Reactive
        Web modules in O11 before starting O11 to ODC code conversion, since ODC
        doesn't support Traditional Web apps, so that the app asset isn't blocked
        from code conversion.
    - name: Additional pipelines pattern
      id: additional-pipelines-pattern
      description: Wants to understand why O11 to ODC conversion isn't supported
        yet for infrastructures with additional pipelines, so that they can focus
        on preparing code and data for ODC instead of attempting conversion.
    - name: Self-managed infra pattern
      id: self-managed-infra-pattern
      description: Wants to understand why O11 to ODC conversion isn't supported
        yet for self-managed infrastructures, so that they can focus on preparing
        code and data for ODC instead of attempting conversion.
  - name: Data Migration
    id: data-migration
    subtopics:
    - name: Data migration scope
      id: data-migration-scope
      description: Wants to understand what is included in an O11 to ODC data migration
        (entity data, repeat migrations, data model consistency requirements) and the
        available migration types (non-production vs production final), so that they
        can choose the right approach for their migration phase.
    - name: Migrate end users
      id: migrate-end-users
      description: Wants to understand how end-user migration works during O11 to ODC
        data migration, including IdP configuration requirements, one IdP per O11
        environment, user extension tables, role migration, and the option to skip
        end-user migration, so that they can prepare their environment and identity
        setup before migrating.
    - name: Cancel data migration
      id: cancel-data-migration
      description: Wants to know when and how to cancel an in-progress O11 to ODC data
        migration, and understand the impact on app data and end users depending on
        which phase is canceled, so that they can recover safely if a running migration
        needs to be aborted.
    - name: Execute data migration
      id: execute-data-migration
      description: Wants to execute the O11 to ODC data migration using the app conversion
        console in the ODC Portal — including selecting migration type, source environment,
        target stage, end-user migration options, and confirming the setup — so that
        app entity data and end users are transferred to ODC.
    - name: Configure end-user IdP
      id: configure-end-user-idp
      description: Wants to configure an identity provider in ODC for each O11 source
        environment and map it to a target ODC stage in the infrastructure settings,
        including selecting the user profile mapping and username prefix, so that end
        users can be migrated from that O11 environment.
    - name: Fix data migration errors
      id: fix-data-migration-errors
      description: Wants to identify and fix data model inconsistency errors that
        stop an O11 to ODC data migration — including missing entities or attributes,
        attribute property mismatches, and reference attribute mismatches — so that
        they can resolve the root cause and successfully retry the migration.
  - name: Conversion Assessment
    id: conversion-assessment
    subtopics:
    - name: Review assessment report
      id: review-assessment-report
      description: Wants to view and validate the ODC Conversion Assessment Tool's
        report, including navigating to it via ODC Blueprint or a conversion plan,
        and validating Code, Data, and Infrastructure pattern findings by reviewing
        solutions and rerunning the assessment, so that they can plan the refactoring
        effort needed before converting O11 apps to ODC.
  - name: Preparation
    id: preparation
    subtopics:
    - name: Prepare O11 for ODC
      id: prepare-o11-for-odc
      description: Wants to understand the high-level steps involved in preparing
        an O11 app for ODC conversion, adjusting the app to be ODC-compatible,
        deploying it to QA, and testing it, so that they know what is needed before
        starting the code conversion process.
- name: Infrastructure Setup
  guid: a1c2e3f4-5b6d-7e8f-9a0b-1c2d3e4f5a6b
  topics:
  - name: Certificate Management
    id: certificate-management
    subtopics:
    - name: Trust self-signed cert
      id: trust-self-signed-cert-o11
      description: Wants to add a self-signed certificate to the trusted root
        store on O11 Platform Server front-end servers, by importing it via
        the Microsoft Management Console (MMC) Certificates snap-in into the
        Trusted Root Certification Authorities store and exporting a
        DER-encoded copy for reuse, so that HTTPS connections to a
        self-signed web service can establish trust instead of failing with
        "Could not establish trust relationship for the SSL/TLS" errors.
    - name: Add cloud trusted cert
      id: add-cloud-trusted-cert
      description: 'Wants to add a self-signed certificate to the trusted
        root store on O11 Cloud environment front-end servers, by opening a
        support case with the certificate in .CER format and specifying the
        target environments, so that OutSystems staff can install it and
        HTTPS connections to the external system establish trust instead of
        failing with "Could not establish trust relationship for the
        SSL/TLS" errors.'
    - name: Generate CSR keytool
      id: generate-csr-keytool
      description: Wants to generate a PKCS#10 Certificate Signing Request
        (CSR) for an OutSystems 11 Java/Linux front-end (JBoss, Wildfly, or
        WebLogic), by creating a Java keystore and key pair with keytool and
        generating a .csr file, so that they can submit it to a
        certification authority to obtain an SSL certificate.
    - name: Import SSL cert keystore
      id: import-ssl-cert-keystore
      description: Wants to import an acquired SSL certificate, along with
        its root and intermediate CA certificates, into a Java keystore
        using keytool on an OutSystems 11 Linux front-end, and set correct
        keystore file ownership, so that the certificate chain is trusted
        and ready for the application server to use.
    - name: Configure app server SSL
      id: configure-app-server-ssl
      description: Wants to configure JBoss EAP/Community, Wildfly, or WebLogic to use an
        installed SSL certificate and keystore (editing standalone-
        outsystems.xml or the WebLogic Administration Console keystore/SSL
        settings) and restart the server, so that OutSystems 11 applications on
        Linux become accessible over HTTPS.
  - name: Reverse Proxy Configuration
    id: reverse-proxy-configuration
    subtopics:
    - name: Configure SSL offloading
      id: configure-ssl-offloading
      description: Wants to configure SSL offloading for OutSystems 11 by setting
        the X-Forwarded-Proto HTTP header at the reverse proxy, inserting the HTTPtoHTTPSproxyHeader
        parameter into the OutSystems database, and configuring the trusted proxy
        address in Service Center, so that the platform correctly identifies and processes
        HTTPS requests when SSL is terminated at the proxy level.
    - name: Rewrite resource URLs
      id: rewrite-resource-urls
      description: Wants to rewrite absolute URLs in OutSystems application resources
        (HTML, CSS, JavaScript) at the reverse proxy level and disable content compression
        at both the platform and application-server level, so that all resource links
        remain valid when an extra path segment is introduced by the reverse proxy.
    - name: Expose app addresses
      id: expose-app-addresses
      description: Wants to configure the reverse proxy to translate their OutSystems
        application's internal address to its externally exposed address, including
        referenced content such as RichWidgets and other cross-app references, so
        that the application and its dependent resources are correctly reachable
        from the internet.
    - name: Adjust keep-alive timeout
      id: adjust-keep-alive-timeout
      description: Wants to configure the keep-alive connection timeout on an Apache-based
        reverse proxy to at least 30 seconds using the KeepAliveTimeout directive,
        so that OutSystems Mobile and Reactive Web apps do not encounter connection
        errors caused by the default 5-second timeout.
    - name: Reverse proxy requirements
      id: reverse-proxy-requirements
      description: Wants to know the technical requirements to serve OutSystems
        Traditional Web, Mobile, and Reactive Web apps through a reverse proxy,
        including maintaining the original host header, using only default HTTP/HTTPS
        ports, disabling the NEGOTIATE protocol, keeping URL paths unchanged, exposing
        apps via their Service Center domain over HTTPS, and not caching Mobile/Reactive
        App resources, so that the reverse proxy setup doesn't break URL generation,
        authentication, or app functionality.
    - name: Reverse proxy basics
      id: reverse-proxy-basics
      description: Wants to understand what a reverse proxy is and its capabilities
        (load balancing, SSL offloading, caching, compression, content switching,
        application firewall, server obfuscation, authentication, and single sign-on),
        so they can determine whether it fits their OutSystems infrastructure needs.
    - name: Reverse proxy benefits
      id: reverse-proxy-benefits
      description: Wants to understand the benefits of placing a reverse proxy
        in front of OutSystems applications, including reducing load on application
        servers, increasing security and traceability, and ensuring high availability
        through load balancing and failover, so they can justify adopting a reverse
        proxy in their OutSystems architecture.
    - name: Reverse proxy scenarios
      id: reverse-proxy-scenarios
      description: Wants to determine which reverse proxy configurations to combine
        (SSL offloading, end-to-end SSL, header manipulation with referenced content
        exposure, URL rewriting, keep-alive timeout adjustment) for common OutSystems
        deployment scenarios such as plain HTTP redirection, end-to-end HTTPS, SSL
        offload, and multi-app path-based routing, so they can implement the correct
        configuration set for their specific setup.
  - name: Redis in-memory sessions
    id: redis-in-memory-sessions
    subtopics:
    - name: Redis session overview
      id: redis-session-overview
      description: Wants to understand why OutSystems supports Redis for in-memory
        session storage in Traditional Web Apps on self-managed infrastructures
        — including the drawbacks of storing sessions as a serialized column in
        a relational database and the difference between a single Redis Server
        and a Redis Cluster configuration — so they can decide whether this advanced
        scenario fits their factory before setting it up.
    - name: Redis software prerequisites
      id: redis-software-prereqs
      description: Wants to know which Platform Server and Redis Server versions
        are required to use Redis for in-memory session storage in O11, so they
        can verify their environment meets the minimum software requirements before
        starting setup.
    - name: Redis hardware sizing
      id: redis-hardware-sizing
      description: Wants to understand the minimum hardware specifications for a
        Redis infrastructure — covering both non-productive and production (Redis
        Cluster) environments — so they can provision servers with the right CPU,
        RAM, storage, and network capacity before deploying Redis for OutSystems.
    - name: Enable Redis SSL
      id: enable-redis-ssl
      description: Wants to configure Platform Server to connect to Redis over
        SSL/TLS on self-managed O11 infrastructures, by setting the required
        SERedis_* certificate environment variables on every front-end server,
        enabling the Use SSL option in the Configuration Tool, and reapplying
        settings or republishing the factory, so that session traffic between
        Platform Server and Redis is encrypted.
    - name: Scale Redis Cluster nodes
      id: redis-cluster-scale-nodes
      description: Wants to scale an existing Redis Cluster by adding a new pair
        of server machines to it, by setting up their Master and Replica processes,
        joining the new Master processes with redis-cli --cluster add-node,
        resharding key slots across all Master processes, and joining the new
        Replica processes with cross-replication to the paired new Master, so
        that they can grow their self-managed O11 Redis Cluster's capacity while
        preserving its high-availability architecture.
    - name: Test Redis failover
      id: redis-cluster-failover-test
      description: Wants to verify that a Redis Cluster's failover configuration
        works correctly by using redis-cli to simulate a Master process outage
        and confirming that the associated Replica process on another server
        promotes itself to Master, so they can validate their self-managed O11
        Redis Cluster setup before relying on it in production.
    - name: Set up non-prod Redis
      id: redis-nonprod-setup
      description: Wants to set up a single Redis server for OutSystems 11 non-productive
        environments, including the recommended network deployment (a dedicated
        subnet, inbound connections on port 6379/TCP) and installing and configuring
        Redis Server on Ubuntu (commenting the bind directive, disabling protected-mode,
        setting a password via requirepass, restarting the service), so that the
        server is ready to accept connections from OutSystems front-end servers
        for in-memory session storage.
    - name: Set up prod Redis
      id: redis-prod-setup
      description: Wants to set up a three-server Redis Cluster for OutSystems
        11 production environments on self-managed infrastructures, including
        hardening each Ubuntu node (disabling the default redis-server service,
        opening the cluster ports, disabling transparent huge pages, tuning
        overcommit memory), configuring paired Master and Replica redis-server
        processes with cluster mode enabled and systemd services, creating the
        cluster with redis-cli --cluster create, and validating that the
        resulting nodes and hash slots are healthy, so that the cluster is
        ready to accept connections from OutSystems front-end servers for
        in-memory session storage.
    - name: Configure Redis sessions
      id: configure-redis-sessions
      description: Wants to configure OutSystems 11 front-end servers to use Redis
        for in-memory session storage via the Configuration Tool's Session tab,
        including entering the Redis hosts, password, and optional SSL settings,
        testing the connection, applying the change, and republishing modules,
        so that their self-managed Platform Server environment stores sessions
        in Redis instead of the database.
    - name: Verify Redis sessions
      id: verify-redis-sessions
      description: Wants to confirm that Platform Server is storing sessions in
        Redis after configuring in-memory session storage, by connecting to the
        Redis Cluster or single Redis server with redis-cli and checking for the
        expected _Data and _Internal session keys, so they can validate their
        self-managed O11 Redis session configuration is working.
  - name: Self-hosted cluster services
    id: self-hosted-cluster-services
    subtopics:
    - name: Cluster services overview
      id: cluster-services-overview
      description: Wants to understand what services are installed in an ODC self-hosted
        Kubernetes cluster and why each is necessary, so that they can
        understand the platform's architecture and their own operational
        responsibilities versus OutSystems'.
  - name: Self-hosted inbound traffic configuration
    id: self-hosted-inbound-traffic
    subtopics:
    - name: Configure self-hosted domains
      id: configure-self-hosted-domains
      description: Wants to create and manage DNS domains for each self-hosted ODC
        application stage that resolve to the load balancer's public address, so
        that user requests can reach the load balancer over HTTPS.
    - name: Set up load balancer TLS
      id: set-up-load-balancer-tls
      description: Wants to set up a layer 7 load balancer to terminate TLS for
        self-hosted ODC domains and forward traffic to the Gloo ingress gateway
        over HTTP, so that HTTPS access to apps stays secure while TLS management
        is offloaded from the cluster.
    - name: Configure Gloo routing headers
      id: configure-gloo-routing-headers
      description: Wants to configure the X-Forwarded-Host and X-OSEnvironment HTTP
        headers at the load balancer, or another upstream proxy, so that Gloo can
        identify the target runtime stage and route each inbound request correctly
        in a self-hosted ODC cluster.
  - name: Self-hosted configurator
    id: self-hosted-configurator
    subtopics:
    - name: Reopen self-hosted configurator
      id: reopen-self-hosted-configurator
      description: Wants to reopen the Self-hosted configurator on an already-bootstrapped
        ODC cluster via the ODC Portal's Self-hosted tab and configurator command,
        so that they can update APM tool, stage database connection, or container
        registry settings without rerunning the full installation wizard.
    - name: Redis HA architecture
      id: redis-ha-architecture
      description: Wants to understand the 3-node Master/Replica Redis Cluster
        high-availability architecture for OutSystems 11 self-managed infrastructures,
        including how crossed replica placement enables automatic failover to a
        surviving server, so that they can reason about Redis Cluster resilience
        before deploying it.
  - name: Database Collation
    id: database-collation
    subtopics:
    - name: Collation requirements
      id: collation-requirements
      description: Wants to understand OutSystems' case-insensitive collation
        requirements at the SQL Server instance, database, and column level,
        and why collations must stay consistent across all environments in
        an on-premises infrastructure, so that they configure a compliant
        and consistent database backend when installing OutSystems Platform
        Server on SQL Server.
    - name: Avoid collation conflicts
      id: avoid-collation-conflicts
      description: Wants to understand why mismatched SQL Server column
        collations cause errors in join conditions and foreign keys between
        different data models, in an on-premises OutSystems 11
        installation, so that they account for future integration needs
        before finalizing their database's collation choice.
    - name: Change DB collation
      id: change-db-collation
      description: 'Wants to change the collation of an existing OutSystems
        SQL Server database, understanding that changing only the
        database-level collation doesn''t update existing column
        collations, that OutSystems Support doesn''t assist with the change
        itself, and how to interpret the resulting "Cannot resolve the
        collation conflict" error, so that they plan and safely execute (or
        troubleshoot) a collation change with the appropriate database
        professionals.'
- name: Log streaming (O11)
  guid: 7f3c2a1e-84d0-4b5f-a9c3-e1d06f82b347
  topics:
  - name: Log Streaming overview
    id: log-streaming-overview
    subtopics:
    - name: Understand Log Streaming
      id: log-streaming-understand
      description: Wants to understand what Log Streaming is for a self-managed O11
        installation — including how the bundled Fluent Bit service reads JSON log
        files, transforms them into the Flat Format, and forwards them to an external
        tool — so that they can decide whether to adopt it and know what to expect
        before setup.
    - name: Enable Log Streaming
      id: log-streaming-enable
      description: Wants to enable and configure Log Streaming on a self-managed O11
        installation using the Configuration Tool GUI or CLI, including meeting
        prerequisites, configuring settings, setting up a multi-front-end farm, and
        disabling the feature, so that application logs are forwarded to an external
        observability or SIEM tool.
  - name: Log Streaming operations
    id: log-streaming-ops
    subtopics:
    - name: Troubleshoot Log Streaming
      id: log-streaming-troubleshoot
      description: Wants to diagnose and resolve Log Streaming issues on a self-managed
        O11 installation — using Test Connection, the Fluent Bit service log, the
        Windows Service console, and the metrics endpoint — so that they can identify
        why logs aren't arriving at a destination or the service isn't running.
    - name: Fix streaming timeout
      id: fix-streaming-timeout
      description: Wants to understand and resolve the OS-DP-STREAM-00004 "deadline
        exceeded" error — where the destination server responds with a gRPC 4 error
        when testing the streaming connection in O11 or ODC — so that they can restore
        log and observability data streaming to the destination APM tool.
    - name: Fix streaming not found
      id: fix-streaming-not-found
      description: Wants to understand and resolve the OS-DP-STREAM-00005 "not found"
        error — where the destination server responds with a gRPC 5 error when testing
        the streaming connection in O11 or ODC — so that they can restore log and
        observability data streaming by correcting the endpoint URL in LifeTime Log
        Streaming or the ODC Portal.
    - name: Fix streaming already exists
      id: fix-streaming-already-exists
      description: Wants to understand and resolve the OS-DP-STREAM-00006 "already
        exists" error — where the destination server responds with a gRPC 6 error
        when testing the streaming connection in O11 or ODC — so that they can restore
        log and observability data streaming by verifying the APM tool is working
        and re-establishing the connection.
    - name: Fix streaming permission denied
      id: fix-streaming-permission-denied
      description: Wants to understand and resolve the OS-DP-STREAM-00007 "permission
        denied" error — where the destination server responds with a gRPC 7 error
        when testing the streaming connection in O11 or ODC — so that they can restore
        log and observability data streaming by correcting the authentication credentials
        or endpoint URL in LifeTime Log Streaming or the ODC Portal.
    - name: Fix streaming resource exhausted
      id: fix-streaming-resource-exhausted
      description: Wants to understand and resolve the OS-DP-STREAM-00008 "resource
        exhausted" error — where the destination server responds with a gRPC 8 error
        when testing the streaming connection in O11 or ODC — so that they can restore
        log and observability data streaming by verifying the APM tool is working
        and re-establishing the connection.
    - name: Fix streaming failed precondition
      id: fix-streaming-failed-precondition
      description: Wants to understand and resolve the OS-DP-STREAM-00009 "failed
        precondition" error — where the destination server responds with a gRPC 9
        error when testing the streaming connection in O11 or ODC — so that they
        can restore log and observability data streaming by verifying the APM tool
        is working and re-establishing the connection.
    - name: Fix streaming unknown error
      id: fix-streaming-unknown
      description: Wants to understand and resolve the OS-DP-STREAM-00002 "unknown
        error reaching your destination server" error — where the destination server
        responds with a gRPC 2 (Unknown) error when testing the streaming connection
        in O11 or ODC — so that they can restore log and observability data streaming
        to the destination APM tool.
  - name: Fluent Bit configuration
    id: fluentbit-configuration
    subtopics:
    - name: Configure Fluent Bit output
      id: fluentbit-configure-output
      description: Wants to set up a Fluent Bit output plugin in custom.yaml on a
        self-managed O11 installation, including specifying the output name, match
        tags, match_regex, alias, and reliability settings such as retry_limit, so
        that logs are routed to the chosen APM or SIEM destination reliably.
    - name: Filter streaming logs
      id: fluentbit-filter-logs
      description: Wants to filter streamed logs in Fluent Bit on a self-managed O11
        installation by log type (using tag matching) or by application name (using
        the modify+grep workaround for flat-format field names), so that only the
        desired subset of records reaches a given output.
    - name: Enrich logs with metadata
      id: fluentbit-enrich-logs
      description: Wants to add static metadata fields, copy fields, or rename fields
        in Fluent Bit log records on a self-managed O11 installation using the modify
        filter and dotted-key names, so that streamed logs carry the additional context
        needed by the destination tool.
  - name: APM destination configuration
    id: log-streaming-destination-config
    subtopics:
    - name: Configure Splunk streaming
      id: configure-splunk-streaming
      description: Wants to set up log streaming from OutSystems 11 applications
        to Splunk by configuring the OpenTelemetry Collector with an HTTP Event
        Collector receiver and Splunk Exporter, updating the collector image
        version, and registering the collector endpoint and credentials in
        LifeTime, so that logs stream to Splunk in near real time.
- name: Log streaming (ODC)
  guid: 5e4d826e-41ed-47ae-9f2e-9c87b56d41f2
  topics:
  - name: Stream overview
    id: odc-stream-overview
    subtopics:
    - name: Analytics Stream overview
      id: understand-analytics-stream
      description: Wants to understand what streaming observability data
        (Analytics Stream) is, how ODC uses the OpenTelemetry standard and
        OTLP to export logs, traces, and metrics to third-party APM tools,
        and its benefits, so they can decide whether and how to adopt it
        for monitoring ODC apps, agents, and workflows.
    - name: Supported APM tools
      id: supported-apm-tools
      description: Wants to know which APM tools ODC's Analytics Stream supports natively
        vs. via the OpenTelemetry collector, so they can pick a compatible
        destination for their observability data.
    - name: Connectivity requirements
      id: stream-connectivity-requirements
      description: Wants to understand the connectivity and security
        requirements (public endpoint exposure, encryption, authentication,
        IP allowlisting) for streaming observability data from ODC to an
        APM tool, so they can prepare their APM tool's ingestion endpoint
        before configuring a stream.
  - name: Stream configuration
    id: odc-stream-configuration
    subtopics:
    - name: Create analytics stream
      id: create-analytics-stream
      description: Wants to create a stream in the ODC Portal by selecting a destination
        APM tool, entering destination and source environment details, and
        testing the connection, so that observability data (logs, metrics, and
        traces) streams from their app to that APM tool.
    - name: Stream status meanings
      id: stream-status-meanings
      description: Wants to understand what the Active, Active with errors, and
        Inactive statuses mean for a stream in the ODC Portal, so they can tell
        whether observability data is being delivered correctly to the
        destination APM tool.
- name: O11 Data Migration
  guid: ''
  topics:
  - name: Environment Data Migration
    id: environment-data-migration
    subtopics:
    - name: Factory metamodel
      id: factory-metamodel
      description: Wants to understand how OutSystems manages the factory's
        Applications, Espaces, Modules, and Extensions, and their system
        entities (physical tables, producers, and consumers, SS_Key
        uniqueness, and Is Active flags), so that they can correctly
        interpret this data model when planning an O11 data migration
        between environments.
    - name: Plan data migration
      id: plan-data-migration
      description: Wants to understand the recommendations, prerequisites, and
        planning considerations for migrating pure application and hybrid data
        from an O11 production environment to a non-production environment,
        including platform version alignment, database definition differences,
        and downtime considerations, so that they can plan a safe data migration
        process.
    - name: Platform dependencies
      id: map-platform-dependencies
      description: Wants to identify OutSystems Platform system entities (Users,
        Tenants, Multi-Tenant Entities, BPT) that applicational entities have
        foreign key dependencies on, so that they can map and align those
        dependencies between environments before migrating application data.
    - name: Match migration identifiers
      id: match-migration-identifiers
      description: Wants to match entity and attribute physical names, static
        entity record identifiers, and build a foreign keys map between source
        and destination O11 environments, so that migrated data correctly
        references the right records after an O11 data migration.
    - name: BPT entity model
      id: bpt-entity-model
      description: Wants to understand the entity-relationship model of BPT
        Process and Activity definition and instance entities, and how
        Service Studio, Service Center, and Lifetime populate them, so that
        they can correctly interpret this data model when planning an O11
        BPT data migration.
    - name: Migrate hybrid BPT and users
      id: migrate-hybrid-bpt-users
      description: Wants to migrate hybrid data, including BPT process/activity
        instances, BPT trigger events, and Users/Groups/Roles, between O11
        environments, so that migrated applicational data remains functionally
        consistent after the migration.
    - name: GDPR and data masking
      id: migration-gdpr-data-masking
      description: Wants to account for GDPR compliance requirements and data
        masking when planning an O11 application data migration, so that
        sensitive data stays protected throughout the migration process.
    - name: Date formats and timezones
      id: migration-date-timezone-differences
      description: Wants to reconcile date format and timezone differences
        between source and destination O11 environments during an application
        data migration, so that migrated date and time values remain accurate
        after the move.
    - name: Database catalog metadata
      id: migration-database-catalog-metadata
      description: Wants to account for database catalog metadata when planning
        an O11 application data migration, so that supporting schema details
        needed by the migrated data aren't missed.
    - name: Binary data (BLOB) migration
      id: migration-binary-blob-data
      description: Wants to migrate binary data (BLOB) between O11
        environments as part of an application data migration, so that files
        and other binary content remain available after the migration.
    - name: Espace bootstraps
      id: migration-espace-bootstraps
      description: Wants to handle Espace bootstraps when planning an O11
        application data migration, so that initialization logic and migrated
        data remain aligned in the destination environment.
    - name: Map entity dependencies
      id: map-entity-dependencies
      description: Wants to identify primary keys, foreign keys, other
        constraints, cyclic entity references, and soft key usage in
        application entities, so that they can migrate application data
        without breaking referential integrity or introducing broken
        business logic during an O11 data migration.
    - name: Classify entity types
      id: classify-entity-types
      description: Wants to classify OutSystems Platform entities into System,
        Application, and Hybrid types, including their naming conventions
        (OSSYS_/OSUSR_ prefixes), read/write permissions, and subgroupings,
        so that they can correctly plan which entities to read or migrate
        during an O11 data migration.
    - name: Users/Roles/Groups model
      id: users-roles-groups-entity-model
      description: Wants to understand the physical tables, producers, and
        consumers for the User, Role, Group, User_Role, Group_Role, and
        Group_User system entities, so that they can correctly interpret
        this entity-relationship model when planning an O11 environment
        data migration.
    - name: Trace BPT process data
      id: trace-bpt-process-data
      description: Wants to trace a BPT process instance across the Process,
        Process_Input, Process_Output, Activity, and Activity_Output
        entities using SQL queries in Service Center, so that they can
        identify actual field values and hybrid entity relationships before
        planning a BPT data migration.
- name: Application Monitoring and Alerts
  guid: 5a7f74cd-1f74-4499-a5db-c8761f47512f
  topics:
  - name: APDEX score explained
    id: apdex-score-explained
    description: Wants to understand what an OutSystems 11 APDEX score means and how it's
      calculated, based on the percentage of page loads rated poor, fair, or
      good against page load time thresholds, so they can interpret an
      application's performance rating shown as a percentage from 0% to 100%.
  - name: Custom alerts
    id: custom-alerts
    subtopics:
    - name: Gather monitoring data
      id: gather-monitoring-api-data
      description: Wants to gather application operations data (request duration,
        browser load time, server time, error counts) using the Monitoring API's
        GET RequestEvents method or by querying log data, and optionally register
        custom events via POST RequestEvents or LogMessage, so that they have the
        raw data needed to build custom alerts.
    - name: Define alert thresholds
      id: define-alert-thresholds
      description: Wants to consume Monitoring API data or log data and define custom
        logic with thresholds that trigger alerts, using OutSystems logic or a
        third-party application, so that they can detect when application metrics
        cross acceptable limits.
    - name: Integrate alerts ITSM
      id: integrate-alerts-itsm
      description: Wants to trigger email notifications or call webservices when
        an alert threshold is met, to create tickets in ITSM tools such as
        ServiceNow, Zendesk, Jira, or Opsgenie, send Slack messages, or integrate
        with any webservice-exposing external service, so that operational alerts
        reach the right external system.
  - name: App Feedback
    id: app-feedback
    subtopics:
    - name: Send mobile app feedback
      id: send-mobile-app-feedback
      description: Wants to send feedback from a screen in a mobile app by
        long-pressing with two fingers, marking the area of concern, and
        entering a text message or voice recording (which requires microphone
        permission), so that end users can report issues or comments for
        review in the App Feedback app, provided the device has network
        access.
    - name: Send web app feedback
      id: send-web-app-feedback
      description: Wants to send feedback in a Traditional Web App or Reactive
        Web App by clicking the glowing circle indicator, typing a message,
        optionally pointing to a specific screen area or element, and
        pressing SEND, so that developers can better understand reported
        issues, provided the feedback feature is activated in the
        environment.
- name: Monitor and Troubleshoot (O11)
  guid: efd7e36b-05ea-4fe3-bf72-80617a1557e8
  topics:
  - name: Check OutSystems version
    id: check-outsystems-version
    description: Wants to check the installed version and revision of Service
      Studio, Integration Studio, LifeTime, Service Center, and Platform
      Server (including System Components) in OutSystems 11, so they can
      provide accurate version information when opening a support case or
      verifying environment consistency.
  - name: Debugging toolkit overview
    id: debugging-toolkit-overview
    description: Wants to understand what tools are available for debugging
      and troubleshooting Mobile and Reactive Web apps in OutSystems 11,
      including the Service Studio debugger, Service Center application
      logs, and modern browser developer tools, so that they know where to
      start when investigating unexpected application behavior.
  - name: Fix cross-site cookies (O11)
    id: fix-cross-site-cookies-o11
    description: Wants to identify and fix cross-site cookie problems in
      OutSystems 11 apps by using the LifeTime SameSite/Secure settings when
      stricter SameSite cookie policies cause issues such as broken iframes
      displaying third-party or OutSystems content, failing OAuth/OpenID/SAML
      authentication flows, and custom JavaScript-set cookies, so their
      applications keep working correctly.
  - name: EPA taskbox administration
    id: epa-taskbox-admin
    description: Wants to hide or show the EPA Taskbox per eSpace by activating EPA
      Administration and setting which applications/eSpaces display it, in
      OutSystems 11, from the EPA administration backoffice screen, so that they
      can control which apps expose the taskbox to end users and keep it hidden
      where it isn't needed.
  - name: Resolve internal error
    id: resolve-internal-error
    description: Wants to know what to do when OutSystems 11 shows a generic
      "Internal Error" caused by an unexpected situation in the application
      or environment, so they can submit feedback through the tool or
      contact OutSystems Support if the issue persists.
  - name: Resolve app not found
    id: resolve-app-not-found
    description: Wants to know what to do when OutSystems 11 shows an "Application
      not found" error while opening or editing an application that no
      longer exists, so they can confirm the app was removed and contact
      OutSystems Support if the issue persists.
  - name: Resolve shared config
    id: resolve-shared-config
    description: 'Wants to know what to do when OutSystems 11 shows a "Shared
      Configuration ''<Shared Configuration>'' is invalid and will be
      ignored" warning, so they can ask the application manager or Service
      Center administrator to correct it using the Service Center Factory
      Configuration solution and republish the module.'
  - name: Resolve FIPS crypto error
    id: resolve-fips-crypto-error
    description: 'Wants to resolve the "This implementation is not part of the
      Windows Platform FIPS validated cryptographic algorithms" error that occurs
      when running OutSystems Platform Server versions earlier than 11.38.0 on a
      system enforcing FIPS policy, by disabling the local FIPS compliance security
      policy, overriding the .NET configuration to allow non-FIPS-validated
      algorithms, or upgrading to Platform Server 11.38.0+ for native FIPS-compliant
      environment support, so that the platform runs without being blocked by the
      system''s FIPS enforcement.'
  - name: Renew server license
    id: renew-server-license
    description: Wants to know how to respond to a Service Center warning
      that their OutSystems 11 server license will expire soon or has
      already expired, by contacting their Service Center administrator to
      request a new license from OutSystems before losing access to
      licensed features.
  - name: License limit exceeded
    id: license-limit-exceeded
    description: Wants to resolve a Service Center warning that their
      OutSystems 11 server has exceeded its licensed resource usage or
      Software Units publishing limit, by cleaning up obsolete users,
      modules, or data, or asking their Service Center administrator to
      change the license contract, so that they can keep using licensed
      features and publish new modules.
  - name: License limits reached
    id: license-limits-reached
    description: Wants to resolve reaching their OutSystems 11 license usage
      limits (users, Application Objects, or environments), by contacting
      OutSystems Support with their Audit License and Activation Code, so
      that they can troubleshoot their license usage or upgrade their
      license.
  - name: License verification
    id: license-verification
    description: Wants to manually verify their OutSystems 11 license
      consumption by downloading the license verification file
      (OutSystems.Audit.txt) from Service Center's Licensing menu and
      uploading it to the Customer Portal, so that self-managed
      environments without automatic telemetry communication remain
      license compliant each quarter.
  - name: License invalid hardware
    id: license-invalid-hardware
    description: Wants to resolve an OutSystems 11 license invalid error
      caused by a hardware change (Deployment Controller VM restart,
      physical network device change, or promoting a front-end server to
      Deployment Controller) that alters the environment's serial number,
      by releasing the previous environment, registering it with the new
      serial number on the Licensing portal, and installing the new
      license file.
  - name: Retain VM MAC
    id: retain-vm-mac
    description: Wants to prevent a Virtual Machine hosting the Deployment
      Controller from getting a new environment serial number after a
      restart, by configuring the VM to retain its MAC address across
      restarts instead of assigning a new one.
  - name: Migrate Activation Code
    id: migrate-activation-code
    description: Wants to move a full self-managed OutSystems 11
      infrastructure (including LifeTime) from one Activation Code to
      another, by backing up existing license files, checking for
      IP-protected modules, registering and uploading new license files for
      the destination Activation Code, and republishing a test module to
      confirm the change, so that development activities and app publishing
      continue without unexpected Intellectual Property errors.
  - name: Rollback Activation Code
    id: rollback-activation-code
    description: Wants to revert a self-managed OutSystems 11 infrastructure
      back to its previous Activation Code after an Intellectual Property
      error occurs during a migration, by pausing Production deployments
      and restoring each environment's backed-up license file, so that they
      can confirm the old Activation Code is active again and contact
      OutSystems Support for further help.
  - name: AC migration issues
    id: ac-migration-issues
    description: Wants to know how to respond to common issues during an
      Activation Code migration (a missing serial number under the old
      Activation Code, or a license under either the old or new Activation
      Code not prepared for migration), by gathering the affected
      environments and contacting OutSystems Support, so they can get
      assistance completing the license change for all environments at
      once.
- name: Monitor and Troubleshoot (O10)
  guid: 69e74025-d666-40fd-b224-c96f5cbba50c
  topics:
  - name: Fix cross-site cookies (O10)
    id: fix-cross-site-cookies-o10
    description: Wants to identify and fix cross-site cookie problems in
      OutSystems 10 apps by using Factory Configuration when stricter
      SameSite cookie policies cause issues such as broken iframes displaying
      third-party or OutSystems content, failing OAuth/OpenID/SAML
      authentication flows, and custom JavaScript-set cookies, so their
      applications keep working correctly.
- name: Project Tracking and Collaboration
  guid: ''
  topics:
  - name: OnTrack (O11)
    id: ontrack-o11
    subtopics:
    - name: OnTrack overview
      id: ontrack-overview
      description: Wants to understand what OnTrack offers for backlog management,
        project tracking, and continuous delivery collaboration in OutSystems 11,
        so that they can decide whether to use it to define requirements, prioritize
        work items, confirm user acceptance, and monitor project progress.
    - name: Link feedback to OnTrack
      id: link-feedback-to-ontrack
      description: Wants to configure ECT_Client_Connector and map eSpaces/modules
        between environments so that end-user feedback submitted through OutSystems
        App Feedback is automatically synced into OnTrack as trackable work items.
    - name: OnTrack colour scheme
      id: ontrack-work-item-color-scheme
      description: Wants to interpret the color-coded notification icons on OnTrack work
        items, so they can quickly tell whether a work item has an unread
        update, was rejected, or was accepted.
- name: Community and Training
  guid: 336189f2-2366-41d7-9dfa-6819b924a0ae
  topics:
  - name: Boot Camps
    id: boot-camps
    subtopics:
    - name: Boot Camp registration
      id: boot-camp-registration
      description: Wants to find the price of an OutSystems Boot Camp and register
        for one, when planning to attend instructor-led training, so that they
        can enroll through a Training Partner and receive schedule, location,
        and payment details.
  - name: Training videos
    id: training-videos
    subtopics:
    - name: Access blocked videos
      id: access-blocked-videos
      description: Wants to watch OutSystems training videos when the streaming
        platform (for example Vimeo) is blocked, by downloading the video and
        subtitle files from the Training portal and playing them locally with
        a media player like VLC, so that they can continue training without
        guaranteed progress tracking.
  - name: Certification exams
    id: certification-exams
    subtopics:
    - name: Access exam score report
      id: access-exam-score-report
      description: Wants to access their certification or specialization exam
        score report when it wasn't received by email and isn't in the spam
        or junk folders, by using the confirmation number and last name on
        the Prometric Score Report portal, so that they can see which exam
        topics they passed or failed.
    - name: Missing exam appointment
      id: missing-exam-appointment
      description: 'Wants to get their exam appointment details when they
        didn''t receive the appointment confirmation email, by checking
        spam and junk folders and opening a support case if it''s still
        missing, so that they can continue with their exam registration.'
    - name: Exam refund eligibility
      id: exam-refund-eligibility
      description: Wants to cancel a scheduled certification exam and receive a refund, by
        canceling before the refund eligibility cutoff relative to the exam's
        scheduled date and time, so that they know whether they qualify for a
        refund or forfeit the fee.
    - name: Exam reschedule windows
      id: exam-reschedule-windows
      description: Wants to reschedule a scheduled certification exam without
        losing the fee, by understanding the free, paid, and not-allowed
        rescheduling windows based on how many days remain before the exam,
        so that they can reschedule at the right time.
  - name: Support Portal
    id: support-portal
    subtopics:
    - name: Add case followers
      id: add-case-followers
      description: Wants to add colleagues as followers to an OutSystems
        support case, either while opening the case in Support Portal or
        afterward by entering their email addresses on an existing case,
        so that those colleagues receive email notifications and can
        contribute information to the case.
  - name: Community Badges
    id: community-badges
    subtopics:
    - name: Community badge criteria
      id: community-badge-criteria
      description: Wants to know what action or achievement unlocks each
        OutSystems Community badge, when participating in the community
        (posting, contributing Forge assets, attending events, publishing
        content, and similar activities), so that they can understand
        which recognition badges they've earned or how to earn new ones.
- name: SEO
  guid: 54a1d9e5-0f3e-4a8b-b897-7c5c8838b0ff
  topics:
  - name: Sitemap and robots configuration
    id: sitemap-and-robots-configuration
    subtopics:
    - name: Generate dynamic sitemap
      id: generate-dynamic-sitemap
      description: 'Wants to generate a valid sitemap.xml for their app by
        creating a REST API endpoint that outputs an XML-formatted list of
        static and dynamic screen URLs, in ODC Studio, so that search engine
        crawlers can discover and index all public pages.'
    - name: Create robots.txt file
      id: create-robots-txt-file
      description: 'Wants to control which parts of their site search engine
        crawlers can access by creating a static robots.txt file that
        defines allow/disallow rules and references the sitemap.xml
        endpoint, in ODC, so that crawler behavior is properly restricted.'
  - name: Prerendering for SPAs
    id: prerendering-for-spas
    subtopics:
    - name: Integrate SEO prerender
      id: integrate-seo-prerender
      description: 'Wants to improve SEO for a reactive or mobile ODC app
        affected by client-side-rendering indexing issues by integrating a
        third-party prerender solution via a reverse proxy or CDN, in ODC, so
        that search engine bots receive fully rendered pages for indexing.'
    - name: Configure prerender custom domain and SSL
      id: configure-prerender-custom-domain-ssl
      description: 'Wants to configure the custom domain and SSL certificates
        for a reverse proxy or CDN that fronts a prerendered reactive or mobile
        ODC app, so that prerendered pages are served securely on the intended
        public domain.'
    - name: Expose sitemap and robots through prerender
      id: expose-sitemap-robots-through-prerender
      description: 'Wants to expose sitemap.xml and robots.txt through the
        prerender reverse proxy or CDN for a reactive or mobile ODC app, so
        that search engine crawlers can discover crawl rules and public URLs
        through the same SEO entry point.'
    - name: Validate prerender integration
      id: validate-prerender-integration
      description: 'Wants to validate that the prerender integration serves
        fully rendered pages to search engine bots through the reverse proxy or
        CDN, in ODC, so that they can confirm the app is ready for indexing.'
  - name: Root domain redirection
    id: root-domain-redirection
    subtopics:
    - name: Redirect root domain
      id: redirect-root-domain
      description: 'Wants to redirect a root domain (or subdomain) to a
        default ODC app screen using a reverse proxy such as Nginx or a
        CDN, in OutSystems Developer Cloud, so that end users and search
        engine crawlers land on a functional app entry point for improved
        SEO and usability.'
