- name: Integrate AI
  guid: a7056193-1048-45b9-ba65-37023127caab
  topics:
  - name: Chatbots
    id: chatbots
  - name: Document Conversion
    id: document-conversion
    subtopics:
    - name: Convert file to Markdown
      id: convert-file-to-markdown
      description: Wants to convert a binary file stored or received in their app to
        Markdown using the OmniDoc2MD Forge component's
        ConvertDocumentToMarkdown action, including installing the component and
        configuring its parameters, so that document content is normalized for
        downstream processing.
    - name: Use Markdown in agent
      id: use-markdown-in-agent
      description: Wants to pass Markdown converted from a document into an AI
        agent's context in Agent Workbench, by assigning it inside the GetGroundingData
        or BuildMessages hooks, so that the agent's grounding data or prompt includes
        the document's normalized text content.
    - name: Add images to message
      id: add-images-to-message
      description: Wants to attach images extracted from a converted document, using
        OmniDoc2MD's extractedImagesMetadata and imagesZipFile outputs with LoadZIP
        and GetFiles, to the same user message that carries the Markdown, so that
        a multimodal AI model receives both text and image content together.
  - name: Sentiment analysis
    id: sentiment-analisys
    subtopics:
    - name: Sentiment analysis
      id: sentiment-analysis
  - name: Machine learning
    id: machine-learning
  - name: Agentic Apps
    id: agentic-apps
    subtopics:
    - name: Consume AI agent
      id: consume-ai-agent
      description: Wants to understand what a consumer app is and how to integrate it with an AI agent by passing UserInput and SessionId parameters, so that the app can send user requests to the agent and maintain conversation context across interactions.
    - name: Consumer app workflow
      id: consumer-app-workflow
      description: Wants to implement the end-to-end workflow for calling an AI agent from a consumer app — including session setup, capturing user input, invoking the agent's service action, handling the response, and persisting the session — so that the app delivers a coherent, context-aware conversational experience.
    - name: Debug agentic apps
      id: debug-agentic-apps
      description: Wants to debug an end-to-end flow that calls an AI agent by running separate debugging sessions for the consumer app and the agentic app in ODC Studio, so that they can inspect inputs, outputs, and errors across both apps.
    - name: Test agent messages
      id: test-agent-messages
      description: Wants to test System and User messages for an AI agent in ODC Studio's Test area before publishing, so that they can verify message effectiveness and avoid committing to an incorrect configuration.
    - name: Test agentic app
      id: test-agentic-app
      description: Wants to validate an agentic app's behavior after publishing by launching the auto-generated test app or an existing consumer app from ODC Studio, selecting which public service action to test, and iterating on changes in the browser, so that the app's logic and responses can be confirmed before deploying to production.
    - name: Test app prerequisites
      id: test-app-prerequisites
      description: Wants to know which service action parameters are required — name, type, and data type — for ODC Studio to successfully generate a test app for an agentic app, so that the setup is correct before clicking Test agent.
    - name: Data source contract
      id: data-source-contract
      description: Wants to implement a custom data source REST API following the AI
        Agent Builder contract, including HTTP parameters, input and output schemas,
        request/response formats, and error codes, so that a custom retrieval service
        can be integrated with AI Agent Builder search.
    - name: Configure CallAgent
      id: configure-callagent
      description: Wants to add the CallAgent service action to their app in ODC
        Studio and configure its AgentId, ChatMessages, and TokenCount parameters,
        so the app can send requests to an AI agent and receive its response.
    - name: Agent Builder overview
      id: ai-agent-builder-overview
      description: Wants to understand what the AI Agent Builder is, its core
        terminology (agent, agent template, AI model, data source, instructions),
        and how information flows between models, data sources, and agents, so
        they can decide whether it fits their use case before building an agent.
    - name: Agent Builder access
      id: ai-agent-builder-access
      description: Wants to understand the AI Agent Builder homepage and the
        access it provides to sample apps, the playground, model and data source
        configurations, and components, so they can navigate the tool and find
        the right entry point for their task.
    - name: Agent sample apps
      id: ai-agent-builder-sample-apps
      description: Wants to understand the use cases, solutions, and customization options
        of the AI Agent Builder's sample apps, so they can pick a starting point
        matching their business scenario.
    - name: Build agent flow
      id: build-agent-flow
      description: Wants to create an AI agent in ODC Studio by configuring an
        AI model, defining grounding data and system messages, adding actions,
        and building the AgentFlow server action, so that the agent can
        autonomously orchestrate responses in an agentic app.
    - name: Add additional agents
      id: add-additional-agents
      description: Wants to add more than one agent to an existing agentic app
        in ODC Studio and wire each new agent into AgentFlow logic via the
        Toolbox's Call Agent element or the Automations tab, so that the app
        can serve multiple specialized purposes (for example, planning versus
        fast execution).
    - name: Configure action calling
      id: configure-action-calling
      description: Wants to expose server actions to an AI agent in ODC by
        writing clear action and parameter descriptions and marking parameters
        as Generated by AI, so that the agent can autonomously select and
        invoke the right action with correct inputs.
    - name: Set agent call condition
      id: set-call-condition
      description: Wants to define a call condition expression using ODC's internal
        variables that track resource usage and iteration counts, so that an AI
        agent stops calling actions after reaching a defined limit and avoids
        infinite loops or excessive resource consumption.
    - name: Action calling overview
      id: action-calling-overview
      description: Wants to understand how an AI agent decides which server
        actions to call within an Agent Flow, based on the user's prompt, the
        system prompt, and action metadata, so they can design actions that
        fit into the agent's autonomous action-calling process.
    - name: Add structured output
      id: add-structured-output
      description: Wants to add a structured output to a Call Agent action in
        ODC Studio by selecting an existing structure or creating a new one in
        the Structured output tab and setting the Call Agent's Response
        parameter to that structure type, so that the agent returns a
        predefined structured response instead of free text.
    - name: Store structured output
      id: store-structured-output
      description: Wants to adapt an AgentFlow to work with a structured
        output by updating the Response output parameter to the structure
        type and serializing the structured data before storing it in the
        Store Memory node, so that the structured response can be persisted
        and later deserialized on the consumer side.
    - name: Agent evaluations overview
      id: agent-evaluations-overview
      description: Wants to understand what agent evaluations are and how
        a run works end-to-end, including the black box methodology
        (evaluating a service action as the executable unit) and the flow
        from dataset through service action, execution trace, and platform
        judge to evaluation results, so they can decide when to use
        evaluations and interpret how results are produced.
    - name: Evaluation data retention
      id: evaluation-data-retention
      description: Wants to understand how long ODC retains agent evaluation data,
        distinguishing evaluation summaries (kept indefinitely) from evaluation
        details like per-test-case results and judge rationale (retained for a
        limited period before being automatically removed), so they know how
        long granular results stay available for review.
    - name: Create evaluation dataset
      id: create-evaluation-dataset
      description: Wants to create and upload a dataset for an agentic app
        evaluation in the ODC Portal, pairing it with the agentic app and
        service action being evaluated, downloading the JSON template, and
        uploading test case JSON matching the service action's inputs,
        expected outputs, and expected tool calls, so that the service
        action can be benchmarked with structured test cases.
    - name: Design dataset test cases
      id: design-dataset-test-cases
      description: Wants to design effective test cases for an agent evaluation dataset,
        covering real user scenarios, one intent per row, stable expected
        outputs, and data dependencies, and structure them as JSON that pairs
        inputs with expected responses, guidance notes, and expected tool calls,
        matching the service action contract, so that evaluation results give
        clear, reliable regression signal.
    - name: Edit evaluation dataset test cases
      id: edit-evaluation-dataset-test-cases
      description: Wants to edit test cases in a saved agent evaluation
        dataset in the ODC Portal, so that the dataset stays accurate as
        prompts, expected responses, or tools change.
    - name: Export evaluation dataset JSON
      id: export-evaluation-dataset-json
      description: Wants to export a saved agent evaluation dataset as JSON
        from the ODC Portal for backup or version control, so that they can
        track and restore dataset changes over time.
    - name: Configure evaluation setup and teardown actions
      id: configure-evaluation-setup-teardown-actions
      description: Wants to configure setup and teardown service actions for
        an agent evaluation in the ODC Portal, so that each run starts from
        a known state and cleans up after execution.
    - name: Run agent evaluation
      id: run-agent-evaluation
      description: Wants to create and save an agent evaluation in the ODC
        Portal by selecting a dataset and judge criteria, then start a run
        against the linked service action, so that test cases are scored
        and results become available for review.
    - name: Cancel evaluation run
      id: cancel-evaluation-run
      description: Wants to cancel an in-progress agent evaluation run in
        the ODC Portal, understanding that setup is aborted, in-progress
        test cases stop, teardown still executes, and no scores are
        returned, so that they can stop a run started with the wrong
        dataset or one taking too long.
    - name: Review run results
      id: review-run-results
      description: Wants to review agent evaluation results in the ODC
        Portal by checking run statuses, overall and judge criteria scores,
        dataset versions across runs, and failure details for setup or
        teardown stages, so that they can interpret run outcomes and know
        where to investigate failures.
  - name: Semantic Search
    id: semantic-search
    subtopics:
    - name: Implement semantic search
      id: implement-semantic-search
      description: Wants to implement semantic search in ODC by marking entity attributes as searchable and adding a Semantic Search element to a server action flow, so that the app can retrieve results ranked by meaning rather than exact keywords.
  - name: Troubleshoot Context Service
    id: troubleshoot-context-service
    subtopics:
    - name: Context Service errors
      id: context-service-errors
      description: Wants to locate and resolve ODC Context Service errors (OS-CTXS)
        by finding the error code in the reference, understanding whether it's
        caller-side or server-side, and following the recommended action, so
        that they can resolve failures affecting agent harness requests to the
        Enterprise Context Graph.
  - name: Troubleshoot Mentor Studio
    id: troubleshoot-mentor-studio
    subtopics:
    - name: Mentor Studio errors
      id: mentor-studio-errors
      description: Wants to locate and resolve Mentor Studio errors by finding
        the error code in the reference, understanding its cause and impact,
        and following the recommended action, so that they can continue
        working with Mentor Studio's conversational AI development flow in
        ODC Studio.
  - name: Mentor Web prompts
    id: mentor-web-prompts
    subtopics:
    - name: UI pattern prompts
      id: ui-pattern-prompts
      description: Wants to select and phrase prompts for Mentor Web to generate the right
        UI pattern for a given dataset shape, using prompt progressions from
        basic to detailed and respecting each pattern's entity and attribute
        constraints, so that the generated screen matches the intended layout
        and data density.
    - name: Data model prompts
      id: mentor-web-data-model-prompts
      description: Wants to write prompts for Mentor Web to add or delete
        entities, attributes, and static entity records, so that data model
        changes are generated correctly during the blueprint phase.
    - name: Authorization prompts
      id: mentor-web-authorization-prompts
      description: Wants to write prompts for Mentor Web to manage roles and
        permissions, so that authorization changes are generated correctly
        during the blueprint phase.
    - name: Theme prompts
      id: theme-prompts
      description: Wants to apply, change, or request a theme, including a
        dark theme via explicit request or primary color choice, through
        prompts or requirement documents in Mentor Web, meeting theme
        compatibility requirements, so that the generated app uses the
        intended visual theme.
  - name: Mentor Studio prompts
    id: mentor-studio-prompts
    subtopics:
    - name: Logic prompts
      id: mentor-studio-logic-prompts
      description: Wants to write prompts for Mentor Studio to create or
        modify server actions, client actions, service actions, and
        aggregates, using a basic-to-detailed prompt progression, so that
        ODC Studio artifacts are generated or modified correctly.
    - name: UI prompts
      id: mentor-studio-ui-prompts
      description: Wants to write prompts for Mentor Studio to create or
        modify screens, web blocks, and layouts, using a basic-to-detailed
        prompt progression, so that ODC Studio artifacts are generated or
        modified correctly.
    - name: Data model prompts
      id: mentor-studio-data-model-prompts
      description: Wants to write prompts for Mentor Studio to create or
        modify entities, attributes, and relationships, using a
        basic-to-detailed prompt progression, so that ODC Studio artifacts
        are generated or modified correctly.
    - name: TrueChange error and warning prompts
      id: mentor-studio-truechange-prompts
      description: Wants to write prompts for Mentor Studio to resolve
        TrueChange errors and warnings, so that compile issues are
        diagnosed and corrected without manual debugging.
    - name: Behavior and bug fix prompts
      id: mentor-studio-behavior-bug-fix-prompts
      description: Wants to write prompts for Mentor Studio to identify and
        fix unexpected app behavior or bugs, so that logic issues are
        diagnosed and corrected without manual debugging.
    - name: Technical debt refactor prompts
      id: mentor-studio-technical-debt-refactor-prompts
      description: Wants to write prompts for Mentor Studio to identify and
        refactor technical debt, so that large or messy logic becomes
        maintainable.
    - name: Requirement breakdown prompts
      id: mentor-studio-requirement-breakdown-prompts
      description: Wants to write prompts for Mentor Studio to break down
        complex requirements into smaller implementation steps, so that
        large features become actionable to build incrementally.
    - name: Reuse public element prompts
      id: mentor-studio-reuse-public-element-prompts
      description: Wants to write prompts for Mentor Studio to reuse a
        public element exposed by another app in the tenant, using Add
        public elements or letting Mentor find and add it automatically,
        so that existing logic can be called from a new app without
        rebuilding it.
    - name: Explain and document prompts
      id: mentor-studio-explain-document-prompts
      description: Wants to write prompts for Mentor Studio to generate
        documentation for an element or explain unfamiliar logic and app
        structure, so that an element's intent and impact are understood
        before making changes.
  - name: AI models and search services
    id: ai-models-and-search-services
    subtopics:
    - name: Manage AI model connections
      id: manage-ai-model-connections
      description: Wants to understand how to connect apps to AI models in ODC, including
        using natively supported providers or bringing their own API key (BYOK),
        configuring endpoints, and setting daily usage limits, so they can set
        up AI model connections before writing app logic that calls the model.
    - name: Custom model connections
      id: custom-model-connections-odc
      description: Wants to connect ODC to non-native LLM providers or
        private models by building a custom connector service that
        implements OutSystems' API contract, handling authentication,
        request and response formatting, and error codes, so that custom
        or third-party models can be called from ODC Studio like natively
        supported models.
    - name: Search services for RAG
      id: search-services-rag
      description: Wants to connect ODC apps to external knowledge bases
        like Azure AI Search or Amazon Kendra and retrieve semantically
        relevant data via a service action, then pass that data as context
        to an AI model call, so they can implement the
        Retrieval-augmented generation (RAG) pattern in app logic.
  - name: Knowledge bases (ODC)
    id: knowledge-bases-odc
    subtopics:
    - name: Knowledge base overview
      id: knowledge-base-overview
      description: Wants to understand what a knowledge base is in ODC and
        how the ingestion pipeline (chunking, embedding, vector index) and
        semantic search enable retrieval-augmented generation (RAG) at
        runtime, so they can grasp how agents and apps retrieve relevant
        content from uploaded documents.
    - name: KB supported file types
      id: kb-supported-file-types
      description: Wants to know which file types and the maximum file size a knowledge
        base accepts, so they can prepare documents before uploading them.
    - name: KB stage isolation
      id: kb-stage-isolation
      description: Wants to understand how knowledge base files and indexes
        are isolated per ODC stage and don't auto-copy between stages, so
        they can plan deployment steps.
    - name: KB region and data residency limits
      id: kb-region-data-residency-limits
      description: Wants to understand which regions trigger cross-region
        data transfers for knowledge bases, so they can plan for data
        residency compliance.
    - name: Choose chunking strategy
      id: choose-chunking-strategy
      description: Wants to compare ODC knowledge base chunking strategies and their trade-
        offs, so they can select the strategy that optimizes retrieval quality
        for their data structure and expected query type.
    - name: Manage KB lifecycle
      id: manage-kb-lifecycle
      description: Wants to create, upload files to, view, edit, and delete
        a knowledge base in the ODC Portal, so they can manage a knowledge
        base's full life cycle without using ODC Studio.
    - name: Add KB server action
      id: add-kb-server-action
      description: Wants to add the auto-generated Server Action for a
        published knowledge base to an app in ODC Studio, so the app can
        run semantic search against that knowledge base's indexed content
        without custom integration code.
  - name: Agent guardrails
    id: agent-guardrails
    subtopics:
    - name: Configure stage guardrails
      id: configure-stage-guardrails
      description: Wants to configure baseline agent guardrail policies at the stage level
        in the ODC Portal, so that safety standards are enforced consistently
        across all agents in a given stage.
    - name: Configure agent-level guardrails
      id: configure-agent-level-guardrails
      description: Wants to configure or override guardrail policies for
        an individual AI agent in the ODC Portal, either overriding an
        inherited stage-level baseline policy or enabling guardrails
        directly when no baseline exists, so that specific high-risk or
        sensitive agents get tailored protection.
    - name: Handle guardrail violation exception
      id: handle-guardrail-violation-exception
      description: Wants to recognize and handle the exception code raised when an agent
        guardrail blocks a request, so that violations are surfaced to end users
        appropriately.
    - name: Review guardrail events
      id: review-guardrail-events
      description: Wants to review guardrail violation events in the ODC
        Portal's Monitor > Logs area, so that policy effectiveness can
        be assessed.
- name: Integrating with Plugins
  guid: 1af9eece-e820-40ec-8483-b1243267b038
  topics:
  - name: Using Cordova Plugins
    id: using-cordova-plugins
    subtopics:
    - name: Haptics plugin reference
      id: haptics-plugin-reference
      description: Wants to look up the Haptics plugin's client actions (CheckHapticsPlugin,
        Impact, Notification, Vibrate, SelectionStart, SelectionChanged, SelectionEnd),
        their parameters, related static entities (ImpactStyle, NotificationType), the
        HapticsError data structure, and error codes, so that they can trigger haptic
        feedback correctly in an ODC mobile app.
    - name: Trigger haptic feedback
      id: trigger-haptic-feedback
      description: Wants to add logic in ODC Studio to trigger haptic feedback (impact,
        notification, vibration, or selection hints) in a mobile app using the Haptics
        plugin's client actions, including checking the plugin's availability beforehand
        and handling the Success and Error output parameters, so that app users receive
        physical touch or vibration feedback during interactions.
    - name: CocoaPods support
      id: cocoapods-support-outsystems
      description: Wants to understand what CocoaPods support means in OutSystems, including
        what CocoaPods is, which plugin types it applies to (Objective-C Cordova plugins),
        and how it eliminates manual iOS dependency management, so that they can decide
        whether and how to use CocoaPods-dependent plugins in their mobile apps.
    - name: Check CocoaPods plugin
      id: check-plugin-uses-cocoapods
      description: Wants to determine whether a Cordova plugin uses CocoaPods by inspecting
        the plugin module's extensibility configurations JSON to locate the plugin URL,
        then checking the corresponding plugin.xml for a podspec framework reference,
        so that they know whether CocoaPods dependency handling applies before using
        the plugin.
    - name: Set up push notifications
      id: set-up-push-notifications
      description: Wants to set up push notifications in an OutSystems mobile app using
        the OneSignal plugin — including configuring the OneSignal account, installing
        the plugin, registering the device (with or without a user), handling notification
        events, and configuring deep-link support for Android — so that the app can
        receive push notifications on both iOS and Android.
    - name: Send push notifications
      id: send-push-notifications
      description: Wants to implement server-side logic in an OutSystems O11 app to
        send push notifications via the OneSignalAPI — including adding the API dependency,
        building the send logic, configuring the notification icon, and defining
        multi-language message content — so that the app can deliver targeted push
        notifications to users.
    - name: Set up Pushwoosh
      id: set-up-pushwoosh-notifications
      description: Wants to set up push notifications in an OutSystems O11 mobile app
        using the Pushwoosh plugin — including installing the plugin from Forge, adding
        the PushwooshNotifications block, configuring the ApplicationCode and FCMSenderId
        parameters, uploading google-services.json for Android, registering the device
        after login or via OnInitializeOver, and setting the aps-environment entitlement
        for iOS developer certificates — so that the app can receive push notifications
        on both iOS and Android.
    - name: Send Pushwoosh notification
      id: send-pushwoosh-notifications
      description: Wants to send push notifications from an OutSystems O11 app using
        the Pushwoosh plugin — including generating a Pushwoosh API Access Token and
        calling the SendPushNotificationToAll action with the ApplicationCode, ApiAccessToken,
        Message, Badge, and Deeplink parameters — so that the app can broadcast
        notifications to all registered devices.
    - name: Configure Pushwoosh iOS
      id: configure-pushwoosh-ios
      description: Wants to configure Pushwoosh for iOS push notifications by creating
        an Apple Developer App ID with Push Notifications enabled, generating and
        exporting an APNS certificate and private key from Keychain, and creating
        and configuring an iOS application in the Pushwoosh dashboard, so that the
        app is ready to send and receive push notifications via Pushwoosh on iOS.
    - name: Camera plugin v7 reference
      id: camera-plugin-reference-v7
      description: Wants to look up the Camera plugin version 7's client actions
        (CheckCameraPlugin, RecordVideo, TakePicture, PlayVideo, EditURIPicture,
        ChooseFromGallery, and their deprecated variants), web blocks, related data
        structures (MediaResult, MediaMetadata) and static entities (MediaType), and
        error codes, so that they can implement camera and gallery functionality in
        an O11 mobile app using this legacy plugin version.
    - name: Control device keyboard
      id: control-device-keyboard
      description: Wants to show or hide the device's keyboard programmatically
        using the Keyboard plugin's Show and Hide client actions in ODC Studio,
        including checking the plugin's availability with CheckKeyboardPlugin
        and handling the Success and Error output parameters, so that the app
        can control keyboard visibility on Android and iOS.
    - name: Customize keyboard appearance
      id: customize-keyboard-appearance
      description: Wants to customize how the device's keyboard looks in a
        mobile app, including setting the accessory bar visibility with
        SetAccessoryBarVisible, changing the keyboard's light or dark style
        with SetStyle, and configuring the KeyboardBackdropBehavior
        extensibility setting to control the keyboard's background color on
        iOS 26 and later, so that the keyboard's appearance matches the app's
        design.
    - name: Handle keyboard events
      id: handle-keyboard-events
      description: Wants to detect when the device's keyboard is about to
        show, has shown, is about to hide, or has hidden, by adding the
        KeyboardEvents block to a screen and creating handler client actions
        for the OnKeyboardWillShow, OnKeyboardDidShow, OnKeyboardWillHide, and
        OnKeyboardDidHide events, so that the app can react to keyboard
        visibility changes.
    - name: KeyStore plugin actions
      id: keystore-plugin-actions
      description: Wants to use the KeyStore Plugin's client actions
        (CheckKeyStorePlugin, SetValue, GetValue, RemoveKey) in ODC Studio to
        securely set, get, and remove key-value secrets in a mobile app, and
        handle errors using each action's Success output, so that sensitive
        information like tokens or passwords is stored safely on iOS and
        Android devices.
    - name: Secure KeyStore access
      id: secure-keystore-access
      description: Wants to require additional user authentication (device
        PIN or biometrics) before accessing a KeyStore Plugin secret, by
        setting the KeyAuthentication parameter on SetValue, customizing the
        Android authentication dialog's title, subtitle, and cancel button
        via extensibility settings, enabling automatic invalidation of
        secrets on biometric change with InvalidateOnBiometricChange, and
        providing the required NSFaceIDUsageDescription iOS permission, so
        that access to sensitive key-value pairs is protected by the
        device's lock screen security.
    - name: Implement SSL Pinning
      id: implement-ssl-pinning-cordova
      description: Wants to implement SSL Pinning for an OutSystems Cordova
        mobile app, by generating certificate public key hashes, creating a
        JSON configuration file, installing the SSL Pinning plugin from
        Forge, uploading the configuration via extensibility settings, and
        validating certificates with the RequireSSLPinning block, so that
        mobile app HTTPS communications are protected against
        man-in-the-middle attacks via client-side certificate verification.
    - name: Check SSL Pinning validity
      id: check-ssl-pinning-hash-validity
      description: Wants to check whether a mobile app's bundled SSL Pinning
        certificate hash is still valid, using the client action
        CheckCertificateForUrl and handling whether the check succeeds or
        returns an error, so that users can be prompted to install a new app
        version before calls to server actions stop working due to a hash
        mismatch.
  - name: Using Capacitor Plugins
    id: using-capacitor-plugins
    subtopics:
    - name: Configure SSL Pinning Capacitor
      id: configure-ssl-pinning-capacitor
      description: Wants to configure SSL Pinning in a Capacitor-based ODC
        mobile app, by creating a build action JSON file that injects
        certificate pin configuration into the Android network security
        config and iOS TSKPinnedDomains/TSKPublicKeyHashes during the build,
        and referencing that file in the app's extensibility configuration,
        so that Capacitor apps enforce certificate pinning without relying
        on Cordova extensibility settings.
    - name: Integrate plugin in app
      id: integrate-plugin-in-app
      description: Wants to integrate a Capacitor plugin (official, community,
        or custom-built) into an ODC app by creating a mobile library
        wrapper, configuring its extensibility settings to reference the
        plugin package and permissions, adding a client action that calls
        the plugin via window.CapacitorPlugins, using the library in the
        app, and building the mobile package, so that the plugin's native
        functionality becomes available to the app.
    - name: Vet plugin security
      id: vet-plugin-security
      description: Wants to assess whether a Capacitor plugin is safe to
        include in a mobile app, given that bundled plugins share the
        global JavaScript environment and can access device APIs, app
        data, and user information, by installing only from trusted
        sources, reviewing the plugin's source code and community
        signals, and keeping plugins updated or removing unused ones, so
        that the app's security risk from third-party plugin code stays
        low.
  - name: Migrate Cordova plugins to Capacitor
    id: migrate-cordova-plugin-capacitor
    subtopics:
    - name: Migrate Cordova settings
      id: migrate-cordova-settings
      description: Wants to decide whether a Cordova plugin can be adapted by
        updating extensibility configurations only or needs a
        Capacitor-compatible plugin, then migrate its preference variables
        and config-file/edit-config declarations, which Capacitor doesn't
        support directly, to MABS 12 extensibility settings, plugin
        extensibility JSON, or build actions, so that plugin customization
        and native file changes (such as Info.plist entries or Android
        resource strings) keep working when building Capacitor apps.
    - name: Adapt Cordova hooks and APIs
      id: adapt-cordova-hooks-apis
      description: Wants to replace a Cordova plugin's build-time hooks with
        MABS 12 build actions (falling back to Capacitor Hooks when needed)
        and update Cordova-specific JavaScript API checks (such as typeof
        cordova and cordova.platformId) to also support Capacitor, so that
        the plugin's build process and client-side code work correctly in
        Capacitor apps.
    - name: iOS usage descriptions
      id: ios-usage-descriptions
      description: Wants to understand why omitting an iOS privacy usage
        description (for example, NSCameraUsageDescription) from a Capacitor
        plugin's extensibility JSON causes the app to fail or be rejected on
        iOS while Android continues to work, so they include the required
        iOS usage descriptions when configuring plugin permissions.
- name: Lifecycle Independence
  guid: 4b3a44cd-2a86-462c-81b2-89a841284aab
  topics:
