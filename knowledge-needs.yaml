knowledge-needs:
- name: (Creating Application) Logic
  guid: b097750b-4f88-4094-a656-2a4359f14c85
  topics:
  - name: Creating Actions
    id: creating-actions
    subtopics:
    - name: What are service actions/when to use service actions
      id: service-actions-when-use
    - name: Server-side vs client-side logic
      id: server-vs-client-logic
    - name: How to create an action
      id: how-to-create-an-action
    - name: Logic Flows
      id: logic-flows
    - name: What are client actions/when to use client actions
      id: client-actions-when-use
    - name: What are server actions/when to use server actions
      id: server-actions-when-use
    - name: Screen-level actions
      id: screen-level-actions
      description: 'Wants to understand the two types of screen-level actions in
        OutSystems Traditional Web Apps: Preparation actions, which run automatically
        before a screen renders to fetch data and set variables, and Screen Actions,
        which run in response to user interactions like clicking a button, so that
        they can add the right logic to each when building a Traditional Web App
        screen.'
    - name: Use AI logic suggestions
      id: use-ai-logic-suggestions
      description: Wants to understand what AI logic suggestions are and how to use
        them in ODC Studio action flows, including accessing suggestions via the AI
        radar, accepting them, and applying tips to improve suggestion quality, so
        that they can build logic faster with ML-guided assistance.
    - name: Enable logic suggestions
      id: enable-logic-suggestions
      description: Wants to enable or disable AI logic suggestions in ODC Studio
        Preferences, so that they can control whether the feature is active during
        development.
    - name: AI logic suggestions model
      id: ai-logic-suggestions-model
      description: Wants to understand how the AI logic suggestions model works,
        including that it uses an OutSystems proprietary ML model trained on anonymized
        patterns running entirely within OutSystems infrastructure rather than external
        LLMs, so that they can make informed decisions about data privacy and tool
        selection.
    - name: Action types overview
      id: action-types-overview
      description: Wants to understand the different types of actions available
        in OutSystems 11 (OutSystems built-in actions, custom actions, and actions
        that handle system events) and when each applies, so that they can choose
        the right type of action when designing application logic.
    - name: Iterate a list
      id: iterate-a-list
      description: Wants to loop over each element in a collection using the
        For Each logic node in OutSystems 11, including setting the Record
        List, Start Index, and Maximum Iterations properties, so that they
        can perform logic recursively on each list item.
  - name: Using Events
    id: using-events
    subtopics:
    - name: System Events
      id: system-events
    - name: How to use Events
      id: how-to-use-events
    - name: Screen Events
      id: screen-events
    - name: UI elements Events
      id: ui-elements-events
    - name: Handle block events
      id: handle-block-events
      description: Wants to handle events triggered by a block by mapping a screen
        action to the block's event and accessing the event input parameters, in ODC
        Studio, so that the screen can respond to user interactions happening inside
        the block.
    - name: Block events O11
      id: block-events
      description: Wants to expose an event on a block and handle it on a screen by
        triggering the event in the block and mapping a screen action to it, so that 
        they can pass data and trigger logic across UI components.
    - name: Screen action as callback
      id: screen-action-as-callback
      description: Wants to assign a screen action as a callback for a UI component's
        provider events using JavaScript and the OutSystems UI API (e.g., SetProviderEvent),
        in Service Studio, so that custom logic runs when a component fires events
        like open or close.
  - name: Understanding Exceptions
    id: understanding-exceptions
    subtopics:
    - name: How to handle Exceptions
      id: how-to-handle-exceptions
  - name: Using Expressions
    id: using-expressions
    subtopics:
    - name: Operands
      id: operands
    - name: When and how to write expressions
      id: write-expressions-guide
    - name: Scope
      id: scope
    - name: Operators
      id: operators
    - name: Functions
      id: functions
    - name: Check string contains
      id: check-string-contains
      description: Wants to check whether one text string contains another using
        the built-in Index function in OutSystems O11, including a case-insensitive
        variant, so that they can replicate C# String.Contains behavior in logic
        expressions.
    - name: Function default values
      id: function-default-values
      description: Wants to understand why OutSystems built-in functions don't
        raise exceptions during execution, returning the default value of the
        output data type instead when an issue occurs, so that they can predict
        function behavior when writing expressions in ODC Studio.
    - name: Built-in math functions
      id: built-in-math-functions
      description: Wants to know which built-in math functions are available in ODC Studio,
        including their parameters, return types, and availability in server-
        side logic, client-side logic, and database aggregates, so that they can
        perform mathematical calculations in expressions.
    - name: Built-in text functions
      id: built-in-text-functions
      description: Wants to know which built-in text functions are available in ODC Studio,
        including their parameters, return types, and availability in server-
        side logic, client-side logic, and database aggregates, so that they can
        manipulate text values in expressions.
    - name: Organization functions
      id: organization-functions
      description: Wants to know which built-in organization functions are available in ODC
        Studio, including their outputs and availability in server-side logic,
        client-side logic, and database aggregates, so that they can retrieve
        session locale, user agent, and app name information in expressions.
  - name: Debugging and troubleshooting logic
    id: debug-troubleshoot-logic
    subtopics:
    - name: How to debug and troubleshoot application logic
      id: debug-troubleshoot-app-logic
  - name: Creating Variables
    id: creating-variables
    subtopics:
    - name: Site properties / Settings
      id: site-properties-settings
    - name: Input Parameters
      id: input-parameters
    - name: Local Variables
      id: local-variables
    - name: Output Parameters
      id: output-parameters
    - name: How to use Variables
      id: how-to-use-variables
  - name: Using Structures
    id: using-structures
    subtopics:
    - name: How to create structures
      id: how-to-create-structures
    - name: What are structures
      id: what-are-structures
  - name: Logic performance tips
    id: logic-performance-tips
    description: Wants to apply best practices for optimizing OutSystems 11 application
      logic performance — including using Service Center reports to find bottlenecks,
      limiting timer/batch job run duration with checkpoints, simplifying screen
      preparations, treating Site Properties as constants, avoiding isolated Aggregates,
      and avoiding queries inside conditional preparation branches — so that Traditional
      Web, mobile, and Reactive Web apps run efficiently.
    subtopics:
    - name: Client event fetch
      id: client-event-fetch
      description: Wants to avoid performing local data fetch inside client events
        (On Initialize, On Ready, On Render) in OutSystems mobile apps, and instead
        fetch data via data fetch calls, using the On After Fetch event for dependent
        fetches, so that data fetching runs in parallel with screen rendering instead
        of being fully serialized.
    - name: StringBuilder for large strings
      id: stringbuilder-large-strings
      description: Wants to concatenate many strings, or a few large strings, into
        one large string efficiently in OutSystems 11, using the StringBuilder API
        from the Text Extension (StringBuilder_Append) instead of plain string concatenation,
        so that operations that build large outputs, such as serializing large record
        sets, avoid severe performance degradation.
- name: (Creating Basic) Application Security
  guid: f89b0297-9ba2-48bd-9e84-b56614a7e620
  topics:
  - name: User Roles
    id: user-roles
    subtopics:
    - name: Anonymous
      id: anonymous
    - name: Check user role in code
      id: check-user-role-in-code
      description: Wants to verify whether the currently logged-in end-user has
        a specific public role (local or consumed from another app) inside a
        server action or service action, using the CheckEndUserRole built-in
        function with a RoleId input, so that business logic can conditionally
        allow or restrict behavior based on the user's role.
- name: (Creating an Application) Architecture
  guid: 9ce4fe11-dcc9-4b0f-b3ea-545557accdec
  topics:
  - name: Why is architecture relevant?
    id: architecture-relevance
    subtopics:
    - name: Basic architecture concepts
      id: basic-architecture
    - name: Importance of having good architecture from day one
      id: good-architecture-value
  - name: How to build app architecture
    id: app-architecture-basics
    subtopics:
    - name: Map OS concepts with "rest of the world" concepts
      id: map-os-to-global-concepts
  - name: Modules
    id: modules
    subtopics:
    - name: What are modules?
      id: what-are-modules
    - name: Difference between applications and modules
      id: apps-vs-modules
- name: (Modeling, Consuming and Using) Data
  guid: 184681b2-96da-4711-9efd-53172730bbed
  topics:
  - name: Showing data on a screen/block
    id: display-data-screen-block
    subtopics:
    - name: Replace sample data in a UI element
      id: replace-ui-sample-data
    - name: Bind data to a UI element
      id: bind-data-to-a-ui-element
    - name: Table pagination setup
      id: table-pagination-setup
      description: Wants to add pagination and records-per-page control to a Table
        widget in an OutSystems 11 Screen, so that users can navigate through large
        datasets in configurable page sizes.
    - name: ODC table pagination
      id: odc-table-pagination-setup
      description: Wants to add pagination and records-per-page control to a Table
        widget in ODC Studio, so that users can navigate through large datasets in
        configurable page sizes.
    - name: Table sorting setup
      id: table-sorting-setup
      description: Wants to implement user-triggered column sorting on a Table widget
        using a Dynamic Sort in an Aggregate, so that users can reorder displayed
        records by clicking header cells.
    - name: Customize table columns
      id: customize-table-columns
      description: Wants to customize the columns of a Table widget — adding, deleting,
        renaming, editing column expressions, and adjusting text alignment — in an
        OutSystems 11 Screen, so that the Table displays the right data fields with
        appropriate labels and formatting.
    - name: Set up Table widget
      id: set-up-table-widget
      description: Wants to add a Table widget to a Screen, bind it to an Aggregate
        as its data source, and configure the displayed columns — including adding,
        deleting, renaming, editing expressions, and adjusting alignment — in ODC
        Studio, so that the employee list is presented correctly in the browser.
    - name: Add Table widget
      id: add-table-widget
      description: Wants to add a Table widget to a Screen and bind it to an Aggregate
        as its data source, so that the screen displays database records in a tabular
        layout.
    - name: Fixed header table
      id: fixed-header-table
      description: Wants to create a vertically scrollable Table Records widget with
        a fixed header row that remains visible while users scroll, by adding a separate
        Table Widget as a static header, applying TableRecords style classes, and
        enclosing the body in a CSS-styled container with overflow-y auto, in Service
        Studio for O11 Traditional Web Apps, so that large datasets are navigable
        without losing column context.
  - name: Securing Data
    id: securing-data
    subtopics:
    - name: Security validations on CRUD
      id: security-crud-validation
  - name: Getting Data from your systems of records
    id: fetch-data-system-records
    subtopics:
    - name: Get data from external db
      id: get-data-from-external-db
  - name: Adding test data
    id: adding-test-data
    subtopics:
    - name: How to bootstrap test data from an excel file
      id: bootstrap-test-data-excel
    - name: How to edit data in Service Studio
      id: edit-data-service-studio
  - name: Modeling Data
    id: modeling-data
    subtopics:
    - name: Data relationships
      id: data-relationships
    - name: Static Entities
      id: static-entities
    - name: Create/manipulate entities
      id: create-edit-entities
    - name: Data types
      id: data-types
      description: Wants to understand what data types are available in ODC, their
        default values, and their minimum/maximum constraints, so that variables and
        entity attributes can be correctly typed during app development.
    - name: DateTime UTC behavior
      id: datetime-utc-behavior
      description: Wants to understand how DateTime values are stored in UTC and
        displayed in the device's local time zone — including how client-side,
        server-side, and SQL calls differ — so that time-sensitive data is handled
        correctly across regions.
  - name: Querying data
    id: querying-data
    subtopics:
    - name: Joins
      id: joins
    - name: Filter data
      id: filter-data
    - name: Aggregates
      id: aggregates
    - name: Multi-entity aggregate
      id: multi-entity-aggregate
      description: Wants to create an aggregate that joins multiple entities and applies
        filters for a specific input parameter, so that a screen can display related
        records from several data sources in a single query.
    - name: Master-detail aggregates
      id: master-detail-aggregates
      description: Wants to implement a master-detail pattern in a Screen using two
        Aggregates with different Fetch properties (At start and Only on demand),
        so that a list loads immediately while detail data loads only when needed.
    - name: Trigger aggregate refresh
      id: trigger-aggregate-refresh
      description: Wants to trigger an on-demand Aggregate to refresh and update
        the UI asynchronously, by using an Assign node to set a filter parameter
        followed by a Refresh Data node inside a client action triggered by a UI
        event, so that the Screen displays updated data without a full page reload.
  - name: Sharing Data defined in OutSystems
    id: share-data-outsystems
    subtopics:
    - name: Allow other apps to change data
      id: allow-apps-edit-data
    - name: Allow other apps to read data
      id: allow-apps-read-data
- name: API testing
  guid: 195d823e-8f16-4d32-a66d-7766c6bdd032
  topics:
