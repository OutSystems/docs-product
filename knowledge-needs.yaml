    - name: Automated component tests
      id: automated-component-tests
- name: Collaborative Development
  guid: ''
  topics:
  - name: Merging revisions
    id: merging-revisions
    subtopics:
    - name: Resolve merge conflicts
      id: resolve-merge-conflicts
      description: Wants to understand how ODC handles code merges when multiple
        developers publish changes to the same app simultaneously, including when
        ODC merges automatically and when conflicts require manual resolution by
        choosing which changes to keep, so that they can collaborate on an app
        without losing work.
    - name: Compare app revisions
      id: compare-app-revisions
      description: Wants to compare the currently open version of an app against
        a previously published revision or another revision from the server using
        ODC Studio's Compare and Merge options, so that they can review differences
        before deciding what to publish.
    - name: Recover previous merge
      id: recover-previous-merge
      description: Wants to resume or discard an in-progress merge that was automatically
        saved by ODC Studio, so that they can continue resolving conflicts without
        losing earlier merge work or start fresh.
    - name: Compare workflow versions
      id: compare-workflow-versions
      description: Wants to compare different versions of a workflow (a previous
        revision, unpublished changes, or a conflicting published revision) in ODC,
        using the revision history panel, the reopen-workflow dialog, or the
        publish-conflict dialog, so that they can review differences before choosing
        which version to keep or restore.
    - name: Workflow diff color coding
      id: workflow-diff-color-coding
      description: Wants to interpret the color-coded highlights and property-level changes
        shown in ODC's workflow comparison view, so that they can correctly
        identify what was added, modified, deleted, or in conflict between two
        workflow revisions.
    - name: Publish with message
      id: publish-with-message
      description: Wants to add a custom message when publishing a workflow in ODC,
        and see that message surface in the revision history and in merge-conflict
        or open-workflow conflict dialogs, so that they and their team understand
        the context behind each revision.
- name: Consume UI
  guid: 349f50f2-cb79-41c7-9e8b-f113cbb3e965
  topics:
  - name: Use a live style guide
    id: use-a-live-style-guide
  - name: Reuse UI
    id: reuse-ui
    subtopics:
    - name: Embed web screens iframe
      id: embed-web-screens-iframe
      description: Wants to embed Traditional Web Screens from an O11 web app into
        a Mobile App using an iframe, including creating the InternalBrowser block,
        implementing the FetchIframe action with correct CSRF headers, and working
        around the LifeTime Analytics incompatibility, so that existing web screens
        can be surfaced inside a mobile app without full migration.
    - name: Auto-login mobile user
      id: auto-login-mobile-user
      description: Wants to automatically log in an end user authenticated in the
        mobile app into the embedded Traditional Web App, by adding an OnException
        handler that calls Session_GetMobileAppLoginInfo and then the system Login
        action, in Service Studio for O11, so that users don't need to log in
        separately to the web app inside the iframe.
    - name: iframe link target
      id: iframe-link-target
      description: Wants to ensure links inside an embedded Traditional Web Screen
        that navigate back to the mobile app open in the top window by setting
        target="_top" on those links, in O11 Mobile Apps using an iframe block,
        so that the app avoids nested iframes (cascade syndrome).
  - name: Front end architecture
    id: front-end-architecture
  - name: Customize style
    id: customize-style
    subtopics:
    - name: Customize styles in your app
      id: customize-app-styles
    - name: Creating a theme
      id: creating-a-theme
    - name: Make header scroll
      id: make-header-scroll
      description: Wants to make the London theme's fixed header scroll with the page
        instead of staying pinned at the top, by overriding the .Header CSS
        class's position and top properties to static and removing the .Content
        class's top padding, in an OutSystems 11 web app's style sheet, so that
        the header doesn't remain fixed in place and obscure content as users
        scroll through longer pages.
    - name: Change app favicon
      id: change-app-favicon
      description: Wants to replace the default OutSystems favicon with a custom PNG
        or ICO image by changing the favicon resource in Service Studio, in a Reactive
        Web App for O11, so that the app displays a branded browser tab icon.
    - name: Choose icon library
      id: choose-icon-library
      description: Wants to select and switch between the available icon libraries for an
        app by setting the Icon Library property at the theme level, in ODC
        Studio, so that icon rendering matches design needs and compatibility
        with existing or new apps.
    - name: Resolve icon library conflicts
      id: resolve-icon-library-conflicts
      description: Wants to resolve icon library mismatches when a referenced
        block uses a different icon library than the app's theme, by updating
        the producer library's icon setting or manually replacing icons flagged
        with a TrueChange warning, in ODC Studio, so that referenced blocks
        display correctly without visual inconsistency.
    - name: Fix theme mismatch
      id: fix-theme-mismatch
      description: 'Wants to resolve the "Themes are not compatible" warning
        between a Screen Template and their module, by selecting a compatible
        Screen Template, reverting Theme changes, or migrating a Traditional
        Web App from Silk UI/the London Theme to the OutSystems UI framework,
        in Service Studio for O11, so the final screen renders as previewed.'
    - name: Fix grid overflow
      id: fix-grid-overflow
      description: 'Wants to resolve the "Grid Dimensions Overflow" error caused
        by a widget''s Width property (set in grid columns) exceeding the number
        of columns defined in the theme''s grid, by reducing the widget''s
        Width value or increasing the theme''s Grid property, in Service Studio
        for OutSystems 11, so they can continue publishing or running the app
        without the error.'
    - name: Uppercase input text
      id: uppercase-input-text
      description: 'Wants to display input text in uppercase at runtime while
        keeping the stored variable''s original letter case, by applying a
        text-transform: uppercase CSS style class to the Input widget and
        using the ToUpper function on the variable in logic, in Service
        Studio for OutSystems 11, so end users see uppercase text without
        altering the underlying data casing.'
  - name: UI framework migration
    id: ui-framework-migration
    subtopics:
    - name: Migrate Silk patterns
      id: migrate-silk-patterns
      description: Wants to migrate each Silk Web UI pattern to its OutSystems UI
        equivalent — including remapping content placeholders, updating input parameters,
        and handling structural changes introduced in O11 — so that a Silk-based
        Traditional Web App can be upgraded to the OutSystems 11 Web UI Framework
        without breaking existing screen behavior.
    - name: Migrate CSS classes
      id: migrate-css-classes
      description: Wants to find the OutSystems Web UI CSS class equivalent for
        each Silk Web UI CSS class (background colors, text colors, buttons, and
        text styles), so that a Silk-based Traditional Web App keeps consistent
        visual styling after migrating to the OutSystems 11 Web UI Framework.
    - name: Migration rationale
      id: migration-rationale
      description: Wants to understand why they need to migrate a Silk UI Web
        application to the OutSystems 11 Web UI Framework, including how it
        affects Screen Template compatibility, so they can decide whether and
        when to migrate their apps.
    - name: Estimate migration effort
      id: estimate-migration-effort
      description: Wants to estimate the time and complexity of migrating a
        Silk UI Web application to the OutSystems 11 Web UI Framework, based
        on pattern complexity and whether the app uses a style guide, so they
        can plan and scope the migration work realistically.
    - name: Migrate app structure
      id: migrate-app-structure
      description: Wants to migrate the structural elements of a Silk Web
        application (the Common folder, base theme, and layout blocks) to the
        OutSystems 11 Web UI Framework, in Service Studio, so the
        application's navigation, theming, and layout continue working
        correctly after the UI framework upgrade.
    - name: Choose migration path
      id: choose-migration-path
      description: Wants to choose a migration approach (pattern-by-pattern,
        screen-by-screen, or removing the Silk UI reference outright) for
        upgrading a Silk Web UI Traditional Web App to the OutSystems 11 Web
        UI Framework, so they can pick the path that best fits their team's
        workflow and app complexity.
- name: Creating UI
  guid: a6b567df-2deb-4736-bd6d-cf144a9c6262
  topics:
  - name: Visibility conditions of inputs in App Editor
    id: visibility-conditions-app-editor
    subtopics:
    - name: Removing visibility conditions in App Editor
      id: remove-visibility-cond-app-editor
    - name: Adding visibility conditions in App Editor
      id: add-visibility-cond-app-editor
    - name: Modify visibility conditions in App Editor
      id: edit-visibility-cond-app-editor
    - name: Identify existing visibility conditions in App Editor
      id: id-visibility-cond-app-editor
  - name: Business validations of user input in App Editor
    id: biz-val-app-editor
    subtopics:
    - name: Removing validations in App Editor
      id: remove-biz-val-app-editor
    - name: Adding validations in App Editor
      id: add-biz-val-app-editor
    - name: Refine/Edit validations in App Editor
      id: edit-biz-val-app-editor
    - name: Identify existing validations in App Editor
      id: id-auto-gen-val
  - name: Adding UI Elements to a Screen
    id: add-ui-elements
    subtopics:
    - name: Layouts
      id: layouts
    - name: Adding a Block
      id: adding-a-block
    - name: Block widget reference
      id: block-widget-reference
      description: Wants to look up the properties and runtime properties of the
        Block widget in Service Studio, including Name, Source Block, and Id, so
        that they can correctly display a Block with input parameters on a screen
        in a Traditional Web App or Mobile App (O11).
    - name: Block element reference
      id: block-element-reference
      description: Wants to look up the properties and events of the Block element,
        including its identification, visibility, and lifecycle event handlers,
        in Service Studio, so that they can correctly configure a Block's
        behavior and lifecycle in a Traditional Web App (O11).
    - name: Adding a Widget or OS UI pattern
      id: add-widget-ui-pattern
    - name: UI elements (Blocks, widgets, OS UI patterns, accelerators)
      id: ui-elements-accelerators
    - name: List Records layout
      id: list-records-layout
      description: Wants to display records side-by-side instead of one per line by
        setting the Line Separator property of the List Records widget to None, in
        Service Studio for O11, so that records appear in a multi-column layout on
        the screen.
    - name: Integrate jQuery plugin
      id: integrate-jquery-plugin
      description: Wants to integrate a third-party jQuery plugin into an OutSystems
        Traditional Web app by creating a web block that encapsulates the plugin's
        JavaScript, CSS, and resources, adding optional parameters to control the
        plugin, and using an un-escaped Expression to activate it, in Service Studio
        for O11, so that the plugin can be reused across multiple screens without
        duplicating resources.
    - name: Icon widget reference
      id: icon-widget-ref
      description: Wants to look up the properties, events, and runtime properties
        of the Icon widget in ODC Studio, so that they can correctly configure icon
        display — including icon selection, size, visibility, CSS classes, HTML
        attributes, and event handlers — in a Reactive Web App.
    - name: Tooltip widget reference
      id: tooltip-widget-ref
      description: Wants to look up the properties of the Tooltip widget in ODC
        Studio — including Position, StartsOpen, Trigger, and ExtendedClass — so
        that they can correctly configure tooltip appearance and behavior in a
        Reactive Web App or Mobile App.
    - name: Icon Badge reference
      id: icon-badge-reference
      description: Wants to look up the properties of the Icon Badge UI Pattern
        in Service Studio, including Number, Color, IsLight, and ExtendedClass,
        so that they can correctly configure a numerical notification badge in
        a Mobile App or Reactive Web App for OutSystems 11.
    - name: Add icon widget
      id: add-icon-widget
      description: Wants to add an Icon widget to a screen and select the icon and weight,
        adjusting its size, color, and styling, in ODC Studio, so that visual
        cues are included in the app's UI.
    - name: Use Icon Badge pattern
      id: use-icon-badge-pattern
      description: Wants to add the Icon Badge UI Pattern to a screen and bind
        its Number property to an aggregate count, including adding the widget
        via Toolbox or Search in other modules if the dependency isn't added,
        in Service Studio for OutSystems 11, so that numerical notifications
        like unread message counts display on mobile apps and reactive web apps.
    - name: Adaptive UI patterns
      id: adaptive-ui-patterns
      description: Wants to understand what adaptive UI patterns are and why to use them,
        so that they can choose the appropriate pattern to ensure their app
        displays correctly across different device sizes, resolutions, and
        aspect ratios, in ODC Studio, for mobile apps and reactive web apps.
    - name: Number patterns overview
      id: number-patterns-overview
      description: Wants to know which number-based UI pattern to use for displaying
        numerical data, so that they can choose the appropriate pattern for
        showing counts, percentages, ratings, or progress in a Mobile App or
        Reactive Web App for OutSystems 11.
    - name: Use Columns pattern
      id: use-columns-pattern
      description: Wants to add the Columns UI Pattern to a screen and configure
        its responsive layout properties — including GutterSize, TabletBehavior,
        and PhoneBehavior — in ODC Studio, so that content is organized into an
        adaptive multi-column layout across different device types.
    - name: Use Columns pattern (O11)
      id: use-columns-pattern-o11
      description: Wants to add the Columns UI Pattern to a screen and configure its
        responsive layout properties, in Service Studio for OutSystems 11, so
        that content is organized into an adaptive multi-column layout across
        different device types, in mobile apps and reactive web apps.
    - name: Use Display on Device
      id: use-display-on-device
      description: Wants to add the Display on Device UI pattern to a screen and
        configure its device-specific content placeholders — OnDesktop, OnTablet,
        and OnPhone — in ODC Studio, so that different content is displayed on
        desktop computers, tablets, and phones.
    - name: Use Gallery pattern
      id: use-gallery-pattern
      description: Wants to add the Gallery UI Pattern to a screen and configure
        its responsive layout properties — including RowItemsDesktop, RowItemsTablet,
        RowItemsPhone, ItemsGap, and ExtendedClass — in ODC Studio, so that groups
        of images or content are displayed in a browsable, sequential grid across
        different device types.
    - name: Use Gallery pattern (O11)
      id: use-gallery-pattern-o11
      description: Wants to add the Gallery UI Pattern to a screen and configure
        its responsive layout properties — including RowItemsDesktop, RowItemsTablet,
        RowItemsPhone, ItemsGap, and ExtendedClass — in Service Studio for
        OutSystems 11, so that groups of images or content are displayed in a
        browsable, sequential grid across different device types, in mobile
        apps and reactive web apps.
    - name: Use Floating Content
      id: use-floating-content
      description: Wants to add the Floating Content UI Pattern to a screen and
        configure its properties, including Position, UseFullHeight, UseFullWidth,
        UseMargin, and ExtendedClass, in ODC Studio, so that content overlays on
        top of other screen elements like a map, in mobile apps and reactive web
        apps.
    - name: Use Center Content
      id: use-center-content
      description: Wants to add the Center Content UI Pattern to a screen and
        configure its Top, Center, and Bottom placeholders, including adding the
        widget via Toolbox or Search in other modules if the dependency isn't
        added, and setting the ExtendedClass property, in Service Studio for
        OutSystems 11, so that content is vertically centered within its
        container, in mobile apps and reactive web apps.
    - name: Use Margin Container
      id: use-margin-container
      description: Wants to add the Margin Container UI Pattern to a screen to
        add symmetrical padding around a container, including adding the
        widget via Toolbox or Search in other modules if the dependency isn't
        added, and setting the ExtendedClass property, in Service Studio for
        OutSystems 11, so that content has consistent spacing in mobile apps
        and reactive web apps.
    - name: Margin Container reference
      id: margin-container-reference
      description: Wants to look up the properties of the Margin Container UI
        Pattern in Service Studio, including ExtendedClass, so that they can
        correctly configure custom CSS styling for a Mobile App or Reactive
        Web App in OutSystems 11.
    - name: Display binary image
      id: display-binary-image
      description: Wants to configure an Image widget's Type as Binary Data and
        bind its Image Content property to a binary attribute retrieved from an
        Aggregate, including setting a default image fallback and style properties,
        so that profile pictures show correctly when available and a placeholder
        appears when none is uploaded.
    - name: Use User Avatar pattern
      id: use-user-avatar-pattern
      description: Wants to add the User Avatar UI Pattern to a screen and configure
        its properties, including Name, Image, Color, Size, Shape, IsLight, and
        ExtendedClass, in ODC Studio, so that a circular badge displays a user's
        initials or image in mobile apps and reactive web apps.
    - name: Use Align Center pattern
      id: use-align-center-pattern
      description: Wants to add the Align Center UI Pattern to a screen and configure
        its IsHorizontal and ExtendedClass properties, in ODC Studio, so that content
        is centered horizontally or vertically on the screen, in mobile apps and
        reactive web apps.
    - name: Use Align Center pattern (O11)
      id: use-align-center-pattern-o11
      description: Wants to add the Align Center UI Pattern to a screen and configure
        its IsHorizontal and ExtendedClass properties, in Service Studio for
        OutSystems 11, so that content is centered horizontally or vertically on
        the screen, in mobile apps and reactive web apps.
    - name: Use Inline SVG pattern
      id: use-inline-svg-pattern
      description: Wants to add the Inline SVG UI Pattern to a screen and configure
        its SVGCode and ExtendedClass properties, in ODC Studio, so that they can
        customize SVG fill and stroke properties and animate SVG paths, in mobile
        apps and reactive web apps.
    - name: Use Date Picker Range
      id: use-date-picker-range
      description: Wants to add the Date Picker Range UI Pattern to a screen and configure
        its properties, in Service Studio for OutSystems 11, so that users can
        select a date range from a calendar, in mobile apps and reactive web
        apps.
    - name: Use Dropdown Search
      id: use-dropdown-search
      description: Wants to add the Dropdown Search UI Pattern to a screen and configure
        its properties, in Service Studio for OutSystems 11, so that users can
        select an option from a searchable dropdown list, in mobile apps and
        reactive web apps.
    - name: Multi-select filter list
      id: multi-select-filter-list
      description: Wants to configure a Dropdown Search widget with AllowMultipleSelection
        enabled and store the selected values as a comma-separated screen variable
        used in an aggregate's filter condition, in Service Studio for OutSystems
        11, so that a list can be filtered by multiple categories at once.
    - name: Dropdown Search reference
      id: dropdown-search-ref
      description: Wants to look up the properties and events of the Dropdown
        Search widget in Service Studio, including OptionsList, StartingSelection,
        Prompt, and OptionalConfigs, so that they can correctly configure a
        searchable dropdown selector in OutSystems 11 mobile apps and reactive
        web apps.
    - name: Style dropdown icons
      id: style-dropdown-icons
      description: Wants to override the default circular icon style of the
        Dropdown Search widget with custom CSS (border-radius, height, width)
        in Service Studio for OutSystems 11, so that flag or other custom
        icons display without the default circular mask, in mobile apps and
        reactive web apps.
    - name: Hide List Box scrollbar
      id: hide-list-box-scrollbar
      description: 'Wants to hide the vertical scroll bar of a List Box widget
        by adding overflow-y: hidden and background-image: none CSS style
        properties, in Service Studio for OutSystems 11, so that all list
        values remain visible without a visible scroll bar.'
    - name: List scroll blanks
      id: list-scroll-blanks
      description: 'Wants to prevent blank spaces from appearing while scrolling
        a list on low-end devices, by creating a placeholder image for list
        items without data and applying it via a custom CSS class added to
        the List widget''s Style Classes property, in Service Studio, so that
        scrolling performance and experience improve, in traditional web apps,
        mobile apps, and reactive web apps for OutSystems 11.'
    - name: Use Bottom Bar Item
      id: use-bottom-bar-item
      description: Wants to add the Bottom Bar Item UI Pattern to a screen and
        configure its Icon and Text placeholders across up to four items,
        including a floating action button, in Service Studio for OutSystems
        11, so that users can access a bottom navigation drawer and quickly
        switch between core app features, in mobile apps and reactive web
        apps.
    - name: Use Overflow Menu pattern
      id: use-overflow-menu-pattern
      description: Wants to add the Overflow Menu UI Pattern to a screen and configure its
        properties, in Service Studio for OutSystems 11, so that additional
        options are shown for a row or element when there's a space constraint
        on the UI, in mobile apps and reactive web apps.
    - name: Use Mouse Events pattern
      id: use-mouse-events-pattern
      description: Wants to add the Mouse Events UI Pattern to a screen and
        configure its WidgetId, PreventDefaults, and Handler properties,
        including adding the widget via Toolbox or Search in other modules
        if the dependency isn't added, in Service Studio for OutSystems 11,
        so that they can capture high-precision mouse drag events, such as
        drag distance, in mobile apps and reactive web apps.
    - name: Mouse Events reference
      id: mouse-events-reference
      description: Wants to look up the properties of the Mouse Events UI
        Pattern in Service Studio, including WidgetId and PreventDefaults,
        so that they can correctly configure high-precision mouse event
        handling in OutSystems 11 mobile apps and reactive web apps.
    - name: Validate Upload widget file
      id: validate-upload-widget-file
      description: Wants to add custom validation logic for the Upload widget using If
        conditions on its file name, content, and type information, in Service
        Studio for OutSystems 11, so that end users get an error message when no
        file is selected, an empty file is chosen, or the file type doesn't
        match what's expected, in Traditional Web Apps and Reactive Web Apps.
    - name: Use Upload widget
      id: use-upload-widget
      description: Wants to configure the Upload widget's File Content and File
        Name properties by binding them to aggregate data, so that users can
        upload a file (such as a photo) and save it to the database from a
        Traditional Web App or Reactive Web App form.
    - name: Use Pagination pattern
      id: use-pagination-pattern
      description: 'Wants to add the Pagination UI Pattern to a screen and configure
        its StartIndex, MaxRecords, TotalCount, ShowGoToPage, and ExtendedClass
        properties, in Service Studio for OutSystems 11, so that users can
        navigate through long listings such as e-commerce category pages, search
        engines, and article archives, in mobile apps and reactive web apps.'
    - name: Pagination reference
      id: pagination-reference
      description: Wants to look up the properties of the Pagination UI Pattern
        in Service Studio, including StartIndex, MaxRecords, TotalCount, ShowGoToPage,
        and ExtendedClass, so that they can correctly configure pagination
        behavior and appearance in OutSystems 11 mobile apps and reactive web apps.
    - name: Use Section Index pattern
      id: use-section-index-pattern
      description: Wants to add the Section Index UI Pattern to a screen, including
        adding Section Index Items and Section widgets, entering titles and content,
        and linking each Section Index Item to its Section via the ScrollToWidgetId
        property, in Service Studio for OutSystems 11, so that users can quickly
        navigate to different content sections within a page, in mobile apps and
        reactive web apps.
    - name: Section Index reference
      id: section-index-reference
      description: Wants to look up the properties of the Section Index and Section
        Index Item widgets in Service Studio, including SmoothScrolling, IsFixed,
        ScrollToWidgetId, and ExtendedClass, so that they can correctly configure
        the pattern's scrolling behavior and appearance, in OutSystems 11 mobile
        apps and reactive web apps.
    - name: Use Timeline Item pattern
      id: use-timeline-item-pattern
      description: Wants to add the Timeline Item UI Pattern to a screen and configure
        its IsActive, Color, and ExtendedClass properties, in Service Studio for
        OutSystems 11, so that related events display in chronological order, in
        mobile apps and reactive web apps.
    - name: Use Progress Bar pattern
      id: use-progress-bar-pattern
      description: Wants to add the Progress Bar UI Pattern to a screen and configure
        its Progress property using a local variable and increment button, in
        Service Studio for OutSystems 11, so that they can display percentage
        values and show the current progress of a task flow, in mobile apps and
        reactive web apps.
    - name: Progress Bar reference
      id: progress-bar-reference
      description: Wants to look up the properties of the Progress Bar UI Pattern
        in Service Studio, including Progress, ProgressColor, TrailColor, Thickness,
        and OptionalConfigs (Shape, AnimateInitialProgress), so that they can
        correctly configure a progress bar's appearance and behavior in OutSystems
        11 mobile apps and reactive web apps.
    - name: Use Rating pattern
      id: use-rating-pattern
      description: Wants to add the Rating UI Pattern to a screen and configure its
        RatingValue property, in Service Studio for OutSystems 11, so that users
        can rate items such as products or services on a customizable icon
        scale, in mobile apps and reactive web apps.
    - name: Rating pattern reference
      id: rating-pattern-reference
      description: Wants to look up the properties and events of the Rating UI
        Pattern in Service Studio, including RatingScale, IsEdit, Size,
        ExtendedClass, and OnSelect, so that they can correctly configure a
        rating pattern's scale, editability, and appearance in OutSystems 11
        mobile apps and reactive web apps.
    - name: Use Button Loading pattern
      id: use-button-loading-pattern
      description: Wants to add the Button Loading UI Pattern to a screen and
        configure its IsLoading property using a Boolean local variable, in
        Service Studio for OutSystems 11, so that a button shows a loading
        spinner and is disabled from being clicked while a non-immediate
        action is executing, in mobile apps and reactive web apps.
    - name: Button Loading reference
      id: button-loading-reference
      description: Wants to look up the properties of the Button Loading UI
        Pattern in Service Studio, including IsLoading, ShowLabelOnLoading,
        and ExtendedClass, so that they can correctly configure a button's
        loading spinner behavior and appearance in OutSystems 11 mobile apps
        and reactive web apps.
    - name: Use Video pattern
      id: use-video-pattern
      description: Wants to add a video to a screen using the OutSystems UI
        Video Pattern, configuring it with a URL-hosted video file or an
        uploaded Resource, in Service Studio, so that videos play within
        the app's UI.
    - name: Embed streaming video
      id: embed-streaming-video
      description: Wants to embed a video from a streaming platform like
        YouTube or Vimeo into an app screen by copying the platform's embed
        iframe code and pasting the source URL into an Iframe block's
        SourceURL property, in Service Studio, so that streamed video
        content displays within the app.
    - name: Add autocomplete search
      id: add-autocomplete-search
      description: Wants to add a server-side filtered autocomplete search field
        to an input widget, by adding the Input_AutoComplete and
        Input_AutoComplete_ShowList RichWidgets, wiring the On Notify event to a
        Screen Action containing an Aggregate and filter, in Service Studio for
        OutSystems 11, so that a long list of results is filtered on the server
        and suggestions appear below the field as the user types in a Traditional
        Web App.
    - name: Configure Line Chart
      id: configure-line-chart
      description: Wants to add the Line Chart widget to a screen and configure
        its DataPointList (Label, Value, SeriesName) and Spline property,
        then customize series and markers via SeriesStyling, in Service
        Studio for OutSystems 11, so that a line chart with a smooth spline
        line and custom markers displays correctly in traditional web apps,
        mobile apps, and reactive web apps.
    - name: Order combo box list
      id: order-combo-box-list
      description: Wants to control the order of items displayed in a Combo Box
        widget by sorting the Source Record List, for example via an Aggregate's
        Sort property, in Service Studio, so that a combo box displays entries
        in a specific order, in traditional web apps, mobile apps, and reactive
        web apps for OutSystems 11.
    - name: Set combo box default
      id: set-combo-box-default
      description: Wants to set the default selected value of a Combo Box widget
        by initializing the destination Variable with the desired Source
        Identifier Attribute value, for example using IntegerToIdentifier, in
        Service Studio, so that the combo box pre-selects a specific record
        when the screen loads, in traditional web apps, mobile apps, and
        reactive web apps for OutSystems 11.
    - name: Ajax Refresh reference
      id: ajax-refresh-reference
      description: Wants to look up the properties and key usage rules of the
        Ajax Refresh element (Widget or Web Block, Row Number, Animation
        Effect, one-element-per-node limit, Ajax Submit requirement, Name
        requirement, Web Block Preparation re-execution, refresh order) in
        Service Studio, so that they can correctly configure partial screen
        refreshes without a full page reload, in OutSystems 11 traditional
        web apps, mobile apps, and reactive web apps.
  - name: Creating UI interactions
    id: creating-ui-interactions
    subtopics:
    - name: Implement form validation
      id: implement-form-validation
      description: Wants to implement custom business-rule validation on a
        screen's Save action, using an If condition to check a field's value
        and an Assign to set the input's Valid property to False and its
        ValidationMessage, in Service Studio for OutSystems 11, so that
        invalid data (such as a past due date or a malformed phone number) is
        rejected before it's saved to the database.
    - name: Navigating between screens
      id: navigate-screens
    - name: Resolve unused connector
      id: resolve-unused-connector
      description: 'Wants to resolve the "Connector from <screen> to <screen>
        in never used in <flow>" warning in Service Studio, caused by having
        a connector between two screens that hasn''t been instantiated, by
        adding a Link or Button on the first screen to the second screen so
        the connector is used, so that the module compiles without the
        warning, in OutSystems 11 (O11).'
    - name: Override back navigation
      id: override-back-navigation
      description: Wants to override the default back-navigation behavior by
        registering and unregistering a custom back handler callback via
        $public.Navigation's registerBackNavigationHandler and
        unregisterBackNavigationHandler JavaScript API functions, in ODC mobile
        apps and reactive web apps, so that pressing the device back button (for
        example, Android) triggers custom logic instead of navigating to the
        previous screen.
    - name: Intercept navigation events
      id: intercept-navigation-events
      description: Wants to intercept and conditionally cancel in-app navigation
        events by registering a synchronous callback via $public.Navigation's
        registerNavigationHandler JavaScript API, in ODC mobile apps and reactive
        web apps, so that navigation only proceeds when custom business logic
        approves it.
    - name: Changing data with UI
      id: changing-data-with-ui
    - name: UI interactions in apps
      id: ui-interactions-in-apps
    - name: Resize popup window
      id: resize-popup-window
      description: Wants to dynamically resize a Popup_Editor window at runtime by
        setting the AutoResize property to enable auto-growth and using a JavaScript
        snippet with the RunJavaScript action to enable auto-shrink, in Service Studio
        for O11 Traditional Web Apps, so that the pop-up window adjusts its size
        automatically when its contents change.
    - name: Order workflow patterns
      id: order-workflow-patterns
      description: Wants to implement a status-driven order workflow across multiple
        screens using the Wizard and Popup UI patterns in Service Studio, for
        OutSystems 11 Traditional Web Apps, so that orders are processed and
        displayed through a guided multi-step, multi-screen UI.
    - name: Save active tab state
      id: save-active-tab-state
      description: Wants to save and restore the active tab between page visits in
        a SilkUIFramework Tabs widget, by capturing the clicked tab number via a
        JavaScript onclick handler, persisting it in a session variable, and passing
        it back to the ActiveTab parameter, in Service Studio for O11 Traditional
        Web Apps, so that users return to the same tab after navigating away and
        back.
    - name: Prevent tab cache reload
      id: prevent-tab-cache-reload
      description: Wants to prevent the browser from showing a cached version of
        a screen with tabs after a reload or back-navigation, by adding a Cache-Control
        'NO-STORE' response header via the HttpRequestHandler AddHeader action in
        the screen's Preparation, in Service Studio for O11 Traditional Web Apps,
        so that the restored active tab reflects current state instead of a stale
        cached page.
    - name: Custom validation location
      id: custom-validation-message-location
      description: Wants to display input validation messages in a custom location
        by hiding the default .ValidationMessage CSS class and binding
        <input_name>.ValidationMessage to an Expression widget, in Service Studio
        for O11 Traditional Web Apps and Mobile Apps, so that validation feedback
        appears where business or design requirements demand rather than next to
        the default input position.
    - name: Show feedback message
      id: show-feedback-message
      description: Wants to display and manage feedback messages in an ODC app using the
        FeedbackMessage JavaScript API's showFeedbackMessage and
        closeFeedbackMessage functions, including configuring the message's
        type, styling, and dismissal behavior, in ODC Studio, so that they can
        show styled, auto-dismissing or persistent feedback messages to users in
        Mobile Apps and Reactive Web Apps.
    - name: Identify current screen
      id: identify-current-screen
      description: Wants to identify the currently running application and screen
        (application key/name, screen key/name, ready state) at runtime, by calling
        the ApplicationContext.getCurrentContext() JavaScript API, in ODC Mobile
        Apps and Reactive Web Apps, so that client-side logic can behave contextually
        based on the active screen or app.
    - name: Handle app load status
      id: handle-app-load-status
      description: Wants to detect whether the app is currently being upgraded and
        react to application load events (upgrade progress and load completion), by
        using the ApplicationLifecycle JavaScript API's isUpgradingVersion and
        listen functions, in ODC Mobile Apps and Reactive Web Apps, so that they can
        customize the loading or splash screen experience shown during app
        initialization and upgrades.
    - name: Discover JS API modules
      id: discover-js-api-modules
      description: Wants to discover which JavaScript API modules ODC provides and call
        them through the $public object, in ODC Studio, so that custom app
        behavior can be built in JavaScript for mobile apps and reactive web
        apps.
    - name: Manipulate screen DOM
      id: manipulate-screen-dom
      description: Wants to apply custom CSS classes to the current screen's root DOM
        element and to the document body based on device orientation and type,
        using the View JavaScript API's getCurrentScreenRootElement and
        registerDeviceClassGetter functions, in ODC Mobile Apps and Reactive Web
        Apps, so that DOM-based styling and animations can react to the active
        screen and device characteristics.
    - name: Detect render completion
      id: detect-render-completion
      description: Wants to know when the current screen/block has finished
        rendering, using the View JavaScript API's render() promise, in ODC
        Mobile Apps and Reactive Web Apps, so that custom logic can run after
        rendering completes.
    - name: Detect view cache restoration
      id: detect-view-cache-restoration
      description: Wants to know whether the current view was restored from
        cache, using the View JavaScript API's
        wasCurrentViewRestoredFromCache() function, in ODC Mobile Apps and
        Reactive Web Apps, so that behavior can adapt when a view is restored
        from cache.
    - name: Validate widget state
      id: validate-widget-state
      description: Wants to check whether a widget is valid and set it as valid or
        invalid with a custom message, using the Validation JavaScript API's
        isWidgetValid, setWidgetAsInvalid, and setWidgetAsValid functions, in
        ODC Studio, so that widgets inside iterators (for example, inside a For
        Each node) can be validated individually, in ODC Mobile Apps and
        Reactive Web Apps.
    - name: Define JS code blocks
      id: define-js-code-block-o11
      description: Wants to define JavaScript code blocks at the Module, Web
        Screen, or Web Block level in Service Studio, so that OutSystems
        compiles them into separate .js files added via <script> tags in the
        page's <head> element and the code becomes reusable across Web
        Screens and Web Blocks, in Traditional Web Apps (O11).
    - name: Run JS code methods
      id: run-js-code-methods
      description: Wants to know the ways to run JavaScript code in a
        Traditional Web App, using an Extended Property event, an unescaped
        Expression, or the RunJavaScript Server Action of the
        HTTPRequestHandler API, in Service Studio for O11, so that they can
        trigger custom JavaScript behavior in response to events or during
        screen rendering.
    - name: Set dynamic input value
      id: set-dynamic-input-value
      description: Wants to automatically update one input's value when another
        input changes, using the On Change event, an Assign node, and an Ajax
        Refresh, in Service Studio for OutSystems 11 Traditional Web Apps, so
        that dependent form fields (for example, a date range) update without
        requiring the user to manually re-enter data.
    - name: Multiline table input
      id: multiline-table-input
      description: Wants to allow multiline input in an Editable Table's Text
        Area by using JavaScript to intercept the Enter keypress and insert
        a new line instead of triggering the table's auto-save, in Service
        Studio for OutSystems 11 Traditional Web Apps, so that users can
        enter multi-line text without the row saving prematurely.
    - name: Remove add record
      id: remove-add-record-editable-table
      description: Wants to disable the ability to add new records in an
        Editable Table by modifying the On Row Save server action (changing
        CreateOrUpdate to Update and removing row-creation logic), hiding the
        Add Record icon with a CSS snippet, and blocking the auto-new-row TAB
        behavior with a JavaScript snippet, in Service Studio for OutSystems
        11 Traditional Web Apps, so that end users can only edit existing
        records.
    - name: Remove delete record
      id: remove-delete-record-editable-table
      description: Wants to disable the ability to delete records in an
        Editable Table by leaving the On Row Delete event empty and hiding
        the Delete Record icon/link with a CSS snippet, in Service Studio for
        OutSystems 11 Traditional Web Apps, so that end users can only edit
        existing records without deleting them.
    - name: Fix ignored input
      id: fix-ignored-input
      description: Wants to fix Service Studio warnings caused by user input
        that never reaches the server, either because a screen or block has
        no widget submitting its inputs (no Submit/Ajax Submit button or
        Ajax-triggering widget with a mapped screen action) or because an
        Editable Table has no screen action on its On Row Save or On Row
        Delete event, in OutSystems 11, by adding the missing submit
        button/screen action or event action, so that end user input is
        saved instead of silently ignored.
  - name: Using external JavaScript
    id: using-external-javascript
    subtopics:
    - name: Add external JS library
      id: add-external-js-library
      description: Wants to add JavaScript code from an external library or a
        .js file to an app by importing or creating a script under the Scripts
        folder and setting it as the Required Scripts property on a screen or
        block, in Service Studio for OutSystems 11 Mobile Apps and Reactive Web
        Apps, so that the script's functions and objects become available in
        JavaScript elements on that screen or block.
    - name: Script loading order
      id: script-loading-order
      description: Wants to understand when and in what order required scripts
        load and execute (module-level scripts first, then block-level, then
        screen-level), including that module scripts load before the On
        Application Ready system event and block/screen scripts load before
        their element renders, in OutSystems 11 Mobile Apps and Reactive Web
        Apps, so that they can predict when JavaScript functions and objects
        become available at runtime.
    - name: Add external JS file O11
      id: add-external-js-file-o11
      description: Wants to reference a JavaScript file hosted outside their
        OutSystems infrastructure by adding the AddJavaScriptTag Server
        Action of the HTTPRequestHandler API to a screen's Preparation with
        the file's URL, in Service Studio for O11 Traditional Web Apps, so
        that the external script runs on that screen without hosting the
        file locally.
  - name: Securing UI
    id: securing-ui
    subtopics:
    - name: Secure UI element
      id: secure-ui-element
    - name: Secure screen
      id: secure-screen
    - name: Prevent content copying
      id: prevent-content-copying
      description: Wants to prevent users from copying or capturing page text
        and images, by adding CSS to disable text selection and hide content
        when printing, and JavaScript to block the right-click context menu
        and the print screen key, in OutSystems 11 traditional web apps,
        mobile apps, and reactive web apps, so that page content is harder
        to copy, print, or screenshot.
  - name: Basic front-end architecture
    id: basic-frontend-arch
    subtopics:
    - name: Elements of UI in OutSystems (UI Flow, screen, UI element)
      id: ui-elements-screen-blocks
  - name: Creating Screens
    id: creating-screens
    subtopics:
    - name: Create screen from scratch
      id: create-screen-scratch
    - name: Create screen using scaffolding
      id: screen-scaffolding
    - name: Create screen from screen template
      id: screen-template
- name: Deployment Management
  guid: 2d8be9e7-a1a1-4c3b-943e-93ad568b32b0
  topics:
  - name: Manual deployment without an infrastructure management console
    id: manual-deploy-no-console
    subtopics:
    - name: Publish a module in SC
      id: publish-a-module-in-sc
    - name: Create a solution in SC
      id: create-a-solution-in-sc
    - name: Publish a solution in SC
      id: publish-a-solution-in-sc
    - name: Publish an app in SC
      id: publish-an-app-in-sc
    - name: Publish an extension in SC
      id: publish-extension-sc
  - name: Basic deployment concepts
    id: basic-deployment-concepts
    subtopics:
    - name: Dependencies
      id: dependencies
    - name: Solutions/Apps/Modules/Extensions
      id: solutions-apps-modules
    - name: Environments/Stages
      id: environments-stages
    - name: Deployment options
      id: deployment-options
    - name: Portfolio deploy scope
      id: portfolio-deploy-scope
      description: Wants to understand how deployment, promotion, and undeployment
        of assets are scoped to a single portfolio's stages and pipeline in a
        multi-portfolio OutSystems Developer Cloud (ODC) organization,
        including separate revisions, versions, and deployment history per
        portfolio, so that they deploy and undeploy assets in the correct
        portfolio without affecting others.
    - name: Rename org or stage
      id: rename-org-or-stage
      description: Wants to change the display name of their ODC organization
        or a pipeline stage from the Organization page in the ODC Portal, so
        that the name shown throughout the portal and ODC Studio matches
        updated naming conventions without affecting apps, users, domains, or
        configurations.
    - name: Plan domains early
      id: plan-domains-early
      description: Wants to deliberately choose their ODC organization
        subdomain and each stage's domain when provisioning a new tenant,
        before building apps, generating native mobile builds, or
        configuring external identity providers, so that they minimize the
        need for a disruptive domain change later.
    - name: Change org subdomain
      id: change-org-subdomain
      description: Wants to change their ODC organization's built-in subdomain
        (<subdomain>.outsystems.dev) from the ODC Portal's Organization page,
        understanding that the new subdomain isn't set as default until they
        explicitly switch it, so they can rebrand or correct their
        organization's address without disrupting active users.
    - name: Change stage subdomain
      id: change-stage-subdomain
      description: Wants to change a stage's built-in subdomain
        (<subdomain>.outsystems.app) from the ODC Portal's Domains page,
        understanding that both the new and previous subdomains stay active
        until they explicitly set the new one as default, so they can rename
        a stage's address after a rebrand or SDLC process change without
        breaking existing traffic.
    - name: Finalize subdomain switch
      id: finalize-subdomain-switch
      description: Wants to complete a built-in subdomain change in the ODC
        Portal by setting the new organization or stage subdomain as default
        and then deleting the previous one, understanding that deletion is
        immediate, permanent, and only possible for a non-default subdomain,
        so that they safely retire the old address once all dependent
        configurations have been updated.
    - name: Reauthenticate users after domain change
      id: reauthenticate-users-domain-change
      description: Wants to manage member or end-user reauthentication after
        an organization or stage domain change in ODC, understanding that
        both the previous and new domain stay active until the previous one
        is deleted, so that they avoid access disruptions when retiring the
        old domain.
    - name: Update OIDC redirect URIs after domain change
      id: update-oidc-redirect-uris-domain-change
      description: Wants to update OIDC redirect URIs after an organization
        or stage domain change in ODC, understanding that both the previous
        and new domain stay active until the previous one is deleted, so
        that sign-in flows keep working when they retire the old domain.
    - name: Rebuild native mobile apps after domain change
      id: rebuild-native-mobile-apps-domain-change
      description: Wants to rebuild native mobile apps after an organization
        or stage domain change in ODC, understanding that both the previous
        and new domain stay active until the previous one is deleted, so
        that distributed mobile apps keep pointing to the active domain
        after the old one is removed.
    - name: Reconnect private gateway connectors after domain change
      id: reconnect-private-gateway-connectors-domain-change
      description: Wants to reconnect private gateway connectors after an
        organization or stage domain change in ODC, understanding that both
        the previous and new domain stay active until the previous one is
        deleted, so that private connectivity keeps working when they retire
        the old domain.
    - name: Reconnect self-hosted configurator after domain change
      id: reconnect-self-hosted-configurator-domain-change
      description: Wants to reconnect the self-hosted configurator after an
        organization or stage domain change in ODC, understanding that both
        the previous and new domain stay active until the previous one is
        deleted, so that self-hosted setup keeps working when they retire
        the old domain.
    - name: Reorder pipeline stages
      id: reorder-pipeline-stages
      description: Wants to change the sequence of non-production stages in
        their ODC organization or portfolio pipeline by dragging them into a
        new order in the ODC Portal, understanding that the Development and
        Production stage positions are locked, so that assets move through
        deployment in the desired sequence.
    - name: Stable stage identifiers
      id: stable-stage-identifiers
      description: Wants to identify ODC pipeline stages reliably in scripts
        or integrations that call the ODC APIs for deployment automation,
        using each stage's stable key rather than its order value, since the
        order value changes whenever stages are reordered and would
        otherwise point at a different stage.
  - name: Manual deployment with an infrastructure management console
    id: manual-deploy-mgmt-console
    subtopics:
    - name: Tag a version
      id: tag-a-version
    - name: Dealing with dependencies during deployments
      id: deploy-dependency-management
    - name: Deployment plan
      id: deployment-plan
    - name: Deploy apps in LT/Portal
      id: deploy-apps-in-lt-portal
  - name: Advanced manual deployments
    id: manual-advanced-deploy
    subtopics:
    - name: Selective Deployment Using Deployment Zones (self-managed)
      id: selective-deploy-zones
    - name: Deployments with no downtime
      id: zero-downtime-deployments
  - name: Automated deployments foundations
    id: automated-deploy-basics
    subtopics:
    - name: Automating deployments with API
      id: deployments-api-automation
    - name: Service accounts for automatic deployments
      id: service-accounts-deploy
    - name: CI/CD foundations
      id: ci-cd-foundations
  - name: CI/CD pipelines
    id: ci-cd-pipelines
    subtopics:
    - name: Integrate with external orchestrators for CD
      id: external-orchestrator-cd
    - name: Build O11 CD pipeline
      id: cd-pipeline-stages
      description: Wants to build an automated continuous delivery pipeline for
        O11 applications by using the outsystems-pipeline accelerator with a
        CI/CD platform (Jenkins or Azure DevOps) so that release candidates
        progress automatically through Development, Regression, Acceptance,
        and Pre-production/Production stages with governance and impact
        analysis from LifeTime.
  - name: Troubleshoot 1-Click Publish
    id: troubleshoot-1-click-publish
    subtopics:
    - name: 1-Click Publish errors
      id: 1-click-publish-errors
      description: Wants to locate and resolve ODC build errors from the 1-Click
        Publish service by finding the error code in the reference, understanding
        its cause and impact, and following the recommended fix action, so that
        they can resolve build failures when publishing mobile or reactive web
        apps.
  - name: Troubleshoot self-managed publish errors
    id: troubleshoot-self-managed-publish-errors
    subtopics:
    - name: File access publish error
      id: file-access-publish-error
      description: 'Wants to resolve the "The process cannot access the file
        because it is being used by another process" error during publishing
        in OutSystems 11 (Service Studio, Service Center, or LifeTime), by
        identifying whether antivirus software or another third-party process
        is locking Platform Server files, excluding the required folders from
        antivirus scanning, or using tools like Process Explorer/Process
        Monitor to find and stop the conflicting process, so that publication
        completes successfully.'
    - name: Fix invoke ping error
      id: fix-invoke-ping-error
      description: 'Wants to resolve a "Could not invoke ping" deployment error
        by identifying the HTTP status code returned (5xx or 4xx) on the
        module''s ping request and applying the corresponding fix (e.g.,
        IIS/application pool checks, gateway timeout, network/DNS
        configuration), in OutSystems 11, so that the module''s ping request
        succeeds and deployment completes.'
    - name: Fix ping content error
      id: fix-ping-content-error
      description: 'Wants to resolve an "Unexpected content found in ping"
        deployment error by determining whether the _ping.html content was
        altered by a code-injection tool or by a redirection caused by SEO
        rules, and applying the corresponding fix (disabling the injecting
        tool or removing the offending SEO/pathrule/siterule), in OutSystems
        11, so that deployment completes successfully.'
    - name: Invalid argument error
      id: invalid-argument-error
      description: 'Wants to fix the "Invalid Argument Value" error in Service
        Studio, caused by referencing a non-existent Web Service name in an
        action''s argument, by checking whether the Web Service is consumed
        by the module or correcting the argument name, in OutSystems 11, so
        that the module compiles and publishes successfully.'
    - name: Invalid argument warning
      id: invalid-argument-warning
      description: 'Wants to understand the cause of the "Unable to validate
        if the argument of the action refers a web service consumed in your
        module because the name supplied is not a literal" warning in
        Service Studio, triggered by passing a non-literal (variable) value
        to an action parameter that expects a consumed Web Service name, so
        that they understand why Service Studio can''t validate the web
        service reference at design time, in OutSystems 11.'
    - name: Invalid Blocks error
      id: invalid-blocks-error
      description: 'Wants to resolve the "Invalid Blocks" "Block loop detected"
        error in OutSystems 11, by reading the web block include sequence
        reported in the TrueChange tab or the 1-Click Publish compile step to
        identify which web blocks include each other in a loop, so they can
        break the loop and get the module to compile and publish
        successfully.'
    - name: Invalid client function error
      id: invalid-client-function-error
      description: 'Wants to resolve the "Invalid Client Function" error in
        OutSystems 11, caused by a Client Action marked as a function calling
        a Server Action, Local Storage Aggregate, or asynchronous JavaScript
        node, or by calling a non-function action inside another function, by
        changing the Function property of the relevant Client Action to Yes
        or No as appropriate, so that the module compiles and publishes
        successfully.'
    - name: Invalid Combo Box error
      id: invalid-combo-box-error
      description: 'Wants to resolve the "Invalid Combo Box Widget" error in
        Service Studio, caused by missing or inconsistent Source Entity/Struct,
        Source Record List, Special List, Variable, or Source Attribute
        properties on a Combo Box widget, by editing the widget to set the
        correct combination of properties matching the specific error
        message, in OutSystems 11, so that the module compiles and publishes
        successfully.'
    - name: Fix Empty Widget error
      id: fix-empty-widget-error
      description: 'Wants to resolve the "Empty Widget" error in Service
        Studio, caused by a Dropdown widget that has no content to display
        its values, by placing a widget such as an Expression inside the
        Dropdown, or dragging an Entity or Static Entity Identifier variable
        into it to auto-configure the Dropdown, in OutSystems 11, so that
        the module compiles and publishes successfully.'
    - name: Invalid widget warning
      id: invalid-widget-warning
      description: 'Wants to resolve the "Screen ''<screen name>'' contained
        a corrupted <widget kind> Widget that was re-created. Please check
        its properties" warning in Service Studio, caused by Service Studio
        automatically detecting and recreating a corrupted widget, by
        reviewing and correcting the properties of the recreated widget, in
        OutSystems 11, so that the screen behaves as expected.'
    - name: Invalid Data Action error
      id: invalid-data-action-error
      description: 'Wants to resolve the "Invalid Data Action" error in
        OutSystems 11, caused by a Data Action that doesn''t set a value for
        an Output Parameter or that has no Output Parameters at all, by
        assigning a correctly typed value to the existing Output Parameter
        or creating at least one, so that the module compiles and publishes
        successfully.'
    - name: Duplicate page name error
      id: duplicate-page-name-error
      description: 'Wants to resolve the "Duplicated Page Name" error in
        Service Studio, caused by a Screen''s Page Name clashing with the
        name of another Screen, Block, UI Flow, or the module itself, by
        changing the Page Name to a unique value among those elements, in
        OutSystems 11, so that the module compiles and publishes
        successfully.'
    - name: Incompatible version error
      id: incompatible-version-error
      description: 'Wants to resolve the "This version of Service Studio is
        not compatible with the selected Platform Server" error when
        publishing a module in OutSystems 11, by checking with the Service
        Center administrator which Platform Server version is in use and
        what needs to be upgraded, so that the module publishes
        successfully.'
    - name: Fix Incomplete Upgrade error
      id: fix-incomplete-upgrade-error
      description: 'Wants to resolve the "Incomplete Upgrade" error when
        publishing a module in Service Studio, caused by the module
        consuming other modules that weren''t upgraded yet to the new
        Platform Server version after a server upgrade, by publishing the
        consumed modules first, in OutSystems 11, so that the module
        publishes successfully.'
    - name: Fix upgrade warning
      id: fix-upgrade-warning
      description: 'Wants to resolve the "Upgrade Information Warning" (Producer,
        Consumer, or User Provider "<module>" was published with a different
        Platform Server version) in Service Studio or Service Center, caused
        by a referenced producer, consumer, or user provider module not being
        republished since the last Platform Server upgrade, by republishing
        the affected module (via Service Center notification or 1-Click
        Publish), in OutSystems 11, so that the module avoids runtime errors
        from version mismatches.'
    - name: Invalid Reference error
      id: invalid-reference-error
      description: 'Wants to resolve the "Invalid Reference" error in Service
        Studio, caused either by an Action reference to a Multi-tenant
        entity parameter where the ''Show Tenant Identifier'' property
        differs from the producer module (fixed by removing the reference
        or synchronizing the property value), or by a Block or Screen
        navigating to a Screen outside the application (fixed by removing
        the navigation, using an external link, or moving the module into
        the application), in OutSystems 11, so that the module compiles
        and publishes successfully.'
    - name: Invalid module error
      id: invalid-module-error
      description: 'Wants to resolve the "Invalid module" error in Service
        Studio, caused by a multi-tenant module being used as a User
        Provider for other modules, by setting the module to single-tenant
        or providing an alternative module as the User Provider, in
        OutSystems 11, so that the module compiles and publishes
        successfully.'
    - name: Fix invalid screen error
      id: fix-invalid-screen-error
      description: 'Wants to fix the "Invalid Screen" error family in Service
        Studio for OutSystems 11, caused by setting the Cache in Minutes
        property on a screen or block with a Binary Data, Record, or List
        input parameter, binding the same variable to multiple input widgets,
        or having a corrupted widget definition, by unsetting Cache in
        Minutes, binding each variable to only one widget, or deleting and
        re-creating the corrupted widget, so that the screen or block
        compiles and publishes successfully.'
    - name: Fix invalid property
      id: fix-invalid-property
      description: 'Wants to fix the "Invalid Property" error in Service
        Studio for OutSystems 11, caused by defining the same property (for
        example, an extended property like Title) more than once on the same
        element, by editing the element to remove the duplicate entry, so
        that the module compiles and publishes successfully.'
    - name: Fix invalid property value
      id: fix-invalid-property-value
      description: 'Wants to fix the "Invalid Property Value" error family in
        Service Studio for OutSystems 11, caused by leaving a mandatory widget
        property unset, setting the Default Value property to an expression
        instead of a literal, or setting a Record widget''s Source Record to
        the content of another widget, by setting the required property,
        using a literal or built-in default function, or referencing a local
        variable, query, or preparation-evaluated list instead, so that the
        module compiles and publishes successfully.'
    - name: Fix invalid public action
      id: fix-invalid-public-action
      description: 'Wants to fix the "Invalid Public Action" error in Service
        Studio for OutSystems 11, caused by a public action having a Record
        (Entity/Structure) parameter that isn''t declared as public or is
        defined by a module reference, by making the underlying
        Entity/Structure public or redefining the parameter using an
        Entity/Structure from the current module, so that the module
        compiles and publishes successfully.'
    - name: Fix invalid public block
      id: fix-invalid-public-block
      description: 'Wants to resolve the "Invalid Public Block" error in
        Service Studio, caused by a public Block that uses a Destination
        node to navigate to a Screen or includes another Block that does
        so, by removing the navigation or setting the Block''s Public
        property to No, in OutSystems 11, so that the module compiles and
        publishes successfully.'
    - name: Public screen block error
      id: public-screen-block-error
      description: 'Wants to resolve the "Invalid Public Screen Block" error
        family in Service Studio, caused by a public Screen Block whose
        Record-type input parameter references a non-public Entity/Structure,
        references an Entity/Structure from another module, or is used in a
        link Destination property with a Binary Data, Record, or List input
        parameter, by making the referenced Entity/Structure public, using
        only in-module Entities/Structures, or adjusting/removing the
        Destination argument or the block''s Public property, in OutSystems
        11, so that the module compiles and publishes successfully.'
    - name: Incompatible consumer warning
      id: incompatible-consumer-warning
      description: 'Wants to resolve the "Consumer module has incompatible
        dependencies" warning in OutSystems 11, caused by changing a
        producer module''s exposed signature in a way that breaks a
        consumer module, by refreshing the dependency in the consumer
        module in Service Studio, adapting the logic, and republishing it,
        so that runtime errors are avoided.'
    - name: Outdated consumer
      id: outdated-consumer-warning
      description: 'Wants to resolve the "Consumer module is outdated" warning
        in OutSystems 11, caused by a compatible change to a producer
        module''s exposed functionality that leaves the consumer running an
        older version (applicable only to strong dependencies), by
        republishing the consumer module without needing to refresh its
        producer dependencies, so that it uses the latest producer
        implementation.'
    - name: Inconsistent dependency
      id: inconsistent-dependency-warning
      description: 'Wants to resolve the "Producer is inconsistent" warning
        in OutSystems 11, caused by a Producer (module or Extension) that
        isn''t consistent in the Platform Server where it was deployed, by
        1-Click Publishing the producer module and notifying the Service
        Center administrator, so that runtime errors are prevented.'
    - name: Outdated producer warning
      id: outdated-producer-warning
      description: 'Wants to resolve the "Producer ''<producer>'' uses
        outdated references. Please republish ''<producer>'' to prevent
        runtime errors" warning in OutSystems 11, caused by a referenced
        producer module itself having outdated references to other
        producers that changed since it was last published, by
        republishing the referenced producer module and then republishing
        the consuming module, so that runtime errors are prevented.'
    - name: Fix invalid theme warning
      id: fix-invalid-theme-warning
      description: 'Wants to resolve the "Invalid Theme" warning family in
        Service Studio, caused by using a Web Block as a theme''s Layout,
        Info Balloon, Pop-up Editor, Email, or Menu without the required
        placeholders (''Title'' and ''MainContent'' for Layout;
        ''MainContent'' for Info Balloon/Pop-up Editor/Email; or the
        Menu-specific requirements), by editing the Web Block to add the
        missing placeholders or comply with Menu requirements, or choosing
        a different compliant Web Block, in OutSystems 11, so that the
        theme compiles and publishes successfully.'
    - name: Module name changed warning
      id: module-name-changed-warning
      description: 'Wants to resolve the "Module <name> was renamed to
        <name>. Ensure that external links to this application are
        compliant" warning in OutSystems 11, caused by renaming a module,
        by updating the external links related to the application (for
        example, External Sites that other modules have to this module),
        so that the application remains compliant.'
    - name: Fix missing entity warning
      id: fix-missing-entity-warning
      description: 'Wants to fix the "Foreign Entity/Referenced Entity was
        not found in Platform Server" warning family in OutSystems 11,
        caused by using a Foreign Entity or Entity Reference that doesn''t
        exist yet in the connected server (for example, before deploying
        to a production server), by publishing the extension or Producer
        module that exposes the entity to that Platform Server, so that
        the module publishes without the warning.'
    - name: Missing module warning
      id: missing-module-warning
      description: 'Wants to resolve the "Module <module name> uses module
        <producer name> that was not found. Runtime errors may occur."
        warning in OutSystems 11, caused by a module referencing a producer
        module that can''t be found on the connected Platform Server, by
        checking with the producer module''s owner or the Platform Server
        administrator to determine the cause, so that runtime errors are
        avoided.'
    - name: Missing provider warning
      id: missing-provider-warning
      description: 'Wants to resolve the "Could not find the <provider> User
        Provider module in this server. Application runtime errors might
        occur" warning in OutSystems 11, caused by a module''s configured
        User Provider not existing on the Platform Server it''s published
        to, by checking with the Platform Server administrator or the User
        Provider''s owner to determine the cause, or by changing the
        module''s User Provider property, so that runtime errors are
        avoided.'
    - name: Fix reference warning
      id: modified-or-missing-reference-warning
      description: 'Wants to resolve the "''<element>'' <type> is incompatible
        with ''<Producer>'' <module | extension> definition" or "''<element>''
        <type> was not found in the ''<Producer>'' <module | extension>
        definition" warning in OutSystems 11, caused by a module referencing
        an element that was modified or removed in the Producer module or
        Extension, by refreshing the modified reference or removing the
        missing reference in Service Studio, so that runtime errors are
        avoided.'
  - name: Troubleshoot SEO-friendly URLs
    id: troubleshoot-seo-friendly-urls
    subtopics:
    - name: Fix SEO redirects
      id: fix-seo-redirects
      description: 'Wants to fix SEO-friendly URL redirect rules that don''t
        work in a small number of OutSystems Cloud environments, by checking
        the React version their app is running via the browser console and
        contacting OutSystems Support if it''s lower than 16, in Reactive Web
        Apps, so that redirects work correctly.'
    - name: Fix blocked external URL
      id: fix-blocked-external-url
      description: 'Wants to fix a blank page and "Content Security Policy
        blocked" error that stops users reaching a login or home page, caused
        by using an External URL node in a Screen''s SecurityException logic
        with an active site rule for a domain, by replacing it with a
        JavaScript redirect (window.location.href) instead, in OutSystems 11
        Reactive Web Apps.'
    - name: Avoid duplicate redirects
      id: avoid-duplicate-redirects
      description: 'Wants to avoid duplicate redirects and unpredictable URL
        routing caused by setting a Screen Page Name that matches an app or
        module name already targeted by an environment Site Rule, by
        checking existing Page Names, app/module names, and Site Rules
        before choosing a Page Name, in OutSystems 11 Reactive Web Apps, so
        that SEO-friendly URLs route to the intended destination.'
    - name: Invalid page name error
      id: invalid-page-name-error
      description: 'Wants to resolve the "Invalid Page Name Error" in Service
        Studio, caused by a Screen''s Page Name containing characters other
        than letters, digits, dash, tilde, or slash, by removing the invalid
        characters, in OutSystems 11, so that SEO-friendly URLs work
        correctly.'
    - name: Fix parameter order
      id: fix-parameter-order
      description: 'Wants to fix the "Invalid Parameter Order" error in
        Service Studio, caused by having optional Input Parameters placed
        before mandatory ones on a Screen with custom (Path) URLs, by
        reordering the Input Parameters or changing their Is Mandatory
        property, in OutSystems 11, so that SEO-friendly URLs work
        correctly.'
  - name: Portfolio API management
    id: portfolio-api-management
    subtopics:
    - name: List portfolios via API
      id: list-portfolios-via-api
      description: Wants to list ODC portfolios programmatically by using the
        Portfolio API v2 REST endpoints, so they can discover available
        portfolios before automating portfolio administration.
    - name: Rename portfolio via API
      id: rename-portfolio-via-api
      description: Wants to rename an ODC portfolio programmatically by using
        the Portfolio API v2 REST endpoints, so they can keep portfolio names
        aligned with organizational changes.
    - name: Reorder portfolios via API
      id: reorder-portfolios-via-api
      description: Wants to reorder ODC portfolios programmatically by using
        the Portfolio API v2 REST endpoints, so they can keep portfolio
        organization consistent across environments.
    - name: List environments via Portfolio API
      id: list-environments-via-portfolio-api
      description: Wants to list ODC environments programmatically by using the
        Portfolio API v2 REST endpoints, so they can discover available
        environments before automating environment administration.
    - name: List deployed assets via Portfolio API
      id: list-deployed-assets-via-portfolio-api
      description: Wants to list deployed assets programmatically by using the
        Portfolio API v2 REST endpoints, so they can discover deployed assets
        across portfolios and environments before automating asset
        administration.
    - name: List libraries via Portfolio API
      id: list-libraries-via-portfolio-api
      description: Wants to list libraries programmatically by using the
        Portfolio API v2 REST endpoints, so they can discover available
        libraries before automating library administration.
  - name: ODC public REST APIs
    id: odc-public-rest-apis
    subtopics:
    - name: Choose REST API domain
      id: choose-rest-api-domain
      description: Wants to identify which ODC public REST API domain addresses a given
        automation task, based on each domain's high-level purpose, so they can
        locate the correct API reference for implementation.
    - name: ODC API rate limits
      id: odc-api-rate-limits
      description: Wants to know the domain-wide and specific endpoint request-per-minute
        limits for each ODC public REST API domain, so they can design
        integrations that stay within OutSystems Developer Cloud's rate limits.
    - name: Handle rate limit errors
      id: handle-rate-limit-errors
      description: Wants to know what response the ODC public REST APIs
        return when a client exceeds an API rate limit, so they can detect
        and handle the 429 Too Many Requests response in their integration
        code.
    - name: API terminology mapping
      id: api-terminology-mapping
      description: Wants to map ODC Portal terminology (stage, end-user role) to
        their corresponding ODC REST API resource names (environment,
        application role), so they can correctly interpret API reference
        documentation without confusion between the two naming conventions.
- name: Develop for testability
  guid: 71fc8278-36e0-4a93-a84d-79eb8da3135d
  topics:
  - name: Fundamentals of Domain Driven Design for testability
    id: domain-driven-design-test
    subtopics:
    - name: Code isolation
      id: code-isolation
