      id: ddd-and-testability
    - name: Mapping tests to the Architecture Canvas
      id: map-tests-architecture
  - name: Test data
    id: test-data
    subtopics:
    - name: Setup & teardown strategies for automation
      id: setup-teardown-automation
  - name: Develop UI for testability
    id: testable-ui-development
    subtopics:
    - name: UI development for testability
      id: testable-ui-dev
- name: Developing Plugins
  guid: 241c1f68-e8b9-4b5d-9e03-c1c014240027
  topics:
  - name: Wrap a Cordova plugin as an OS Plugin
    id: wrap-cordova-plugin
  - name: Create LifeTime plugin
    id: create-lifetime-plugin
    description: Wants to create a custom LifeTime plugin for O11 by installing the
      LifeTime SDK in a development environment, exporting sample data,
      developing the plugin in Service Studio using the plugin template, and
      publishing it to the LifeTime environment via Service Center, so that they
      can extend LifeTime with functionality tailored to their organization's
      governance or automation needs.
- name: Getting started with app development
  guid: 08c8e683-27ea-4656-8559-e145b5e05086
  topics:
  - name: Using Service Studio
    id: using-service-studio
    subtopics:
    - name: Log in to an environment
      id: log-in-to-an-environment
    - name: Service Studio overview
      id: service-studio-overview
      description: Wants to navigate Service Studio as a newcomer by understanding
        what each major area of the interface is for and where to perform common
        setup and app-building actions, so they can move through the tool without
        getting blocked by layout or navigation friction.
    - name: Download and set up
      id: download-and-set-up
    - name: Adopt visual paradigm
      id: adopt-visual-paradigm
      description: Wants to understand why the OutSystems visual, model-driven paradigm
        differs from traditional hand-coding, for example through declarative
        logic, drag-and-drop UI composition, and automatic data and logic
        wiring, so they don't force imperative coding habits into Service Studio
        and get blocked early when building their first app.
  - name: Using ODC Portal and Studio
    id: using-odc-portal-and-studio
    subtopics:
    - name: ODC Portal overview
      id: odc-portal-overview
      description: Wants to navigate the ODC Portal as a newcomer by understanding
        what the top bar, Navigation menu, and app-creation options are for, so
        they can move through the console without getting blocked by layout or
        navigation friction.
    - name: ODC Studio overview
      id: odc-studio-overview
      description: Wants to navigate the ODC Studio IDE as a newcomer by understanding what
        each major area of the interface is for, so they can move through the
        tool without getting blocked by layout or navigation friction.
    - name: Get diagnostics report
      id: get-diagnostics-report
      description: Wants to obtain and send an ODC Studio diagnostics report to
        OutSystems Support after an unexpected error or a non-error behavior
        issue, by expanding the Unexpected Error window or using the Give Us
        Feedback icon, opening the report in a text editor, and saving it as
        a text file, so that Support has the information needed to investigate.
  - name: Publish and share apps
    id: publish-and-share-apps
    subtopics:
    - name: Try your app and share with end-users
      id: test-share-app-users
    - name: Publish an app
      id: publish-an-app
  - name: Creating apps
    id: creating-apps
    subtopics:
    - name: Choosing the right app type
      id: choose-app-type
    - name: Creating app from scratch
      id: creating-app-from-scratch
    - name: Application templates overview
      id: application-templates-overview
      description: Wants to understand what application templates are, what types are
        available (built-in, custom, and Forge), and what predefined elements they
        provide, when starting to create an OutSystems app in Service Studio, so that
        they can choose the right template for their project.
    - name: Create custom app template
      id: create-custom-app-template
      description: Wants to create a reusable custom app template in ODC Studio by
        naming the app with the Template_ prefix and adding a description and
        icon, then publishing it, so that the template becomes available as a
        base for new apps with consistent look, feel, and logic.
    - name: Template color inheritance
      id: template-color-inheritance
      description: Wants to understand that an app created from a custom app
        template inherits the template's primary color from its CSS
        declarations even if a different color is selected during app
        creation, so they can predict and control the new app's initial theme
        color.
  - name: Using external OutSystems components
    id: external-outsystems-comp
    subtopics:
    - name: Adding dependencies to a module
      id: add-module-dependency
    - name: Installing Forge component
      id: install-forge-component
    - name: Forge overview
      id: forge-overview
      description: Wants to understand what Forge is, what types of reusable assets (apps, libraries, agentic apps) are available, and how the community-driven sharing model works in OutSystems.
    - name: Forge project classifications
      id: forge-project-classifications
      description: Wants to understand the different Forge project classifications and what
        each means for reliability, maintenance, and support, when evaluating a
        Forge component or app, so that they can decide how much to rely on it.
    - name: Forge project support
      id: forge-project-support
      description: Wants to get support for a Forge project, by contacting
        the appropriate support channel based on the project's
        classification, so that they can resolve issues with a project they
        use.
    - name: Forge project removal
      id: forge-project-removal
      description: Wants to request removal of a Forge project through the
        project owner, following the appropriate process based on the
        project's classification, so that they can address issues with a
        project they use.
  - name: Submitting assets to Forge
    id: submitting-assets-to-forge
    subtopics:
    - name: Submit asset to Forge
      id: submit-asset-to-forge
      description: Wants to submit a new software asset (app or library) built in their
        organization to the Forge repository from ODC Portal, meeting the
        submission prerequisites and completing the submission wizard, so that
        the asset can be reviewed and made available for other users to install.
    - name: Submit new Forge version
      id: submit-new-forge-version
      description: Wants to resubmit an updated version of an asset already
        published to Forge, using the same asset name and updating the
        description, images, release notes, license, and documentation as needed,
        so that existing installers can update to the new version.
  - name: Troubleshoot Forge
    id: troubleshoot-forge
    subtopics:
    - name: Forge errors
      id: forge-errors
      description: Wants to locate and resolve ODC Forge errors by finding the
        error code in the reference, understanding its cause and impact, and
        following the recommended action, so that they can fix issues affecting
        mobile or reactive web apps.
  - name: Setting up your OutSystems environment
    id: setup-outsystems-env
    subtopics:
    - name: OutSystems overview
      id: outsystems-overview
    - name: Install Azure trial
      id: install-azure-trial
      description: Wants to install the OutSystems 11 trial on Microsoft Azure by
        completing the Azure Portal wizard (resource group, credentials, VM size),
        starting the deployed VM, and connecting Service Studio to the new environment,
        so that they have a working OutSystems trial up and running.
    - name: Missing confirmation email
      id: missing-confirmation-email
      description: 'Wants to troubleshoot not receiving the ODC shared space signup
        confirmation email by checking the spam folder and whitelisting the sender
        address, so they know when to try signing up again if it''s still missing.'
    - name: Timezone sync requirements
      id: timezone-sync-requirements
      description: Wants to understand why all components of an OutSystems 11 environment
        (database, controller, and front-ends) must share the same timezone and be
        synchronized via NTP, so that they can configure their infrastructure correctly
        and avoid unexpected behavior with time-dependent features such as timers
        and BPT.
    - name: Fix .NET Core upgrade
      id: fix-net-core-upgrade
      description: Wants to fix Server.API and Server.Identity failing to initialize
        after upgrading to Platform Server 11.12.2 or later in a self-managed environment,
        caused by a missing .NET Core 3.1 Runtime & Hosting Bundle for Windows, so
        that they can verify the cause and complete the platform upgrade successfully.
    - name: Fix controller duplication
      id: fix-controller-duplication
      description: Wants to fix the Environment Health screen showing a Deployment
        Controller or Front-End server listed twice under different names or IP addresses,
        caused by a mismatch between the server's registered name and the Deployment
        Controller Hostname in Configuration Tool, so that they can resolve the duplication
        and restore an accurate environment health display.
    - name: O11 Windows Event logs
      id: o11-windows-event-logs
      description: Wants to locate the log entries generated by OutSystems 11 platform
        components by opening Windows Event Viewer and navigating to the Application
        folder, so they can inspect service errors, warnings, and informational messages
        in a self-managed environment.
    - name: O11 platform log sources
      id: o11-platform-log-sources
      description: Wants to understand the types (error, warning, information), sources
        (which OutSystems 11 services), and contents of log entries written to Windows
        Event Viewer by the OutSystems platform, so they can correctly interpret log
        entries and identify which component generated a given issue.
    - name: Fix CT symlink downtime
      id: fix-ct-symlink-downtime
      description: Wants to diagnose and recover from application downtime caused by
        running Configuration Tool from different paths via a symbolic link in Platform
        Server 11.10.0, which overwrites configuration files and deletes DLLs, so
        that they can remove affected front-end servers from the load balancer, republish
        all modules, and avoid recurrence.
    - name: Fix site property upgrade
      id: fix-site-property-upgrade
      description: 'Wants to fix the "Value cannot be null. Parameter name: key" error
        that occurs when upgrading O11 Platform Server to 11.10.2 or higher on an
        environment originally installed on version 5 or lower, caused by legacy Site
        Property IDs in non-standard format that were not migrated in version 5, by
        running SQL queries to identify and delete the outdated entries, so that they
        can complete the Service Center installation and the platform upgrade successfully.'
    - name: Fix ODP.NET conflict
      id: fix-odp-net-conflict
      description: Wants to resolve Oracle Data Provider for .NET (ODP.NET) driver errors
        — such as "Unsupported column datatype" and TransformDatabaseToRuntimeValue access
        failures — caused by a conflicting Oracle.ManagedDataAccess.dll version in the
        GAC on the platform server, by removing or replacing the DLL using OraProvCfg.exe,
        so that Configuration Tool, Service Studio, and application runtime stop throwing
        Oracle driver errors.
    - name: ODC shared trial
      id: odc-shared-trial
      description: Wants to understand what the ODC shared space trial is, how long
        it lasts (10 days), who shares it, and what limitations it has compared to
        a paid license (no Forge submissions, no user invites, no connections, limited
        apps, no official support), so they can decide whether it meets their learning
        or exploration needs.
    - name: Shared space permissions
      id: shared-space-permissions
      description: Wants to know what permissions a developer has in an ODC shared
        space, including access to the development stage, assets, logs, configurations,
        end-user management, and Forge, so they can plan what they can build and manage
        during the trial.
    - name: PE 503 recovery
      id: pe-503-resource-limit
      description: 'Wants to diagnose an HTTP 503 "Service Unavailable" error
        appearing when accessing apps, using 1-Click Publish in Service
        Studio, or viewing Environment Health in Service Center/LifeTime,
        caused by OutSystems 11 automatically disabling their Personal
        Environment after exceeding memory, CPU, or resource limits, by
        freeing up resources via the Free Up Resources page or contacting
        Support if the problem persists, so that they can restore access to
        their Personal Environment.'
    - name: PE hibernation basics
      id: pe-hibernation-basics
      description: Wants to understand what PE hibernation is, when it triggers after a
        period of development inactivity, what activity prevents it, and its
        impact on published apps and cost, in OutSystems Personal Edition, so
        that they know what to expect from the sleep state and don't mistake it
        for data loss or a paid feature.
    - name: Wake up hibernated PE
      id: wake-hibernated-pe
      description: Wants to reactivate a hibernated OutSystems Personal
        Edition, either manually from the ODC Portal's Manage Organization
        console or automatically by performing a developer action that
        requires the environment to be online, and know how long
        reactivation takes, so that they can resume development or restore
        access to published apps.
    - name: PE hibernation vs deletion
      id: pe-hibernation-vs-deletion
      description: Wants to understand the difference between a hibernated
        Personal Edition (asleep but fully preserved) and a deleted one
        (removed after extended inactivity per the PE lifecycle), so that
        they know hibernation doesn't mean data loss and can anticipate when
        their PE might eventually be deleted.
    - name: O11 error tracking
      id: o11-error-tracking-setup
      description: Wants to obtain error information in a self-managed O11 installation
        by using Service Center's Monitoring area, querying the OutSystems Log Database
        directly, and reading Windows Event Viewer alerts, so that they can track,
        monitor, and receive alerts about errors in the platform.
    - name: O11 perf counters
      id: o11-perf-counters
      description: Wants to use OutSystems Platform Server's Windows Performance Counters
        to monitor asynchronous job execution, application error rates, screen access,
        and web service access in a self-managed O11 environment, so that they can
        track platform runtime performance using Windows Performance Monitor.
    - name: O11 service error recovery
      id: o11-service-error-recovery
      description: Wants to diagnose and recover from errors in OutSystems 11 platform
        services — including Deployment Controller, Deployment Service, Scheduler
        Service, Log Service, IIS, and Message Queue — by reading error messages,
        checking Service Center Monitoring, and restarting services in a self-managed
        environment, so that they can restore normal platform operation.
    - name: Monitoring area screens
      id: monitoring-area-screens
      description: Wants to understand which screen to check first in Service Center's
        Monitoring area for a given kind of issue, so they can locate the right
        diagnostic information without searching through every screen.
    - name: Native app shell logs
      id: native-app-shell-logs
      description: Wants to understand how native app shell logs appear in the Errors and
        General screens of Service Center's Monitoring area, including the
        device information fields they contain, so they can diagnose errors
        occurring on end users' mobile devices.
    - name: O11 platform services
      id: o11-platform-services
      description: Wants to understand the role of each OutSystems 11 platform service
        shown in the Environment Health screen, so they can interpret
        environment health status and know which service is responsible for
        which platform function.
    - name: Fix proxy auth 401
      id: fix-proxy-auth-401
      description: Wants to fix the 401 Unauthorized error (or missing app templates)
        when creating a new app in Service Studio, caused by a proxy between the
        developer's computer and Platform Server tampering with authorization tokens,
        by asking IT to confirm the proxy doesn't manipulate authentication headers,
        so that Service Studio can retrieve app templates in a self-managed OutSystems
        11 environment.
    - name: Fix IIS Basic Auth 401
      id: fix-iis-basic-auth-401
      description: Wants to fix the 401 Unauthorized error (or missing app templates)
        when creating a new app in Service Studio, caused by Basic Authentication
        being enabled on the module at the IIS level instead of the required Anonymous
        Authentication, by enabling Anonymous Authentication in IIS, so that Platform
        Server can correctly authenticate requests in a self-managed OutSystems 11
        environment.
    - name: O11 log table separation and retention
      id: o11-log-table-separation-retention
      description: Wants to understand how OutSystems 11 separates logs by type
        into dedicated database tables and rotates records through retention
        policies, so that they can inspect the correct log table and interpret
        why older records are no longer available.
    - name: O11 asynchronous log writing
      id: o11-async-log-writing
      description: Wants to understand how OutSystems 11 applications write log
        entries asynchronously through an internal logging API with bulk writes,
        so that they can reason about logging behavior without assuming user
        requests block on log persistence.
    - name: O11 separate log database
      id: o11-separate-log-database
      description: Wants to understand how OutSystems 11 log data can be stored
        in a separate database from application data, so that they can plan
        capacity and reduce logging impact on transactional workloads.
    - name: Deployment Controller vs Service Center log access
      id: o11-deployment-controller-vs-service-center-log-access
      description: Wants to understand why the Deployment Controller Service
        writes directly to log tables while Service Center reads through database
        views, so that they can troubleshoot with the correct data path and avoid
        misinterpreting each component's role.
    - name: View log entities Service Studio
      id: view-log-entities-ss
      description: Wants to consult OutSystems 11 log data directly in Service Studio
        by referencing the PlatformLogs Extension in the Manage Dependencies window
        and loading data from the Entities under Data > Entities > PlatformLogs, so
        that they can inspect log records without querying the database manually.
    - name: Top-level vs drill logs
      id: top-level-vs-drill-logs
      description: Wants to distinguish top-level logs (Screen, exposed Integration,
        Mobile Request, Cyclic Job) from drill logs (Error, General, consumed Integration,
        Extension) in the OutSystems 11 log database, and how they're linked via
        the request_key field, so that they can correctly interpret how a drill
        log relates to the top-level access request that generated it.
    - name: Remove Log Service
      id: remove-log-service
      description: Wants to remove the OutSystems Log Service and its Microsoft
        Message Queues from a self-managed OutSystems 11 environment after upgrading
        every module of every application to OutSystems 11, by running a PowerShell
        cleanup script and closing the associated firewall port, so that they can
        free up server memory no longer needed for pre-OutSystems 11 logging.
