- name: Native Mobile apps
  guid: f67965c4-a2ef-4076-8676-c8b8203ab671
  topics:
  - name: MABS release notes
    id: mabs-release-notes
    subtopics:
    - name: MABS 12 upgrade overview
      id: mabs-12-upgrade-overview
      description: Wants to understand what's new in MABS 12, including Capacitor
        support, the iOS 26 and Android API 36 SDK updates, build actions, and
        universal extensibility, so that they can plan whether and how to
        upgrade their mobile app's build service version.
    - name: MABS 12 breaking changes
      id: mabs-12-breaking-changes
      description: Wants to understand the breaking changes introduced in MABS
        12 for Capacitor apps (WebView version requirement, removed iOS
        Inspector, DeepLinksHandlerType no longer effective) and Cordova apps
        (Android status bar behavior, renamed Cordova template files), so that
        they can update their app before or after upgrading the MABS version.
    - name: MABS 12.1 splash screen changes
      id: mabs-12-1-splash-changes
      description: Wants to understand how splash screen behavior and configuration changed
        for Capacitor apps in MABS 12.1, including the native splash screen
        implementation, IDE-driven settings replacing extensibility
        configuration, and the new branding image size requirement, so that they
        can update their app's splash screen setup correctly.
    - name: MABS 6 upgrade overview
      id: mabs-6-upgrade-overview
      description: Wants to understand what's new across MABS 6.0 to 6.3,
        including the introduction of WKWebView as the default web view,
        Android 10 (API 29) and iOS 13 SDK support, removal of UIWebView,
        and the optional AndroidX support added in 6.3, so that they can
        plan whether and how to upgrade their mobile app's build service
        version.
    - name: MABS 8 upgrade overview
      id: mabs-8-upgrade-overview
      description: Wants to understand what's new in MABS 8.0 and 8.1, including
        iOS 15 and Android 12 (API 31) support, Gradle 7.1.1, Java 11, and
        updated Forge plugin version requirements, so that they can plan
        whether and how to upgrade their mobile app's build service version.
    - name: MABS 8 breaking changes
      id: mabs-8-breaking-changes
      description: 'Wants to understand the breaking changes introduced in
        MABS 8.0, including the mandatory android:exported attribute for
        Android 12 components, removal of Gradle''s compile configuration,
        the Cordova AllowList Plugin replacing Whitelist Plugin, and the
        native Android 12 splash screen behavior, so that they can update
        their app before or after upgrading the MABS version.'
    - name: MABS version support
      id: mabs-version-support
      description: Wants to know which MABS versions are currently supported,
        deprecated, or obsolete, and which Android and iOS versions and build
        tools each version supports, so they can choose the correct MABS
        version for their mobile app and plan upgrades before a version
        becomes obsolete.
  - name: Mobile app debugging
    id: mobile-app-debugging
    subtopics:
    - name: Inspect network traffic
      id: inspect-network-traffic
      description: Wants to inspect network requests and responses generated by
        their mobile app, using Chrome or Safari Developer Tools or network
        proxy tools (HTTP Toolkit, Mitmweb, Charles), so that they can debug
        HTTP traffic, check first-visit resource loading, and monitor OTA
        updates.
    - name: Simulate slow network
      id: simulate-mobile-network-conditions
      description: Wants to simulate degraded network conditions (slow,
        unreliable, or packet-dropping connections) in a mobile app using
        Chrome Developer Tools, Charles, or the iOS Network Link Conditioner,
        so that they can investigate bugs that occur only intermittently or
        under poor network conditions.
  - name: Local Storage
    id: local-storage
    subtopics:
    - name: SQLite attribute limit
      id: sqlite-attribute-limit
      description: Wants to understand why Android mobile apps with local storage
        entities that have a large number of attributes, or complex queries
        returning many attributes, throw Out Of Memory exceptions due to a
        SQLite plugin limitation in how Android handles JSON objects
        internally, so that they can keep entities under the 50-attribute
        threshold and avoid the issue.
    - name: Persist screen state
      id: persist-screen-state
      description: Wants to maintain field values entered on a mobile screen (for
        example, a search form) across navigation to other screens and back, by
        storing the values in a Local Storage entity filtered by user ID and
        updating it via a client action on the field's OnChange event, in
        Service Studio for OutSystems 11, so that user input persists without
        relying on the back button.
  - name: Firebase plugin migration
    id: migrate-firebase-plugins
    description: Wants to migrate mobile app logic from unsupported Firebase-based
      plugins (Firebase Mobile) to the newer supported Firebase plugins (Analytics,
      Performance Monitoring, Crash Reporting, Cloud Messaging), by replacing
      actions with their equivalents, so the app benefits from dedicated release
      cycles, OutSystems support, and new features.
    subtopics:
    - name: Migrate LogEvent action
      id: migrate-analytics-logevent
      description: Wants to replace the LogEvent action of the unsupported Firebase
        Mobile plugin with the LogEvent action of the supported Analytics plugin
        in Service Studio, by deleting the old action and substituting its
        parameters with the new action's equivalents, so analytics logging keeps
        working after migration.
    - name: Migrate Cloud Messaging
      id: migrate-cloud-messaging-notifications
      description: Wants to migrate topic subscription and push notification
        handling from the unsupported Firebase plugin to the supported Cloud
        Messaging plugin, by calling the Subscribe action, adding the
        NotificationsHandler/NotificationDialog blocks, and using the Cloud
        Messaging Configurator's REST API, so notifications keep working after
        migration.
  - name: App distribution
    id: app-distribution
    subtopics:
    - name: Apple privacy manifest
      id: apple-privacy-manifest
      description: Wants to include a privacy manifest (PrivacyInfo.xcprivacy) in their ODC mobile app so that it meets Apple App Store submission requirements, with accurate API usage justifications.
    - name: Configure manifest in ODC
      id: configure-manifest-odc
      description: Wants to upload and configure a privacy manifest file in ODC Studio and the ODC Portal using extensibility settings, so that the file is packaged into their iOS app build.
    - name: File plugin manifest
      id: file-plugin-manifest
      description: Wants to declare the correct API reason keys (NSPrivacyAccessedAPICategoryFileTimestamp, NSPrivacyAccessedAPICategoryDiskSpace) and recommended reason values for the File plugin in a PrivacyInfo.xcprivacy file, so that the app passes Apple App Store privacy validation when using the File plugin.
    - name: Distribute as PWA
      id: distribute-as-pwa
      description: Wants to understand what a PWA is, how it compares to native mobile
        app distribution in ODC, and how to enable and try out the PWA on Android and
        iOS devices, so that they can offer their mobile app to users without requiring
        an app store installation.
    - name: Debug PWA
      id: debug-pwa
      description: Wants to debug a PWA built in ODC by emulating it in Google Chrome
        from ODC Studio's Debugger tab, so that they can inspect and troubleshoot the
        app without a physical device.
  - name: Offline Synch
    id: offline-synch
    subtopics:
    - name: Complex mobile sync
      id: complex-mobile-sync
      description: Wants to optimize complex offline data synchronization in a mobile
        app — including when and what to sync, context-based sync moments, SyncProperties
        with time deltas, lightweight local database design, and minimizing server
        requests — so that the app performs efficiently and remains error-tolerant
        under demanding synchronization scenarios.
    - name: Fix missing device data
      id: fix-missing-device-data
      description: Wants to troubleshoot missing data on a mobile device, caused by
        offline synchronization errors, misconfigured sync filtering rules, or
        aggregates with restrictive JOIN "Only With"/"With or Without" settings on
        local storage entities, by checking server data, device local storage, and
        sync/aggregate configuration, so that expected data appears on the device.
  - name: Mobile app performance troubleshooting
    id: mobile-app-performance-troubleshooting
    subtopics:
    - name: Fix mobile UI flicker
      id: fix-mobile-ui-flicker
      description: Wants to fix a screen element that flickers (rapid content or
        style changes) in a mobile app, caused by rapid data/state changes or
        delayed CSS style calculations, by reviewing conditional logic and
        aggregate timing or deferring element visibility until styles are ready,
        so that the transition is smooth.
    - name: iOS 12 viewport flicker
      id: ios-12-viewport-flicker
      description: Wants to fix the screen flickering that occurs on iPhones running iOS 12
        when the viewport-fit meta tag is set to cover on a screen with many
        input fields, in mobile apps built with MABS 4 or MABS 5, by applying
        the documented workaround for the shared native stack issue, so that the
        screen displays smoothly without flickering.
    - name: Fix slow transition
      id: fix-slow-transition
      description: Wants to fix a slow transition between two screens in a mobile
        app caused by slow operations (native plugin calls or server actions)
        running in the On Initialize event handler before the screen DOM loads,
        by moving them to On Ready or another later event handler, so that the
        destination screen loads quickly.
  - name: Data security
    id: mobile-data-security
    description: Wants to protect sensitive data in OutSystems Developer Cloud (ODC)
      mobile apps by minimizing local storage of sensitive information (keeping
      it server-side and fetching it only when needed over authenticated HTTPS
      connections), using the device's encrypted keystore, for example via the
      KeyStore Plugin, for small sensitive items like authentication tokens, and
      mandatorily re-validating all data server-side, so that mobile app data
      stays protected against device compromise and client-side tampering.
  - name: Extensibility configurations
    id: extensibility-configurations
    subtopics:
    - name: App extensibility config
      id: app-extensibility-use-cases
      description: Wants to customize a mobile app's runtime and build-time behavior beyond
        the Mobile tab defaults, using the app extensibility configurations JSON
        schema, so that functionality not exposed by the Mobile tab UI can be
        configured.
    - name: Library plugin config
      id: plugin-extensibility-use-cases
      description: Wants to customize a mobile library's plugin runtime and
        build-time behavior, such as specifying Cordova and Capacitor plugin
        sources, setting plugin preferences and configurations, declaring
        permissions and usage descriptions, defining installation variables,
        copying resources, and running build actions, using the library
        extensibility configurations JSON schema, so that Cordova and
        Capacitor plugins can be wrapped and configured for mobile apps.
  - name: OTA upgrade troubleshooting
    id: ota-upgrade-troubleshooting
    subtopics:
    - name: Fix cache manifest error
      id: cache-manifest-not-found-error
      description: 'Wants to resolve the "Failed to load cache manifest: File
        not found" error that leaves a mobile app stuck on the splash screen
        during an OTA upgrade, by reloading the app or reinstalling it, so
        that the app upgrade completes successfully.'
    - name: Fix corrupt cache manifest
      id: cache-manifest-corrupt-error
      description: 'Wants to resolve the "Cache manifest file is corrupt or
        invalid" error that causes a mobile app to stop working or fail to
        start, typically caused by insufficient device disk space corrupting
        the on-device cache manifest file, by checking available storage and
        reinstalling the app, so that the app works again.'
    - name: Fix local entity type error
      id: fix-local-entity-type-error
      description: 'Wants to resolve the "Upgrade failed - rolling back to
        previous application version" / "Unable to upgrade attribute" error
        caused by an incompatible Local Entity attribute data type change
        when the device already holds data for that entity, by rolling back
        the app and clearing the cache/data or reinstalling on affected
        devices, so that the OTA upgrade completes successfully.'
    - name: Database close error
      id: database-close-error
      description: 'Wants to understand the informative "failed to close
        database ... cannot be closed while a transaction is in progress"
        error that occurs when a mobile app closes its database connection
        on window unload while a transaction is still running, so that they
        can confirm it''s safe to ignore since it has no impact on the app.'
    - name: Resource not found error
      id: resource-not-found-error
      description: 'Wants to understand the informative "Unable to find
        resource <Resource>" error, visible only in Mobile Device Logs and
        accessible through ADB, that occurs when WebView requests a resource
        outside a cached frame or a locally-served Cordova plugin resource,
        so that they can confirm it''s safe to ignore since it has no impact
        on the end user.'
    - name: InputStream cache error
      id: inputstream-cache-error
      description: 'Wants to resolve the "Could not get InputStream while
        trying to get cache resource" error caused by a mobile app''s
        WebView requesting a file missing from the device file system,
        often due to low storage, which triggers the healing mechanism and
        may leave the app unusable if healing fails, by checking device
        storage, reloading the app, or reinstalling it, so that the cache
        resource loads and the app works again.'
    - name: Fix cache version switch error
      id: switch-cache-version-error
      description: 'Wants to resolve the "Unable to switch to cache version"
        error caused by a state mismatch between the client runtime and the
        native side during an OTA cache upgrade, by reloading the app or
        checking device storage and reinstalling it, so that the mobile app
        upgrades successfully.'
    - name: Fix OTA download timeout
      id: fix-ota-download-timeout
      description: Wants to resolve the "Aborting resources download... The request timed
        out" / "Upgrade failed - rolling back to the previous application
        version" error caused by a mobile device's poor network connection or
        large OTA resources exceeding the fixed per-resource download timeout,
        by reloading the app to retry the OTA upgrade or, if the new resources
        consistently fail, generating and distributing a new full application
        package, so that the OTA upgrade completes successfully.
    - name: OTA rollback behavior
      id: ota-rollback-behavior
      description: 'Wants to understand why a mobile app''s OTA upgrade rolls
        back to the previously cached version on failure and why
        already-downloaded resources are preserved via a checkpoint
        mechanism so the next OTA attempt doesn''t redownload everything,
        so they can anticipate runtime issues (like server action
        mismatches) after a failed OTA upgrade.'
    - name: Healing resource error
      id: healing-resource-error
      description: 'Wants to understand and resolve the "Healing resource
        <Resource> from prebundle: FAILED" error (and its "healing from the
        web" variant, sometimes accompanied by a "File is corrupt or
        invalid" checksum error), which leaves a mobile app in an invalid
        state recoverable only via an app store update, by reloading the
        app or reinstalling it from the app store, so that the app returns
        to a working state.'
  - name: Customize Mobile apps
    id: customize-mobile-apps
    subtopics:
    - name: Detect device ready
      id: detect-device-ready
      description: Wants to wait until Cordova's native device APIs are fully
        loaded before running device-specific logic, by binding to the
        whenReady() JavaScript API promise instead of the deviceready DOM
        event, in ODC Mobile Apps, so that code safely accesses device
        properties (model, UUID, platform) only after Cordova initialization
        completes.
    - name: Build action errors
      id: build-action-errors
      description: Wants to troubleshoot a failed Capacitor build action caused
        by invalid JSON syntax, incorrect target selectors/XPath, unresolved
        variable references, or malformed merge/inject content in the build
        action configuration file, so that the mobile app build completes
        successfully.
    - name: Missing resource error
      id: missing-resource-error
      description: 'Wants to resolve the OS-MABS-CNF-40012 "resource {0} declared
        in your extensibility configurations can''t be found" error, caused by
        an extensibility configuration''s resources entry pointing to a missing
        file, by checking and correcting the resource declarations for their
        app and its dependencies, so that the mobile app package generates
        successfully.'
    - name: Resource file missing
      id: resource-file-missing-error
      description: 'Wants to resolve the OS-MABS-PRJ-40004 "Resource file declared
        in extensibility configurations can''t be found" error, caused by a
        literal file path pointing to a missing resource in the app''s or a
        library''s extensibility configuration, by replacing the literal path
        with a placeholder or correcting it to an existing file, so that the
        mobile app package generates successfully.'
    - name: Android manifest error
      id: android-manifest-error
      description: 'Wants to resolve the OS-MABS-GEN-40001 "multiple errors merging
        the Android Manifest" error, by checking the Service Center build logs
        to identify the custom plugins causing the incompatibility, so that the
        Android mobile app package generates successfully.'
    - name: Support library error
      id: support-library-error
      description: 'Wants to resolve the OS-MABS-GEN-40006 "there was an issue
        generating the app" error, caused by a custom Cordova plugin using
        deprecated Android Support Library components, by identifying the
        plugin(s) via com.android.support references and migrating them to
        AndroidX, so that the Android mobile app package generates
        successfully.'
    - name: Metadata conflict error
      id: metadata-conflict-error
      description: 'Wants to resolve the OS-MABS-GEN-40008 "meta-data {0} is
        being defined more than once" error, by identifying which custom
        plugin is overriding the same Android manifest metadata attribute
        more than once, so that the Android mobile app package generates
        successfully.'
    - name: Google Services error
      id: google-services-error
      description: 'Wants to resolve the OS-MABS-GEN-40011 "There was an issue
        generating the app. Some plugins using Google Services aren''t
        correctly configured" error, by reviewing and correcting the Google
        Services plugin configuration file setup, so that the Android mobile
        app package generates successfully.'
    - name: Cordova build failure
      id: cordova-build-failure-error
      description: 'Wants to resolve the OS-MABS-GEN-50000 "Couldn''t generate
        your app. If the problem persists, check our documentation for more
        information." error, by regenerating the app package and checking the
        build logs in Service Center for O11 or ODC Portal for ODC, so that
        the mobile app package generates successfully.'
    - name: Invalid CocoaPods spec error
      id: invalid-cocoapods-spec-error
      description: 'Wants to resolve the OS-MABS-PLG-40005 "Spec attribute in
        the Framework element related to CocoaPods is invalid" error, by
        checking the Service Center build logs to identify the misconfigured
        Cordova plugin''s plugin.xml, so that the iOS mobile app package
        generates successfully.'
    - name: CocoaPods pod not found
      id: cocoapods-pod-not-found-error
      description: 'Wants to resolve the OS-MABS-PLG-40006 "Couldn''t install
        the Cordova plugin due to an error in the plugin.xml file. The
        specified pod wasn''t found in the CocoaPods repository" error, by
        checking the Service Center build logs and fixing the pod dependency
        on the affected Cordova plugin, so that the mobile app package
        generates successfully.'
    - name: Swift CocoaPods error
      id: swift-cocoapods-error
      description: 'Wants to resolve the OS-MABS-PLG-40008 "Couldn''t install
        the Cordova plugin because CocoaPods built in Swift are not
        supported" error, by importing the affected pod as a framework in
        the plugin''s podspec, so that the iOS mobile app package generates
        successfully.'
    - name: Cordova version mismatch
      id: cordova-version-mismatch-error
      description: 'Wants to resolve the OS-MABS-PLG-40009 "Couldn''t install
        the Cordova plugin because your plugin doesn''t support this
        Cordova version" error, by checking the build log to identify the
        incompatible plugin and either updating the plugin or changing the
        MABS version, so that the mobile app package generates
        successfully.'
    - name: Plugin config mismatch
      id: plugin-config-mismatch-error
      description: 'Wants to resolve the OS-MABS-PLG-40010 "Couldn''t install
        the Cordova plugin. Your plugin must have a package.json file that
        matches the configurations in the plugin.xml file" error, by checking
        the build logs on Service Center to identify the mismatch between the
        plugin''s package.json and plugin.xml files and correcting the plugin
        configuration, so that the mobile app package generates
        successfully.'
    - name: Invalid plugin spec error
      id: invalid-plugin-spec-error
      description: 'Wants to resolve the OS-MABS-PLG-40011 "Couldn''t install
        the Cordova plugin due to an issue with the plugin specification" error,
        by checking the build logs on Service Center to identify the mismatch
        in plugin name, version, or URL between the plugin.xml and package.json
        files, so that the mobile app package generates successfully.'
    - name: Plugin SDK tag error
      id: plugin-sdk-tag-error
      description: 'Wants to resolve the OS-MABS-PLG-40012 "Couldn''t install
        the Cordova plugin because it''s not supported by MABS 6.0 and later
        versions" error, caused by the plugin trying to change the
        <uses-sdk> tag in the AndroidManifest.xml file, by updating the
        plugin or changing the MABS version, so that the mobile app package
        generates successfully.'
    - name: Missing XML node error
      id: missing-xml-node-error
      description: 'Wants to resolve the OS-MABS-PLG-40013 "Couldn''t install
        the Cordova plugin because the plugin tried to edit a missing XML
        node" error, caused by an XML selector not finding the target node
        in the config file, by checking the Service Center build logs and
        fixing the selector path, so that the mobile app package generates
        successfully.'
    - name: Non-Cordova module error
      id: non-cordova-module-error
      description: 'Wants to resolve the OS-MABS-PLG-40015 "Couldn''t install
        the Cordova plugin. Using requireCordovaModule to load a non-Cordova
        module is not supported" error, by checking the Service Center build
        logs to identify the plugin using requireCordovaModule and replacing
        it with require, so that the mobile app package generates
        successfully.'
    - name: Missing module dependency error
      id: missing-module-dependency-error
      description: 'Wants to resolve the OS-MABS-PLG-40016 "Couldn''t install
        the Cordova plugin due to a missing dependency in module
        {node_module}" error, by checking the Service Center build logs to
        identify the affected plugin and fixing its missing node module
        dependency, including hooks dependencies declared in the plugin''s
        package.json for MABS 7 and later, so that the mobile app package
        generates successfully.'
    - name: Forge plugin version error
      id: forge-plugin-version-error
      description: 'Wants to resolve the OS-MABS-PLG-40019 "<plugin_name>"
        error, caused by using a Forge plugin version that isn''t compatible
        with MABS 8.0 or higher, by updating the plugin to its latest
        version, so that the mobile app package generates successfully.'
    - name: Incompatible plugin error
      id: incompatible-plugin-error
      description: 'Wants to resolve the OS-MABS-PRJ-40003 "One or more
        Capacitor plugins aren''t compatible with <PackageManager>" error,
        caused by the code project''s selected package manager (SPM or
        CocoaPods) not supporting one or more required Capacitor plugins, by
        checking the build logs to identify the incompatible plugins and
        updating libraries, toggling the spmPreview configuration, or
        removing the affected plugins/libraries, so that the iOS mobile app
        package generates successfully.'
    - name: SSL Pinning domain error
      id: ssl-pinning-domain-error
      description: 'Wants to resolve the OS-MABS-RES-40001 "The configuration
        file for SSLPinning must not contain OutSystems domains" error, by
        reviewing the SSLPinning JSON configuration file and removing any
        OutSystems domains, so that the mobile app package generates
        successfully.'
    - name: SSL Pinning format error
      id: ssl-pinning-format-error
      description: 'Wants to resolve the OS-MABS-RES-40003 "The configuration
        file has an invalid format. Add a file with a valid format for
        SSLPinning" error, by validating and correcting the SSLPinning
        configuration file''s format and content, so that the mobile app
        package generates successfully.'
    - name: Fetch resources error
      id: fetch-resources-error
      description: 'Wants to resolve the OS-MABS-RES-50002 "Couldn''t fetch
        your app resources" error, by checking the build logs for details
        and retrying application generation, escalating to OutSystems
        support if the problem persists, so that the mobile app package
        generates successfully.'
    - name: Resource load timeout
      id: resource-load-timeout-error
      description: 'Wants to resolve the OS-MABS-UNX-50000 "There was an issue
        loading your resources. Please try again." error, caused by MABS
        timing out while building the mobile app package (fetching
        application resources, installing custom plugins, or downloading
        native libraries from Maven or CocoaPods repositories), by retrying
        the operation and checking the build logs in Service Center,
        escalating to OutSystems Support if the problem persists, so that
        the mobile app package generates successfully.'
    - name: Signing certificate error
      id: signing-certificate-error
      description: 'Wants to resolve the OS-MABS-SIG-40010 "There are no
        certificates that match the provisioning profile" error, by
        confirming and updating the certificate and provisioning profile
        information so they match each other, so that the mobile app
        package generates successfully.'
    - name: Document storage error
      id: document-storage-error
      description: 'Wants to resolve the OS-MCO-50002 "A document is not
        available in the document storage" error, by retrying the mobile
        compilation and escalating to OutSystems Support if the problem
        persists, so that the native mobile build completes successfully.'
    - name: Storage comms error
      id: storage-comms-error
      description: 'Wants to resolve the OS-MCO-50003 "An error occurred
        while communicating with the document storage" error, by retrying
        the mobile compilation and escalating to OutSystems Support if the
        problem persists, so that the native mobile build completes
        successfully.'
    - name: Template package error
      id: template-package-error
      description: 'Wants to resolve the OS-MCO-50016 "The template NPM
        package is invalid. If the problem persists, open a support case."
        error, by retrying the mobile compilation and escalating to
        OutSystems Support if the problem persists, so that the native
        mobile build completes successfully.'
    - name: Config XML error
      id: config-xml-error
      description: 'Wants to resolve the OS-MCO-50017 "An error occurred
        while modifying the config.xml. If the problem persists, open a
        support case." error, by removing invalid XML characters from the
        extensibility configurations of the mobile app or its libraries,
        retrying the mobile compilation, and escalating to OutSystems
        Support if the problem persists, so that the native mobile build
        completes successfully.'
    - name: Mobile framework error
      id: mobile-framework-error
      description: 'Wants to resolve the OS-MCO-50022 "MABS version does not
        include <MobileFramework>. If the problem persists, open a support
        case." error, by retrying the mobile compilation and escalating to
        OutSystems Support if the problem persists, so that the native
        mobile build completes successfully.'
    - name: Branding image size error
      id: branding-image-size-error
      description: Wants to resolve the OS-MABS-PRJ-40001 "Branding image for <Screen> must
        be a specific pixel size, but is <Actual>" error, by resizing the splash
        screen branding image to match the required dimensions and updating the
        app's splash screen configuration, so that the mobile app package
        generates successfully.
    - name: Branding image format error
      id: branding-image-format-error
      description: Wants to resolve the OS-MABS-PRJ-40002 "Branding image for <Screen>
        couldn't be read. The file may be corrupted or in an unsupported
        format." error, by opening the branding image in an image editor to
        confirm it's valid, re-exporting it as a PNG in the required dimensions,
        and updating the app's splash screen configuration, so that the mobile
        app package generates successfully.
    - name: Invalid project config error
      id: invalid-project-config-error
      description: 'Wants to resolve the OS-MABS-PRJ-50001 "The project
        configuration is invalid. If the problem persists, open a support
        case." error, by regenerating the app package or contacting
        OutSystems Support if the problem persists, so that the mobile app
        package generates successfully.'
    - name: Splash image resize error
      id: splash-image-resize-error
      description: 'Wants to resolve the OS-MABS-PRJ-50002 "An error occurred
        while generating the splash screen images" error, caused by the
        branding image failing to be transformed or resized to match iOS or
        Android splash screen requirements, by regenerating the app package
        or contacting OutSystems Support if the problem persists, so that the
        mobile app package generates successfully.'
    - name: File copy/write error
      id: file-write-copy-error
      description: 'Wants to resolve the OS-MABS-PRJ-50003 "An error occurred
        while writing or copying a file. If the problem persists, open a
        support case." error, by regenerating the app package or contacting
        OutSystems Support if the problem persists, so that the mobile app
        package generates successfully.'
    - name: Invalid code structure error
      id: invalid-code-structure-error
      description: 'Wants to resolve the OS-MABS-PRJ-50004 "The code project
        structure is invalid. If the problem persists, open a support case."
        error, caused by a missing or malformed file or folder in the native
        project template, by regenerating the app package or contacting
        OutSystems Support if the problem persists, so that the mobile app
        package generates successfully.'
    - name: Cordova dependency error
      id: cordova-dependency-error
      description: 'Wants to resolve the OS-MABS-PRJ-50005 "An error occurred
        while resolving Cordova plugin dependencies. If the problem
        persists, open a support case." error, caused by a declared Cordova
        plugin not found among installed dependencies or a missing or
        unreadable dependency manifest, by regenerating the app package or
        contacting OutSystems Support if the problem persists, so that the
        mobile app package generates successfully.'
    - name: Template preparation error
      id: template-preparation-error
      description: 'Wants to resolve the OS-MABS-PRJ-50006 "An error occurred
        while preparing the project template. If the problem persists,
        open a support case." error, caused by a missing or unpreparable
        iOS or Android project template archive, by regenerating the app
        package or contacting OutSystems Support if the problem persists,
        so that the mobile app package generates successfully.'
    - name: Plugin auth error
      id: plugin-auth-error
      description: 'Wants to resolve the OS-MABS-PLG-20002 "Couldn''t fetch
        the Cordova plugin <plugin_name> due to an authentication error"
        error, by reviewing the server and plugin access permissions used
        to fetch the plugin, so that the mobile app package generates
        successfully.'
    - name: Plugin fetch HTTP error
      id: plugin-fetch-http-error
      description: 'Wants to resolve the OS-MABS-PLG-40014 "There was an
        issue fetching the Cordova plugin: <plugin_name>. We couldn''t
        access the resource (http error <http_error_code>). Please review
        your plugin and server configurations." error, by checking the
        Service Center build logs and validating the plugin and server
        extensibility configurations, so that the mobile app package
        generates successfully.'
    - name: Undocumented MABS error
      id: undocumented-mabs-error
      description: Wants to resolve a MABS build error that isn't yet documented,
        by opening a support case with OutSystems Support, so that they can get
        help resolving their mobile app build issue.
    - name: Deprecated MABS version error
      id: deprecated-mabs-version-error
      description: Wants to resolve the error that occurs when creating a
        mobile app package using a deprecated MABS version, by switching to a
        MABS version that meets the minimum required version, so that the
        mobile app package generates successfully.
  - name: AppShield
    id: appshield
    subtopics:
    - name: Retrace obfuscated logs
      id: retrace-obfuscated-logs
      description: Wants to deobfuscate an Android stack trace generated by a MABS
        AppShield-obfuscated build, using ProGuard's retrace CLI or proguardgui with
        the build's mapping.txt file, so that they can identify the root cause of
        a crash in an obfuscated app.
    - name: Plugin obfuscation errors
      id: plugin-obfuscation-errors
      description: Wants to understand why a customized or unsupported mobile plugin
        produces ClassNotFoundException or MethodNotFoundException errors at runtime
        after AppShield obfuscation, so that they can identify whether misconfigured
        dependencies, Gradle/JAR/AAR imports, or reflection-based code are causing
        the issue.
    - name: Duplicate AppShield ref
      id: duplicate-appshield-reference
      description: 'Wants to resolve the OS-MABS-SHLD-40001 "The AppShield plugin
        has more than one reference in your app" error, by checking the
        extensibility configurations for duplicate references to the AppShield
        plugin and removing them, keeping only the reference from the AppShield
        plugin retrieved from Forge, so that the mobile app package generates
        successfully.'
    - name: AppShield settings error
      id: appshield-settings-error
      description: 'Wants to resolve the OS-MABS-SHLD-40003 "Some AppShield plugin
        settings have invalid values, please review them" error, by reviewing
        the AppShield preferences in their extensibility configurations
        against the documented configuration reference and correcting the
        invalid values, so that the mobile app package generates
        successfully.'
    - name: Outdated MABS version error
      id: outdated-mabs-version-error
      description: Wants to resolve the OS-MABS-SHLD-40004 "It looks like your MABS version
        is outdated, please update it" error, by updating MABS to the minimum
        version required for the AppShield plugin, so that the AppShield plugin
        is supported and the mobile app package generates successfully.
    - name: License upgrade error
      id: license-upgrade-error
      description: 'Wants to resolve the OS-MABS-SHLD-40005 "It looks like
        OutSystems AppShield is not accessible with your current license" error,
        by contacting OutSystems Support to upgrade their license, so that the
        AppShield build succeeds and the mobile app package generates
        successfully.'
    - name: AppShield generic error
      id: appshield-generic-error
      description: 'Wants to resolve the OS-MABS-SHLD-50000 "Something happened
        and we couldn''t harden your app with AppShield. Please try again."
        error, by checking the build logs for issues related to the Shield
        phase and escalating to OutSystems Support if the problem persists,
        so that the mobile app package generates successfully.'
  - name: Custom plugin development
    id: custom-plugin-development
    subtopics:
    - name: Choose plugin approach
      id: choose-plugin-approach
      description: Wants to decide whether to build a custom Capacitor plugin
        from scratch or reuse an existing option (Forge plugin, adapted Cordova
        plugin, or community Capacitor plugin), so that they avoid
        unnecessary investment in custom native plugin development for ODC
        mobile apps.
    - name: Plan custom Capacitor plugin
      id: plan-custom-capacitor-plugin
      description: Wants to plan a custom Capacitor plugin for an ODC mobile
        app after deciding that no existing Forge plugin, adapted Cordova
        plugin, or community Capacitor plugin meets their requirements, so
        that they can start building from scratch with the right development
        sequence.
    - name: Implement Android plugin
      id: android-plugin-implementation
      description: Wants to implement the native Android layer of a custom
        Capacitor plugin for an ODC mobile app, using Kotlin or Java to
        define the plugin's "bridge" file with @PluginMethod-annotated
        methods that receive a PluginCall parameter, so that they can
        implement Android-specific functionality declared in the plugin's
        web layer.
    - name: Capacitor plugin layers
      id: capacitor-plugin-layers
      description: Wants to understand how a Capacitor plugin's code is
        organized into web, Android, and iOS layers, and what each layer's
        directory (src, android, ios) is responsible for, so they can locate
        and modify the right layer when building or troubleshooting a
        plugin.
    - name: Capacitor bridge flow
      id: capacitor-bridge-flow
      description: Wants to understand how the Capacitor bridge routes a
        plugin call from the JavaScript layer through window.CapacitorPlugins
        to native Android or iOS code and back, in an ODC mobile app, so they
        can reason about plugin call behavior end to end.
    - name: Implement iOS plugin
      id: ios-plugin-implementation
      description: Wants to implement the native iOS layer of a custom
        Capacitor plugin for an ODC mobile app, using Swift to define the
        plugin's "bridge" file with @objc-annotated methods that receive a
        CAPPluginCall parameter, so that they can implement iOS-specific
        functionality declared in the plugin's web layer.
    - name: Add SPM support
      id: add-spm-support
      description: Wants to add Swift Package Manager (SPM) support to a
        custom Capacitor plugin by creating a Package.swift file declaring
        the plugin as a library target with its native dependencies and
        source path, so that the plugin builds correctly in ODC mobile apps
        using the SPM toolchain instead of, or alongside, CocoaPods.
    - name: Plugin privacy manifest
      id: plugin-privacy-manifest
      description: Wants to bundle a PrivacyInfo.xcprivacy file within a
        custom Capacitor plugin's iOS Sources directory and reference it as
        a resource bundle in the plugin's .podspec and Package.swift files,
        so that the manifest is correctly discovered by Xcode without
        colliding with the app's own privacy manifest.
    - name: Implement web plugin layer
      id: implement-web-plugin-layer
      description: Wants to scaffold a custom Capacitor plugin project and
        implement its web/TypeScript layer, by using the plugin generator to
        create the project structure, defining the plugin's TypeScript
        interface and method signatures in definitions.ts, and registering
        the plugin with registerPlugin() in index.ts, so that the web layer
        serves as the entry point that native Android and iOS
        implementations bind to.
    - name: Test custom Capacitor plugin
      id: test-custom-capacitor-plugin
      description: Wants to test a custom Capacitor plugin in an ODC mobile
        app after implementing its web and native layers, so that they can
        confirm it behaves correctly across supported platforms before
        release.
    - name: Package custom Capacitor plugin
      id: package-custom-capacitor-plugin
      description: Wants to package a custom Capacitor plugin for distribution
        after implementing and testing it, so that consumers can install the
        expected plugin files consistently in downstream projects.
    - name: Publish Capacitor plugin to npm
      id: publish-capacitor-plugin-npm
      description: Wants to publish a tested custom Capacitor plugin to npm, so
        that ODC wrapper libraries and consuming mobile apps can install a
        versioned release from a standard package registry.
    - name: Create ODC wrapper library for plugin
      id: create-odc-wrapper-library-plugin
      description: Wants to create an ODC wrapper library for a custom
        Capacitor plugin after the plugin package is ready, so that ODC mobile
        app developers can call the plugin through reusable OutSystems
        elements instead of hand-writing JavaScript integration code.
  - name: Deep linking
    id: deep-linking
    subtopics:
    - name: Configure mobile deep links
      id: configure-mobile-deep-links
      description: Wants to define a deep link to a specific screen of a
        module in an OutSystems Mobile App using the
        `<app-identifier>://<module>/<screen>` syntax, including passing
        input parameter values in the URL, so that end users and external
        systems can navigate directly to a specific screen of the app.
    - name: Configure Android deep link intents
      id: configure-android-deep-link-intents
      description: Wants to define an Android Intent for a Mobile App using
        the `intent://` syntax, including specifying a custom fallback URL,
        so that Android Chrome users without the app installed are
        redirected to the Google Play Store or another URL instead of the
        app.
- name: OutSystems data centers
  guid: 5d6b141d-82f8-4949-af54-6593592e0327
  topics:
  - name: Firewall allowlisting
    id: firewall-allowlisting
    subtopics:
    - name: Allowlist front-end IPs
      id: allowlist-frontend-public-ips
      description: Wants to obtain the static public IPs of their
        OutSystems Cloud environment's front-end servers via Service
        Center and correctly allowlist them on their firewall instead of
        the load balancer's IP, so that outgoing connections to external
        services through the firewall aren't blocked.
    - name: Allowlist VPN IP range
      id: allowlist-vpn-private-ip-range
      description: Wants to allowlist the full private IP range of their
        OutSystems Cloud on their firewall when connecting via VPN instead
        of a single IP, so that traffic isn't blocked due to the
        non-static nature of individual private IP addresses.
  - name: VPN connection troubleshooting
    id: vpn-connection-troubleshooting
    subtopics:
    - name: Fix VPN IP errors
      id: fix-vpn-ip-errors
      description: Wants to resolve VPN creation errors caused by an invalid or
        already-used Internet gateway public IP address when creating a VPN in
        the LifeTime console, so that they can provide a valid and unique
        public IP address.
    - name: Fix VPN connection limit errors
      id: fix-vpn-connection-limit-errors
      description: Wants to resolve VPN creation errors caused by exceeding the
        maximum number of VPN connections when creating a VPN in the LifeTime
        console, so that they can choose another supported setup to connect the
        infrastructure.
    - name: Fix VPN Transit Gateway conflict errors
      id: fix-vpn-transit-gateway-conflict-errors
      description: Wants to resolve VPN creation errors caused by an
        infrastructure already being connected to an AWS Transit Gateway when
        creating a VPN in the LifeTime console, so that they can use the
        existing Transit Gateway setup instead of creating a conflicting VPN.
    - name: Fix VPN ASN errors
      id: fix-vpn-asn-errors
      description: Wants to resolve VPN creation errors related to an invalid
        BGP ASN value, whether already in use, outside the 0-65535 range, or
        reserved by Amazon, when configuring a VPN connection in the LifeTime
        console, so that they can provide a valid, unreserved, and unique ASN
        value.
    - name: Fix VPN route errors
      id: fix-vpn-route-errors
      description: Wants to resolve errors when adding static routes to a VPN connection in
        the LifeTime console, including an invalid or overlapping internal
        network IP range, the disallowed 0.0.0.0/0 range, exceeding the maximum
        allowed number of routes, or a temporary "operation in progress"
        conflict, so that they can correct the route configuration and complete
        the request.
    - name: Fix VPN Dead Peer Detection (DPD) failures
      id: fix-vpn-dpd-failures
      description: Wants to diagnose and fix VPN tunnel instability caused by
        Dead Peer Detection (DPD) failures after setup, so that they can
        restore a stable OutSystems Cloud VPN connection.
    - name: Fix periodic IKEv2 tunnel drops
      id: fix-periodic-ikev2-tunnel-drops
      description: Wants to diagnose and fix periodic IKEv2 tunnel drops
        due to IKE/IPsec SA lifetime expiration and rekeying after setup, so
        that they can restore a stable OutSystems Cloud VPN connection.
    - name: Fix asymmetric routing with dual active VPN tunnels
      id: fix-vpn-asymmetric-routing-dual-active-tunnels
      description: Wants to diagnose and fix VPN tunnel instability caused by
        asymmetric routing with dual active tunnels after setup, so that they
        can restore a stable OutSystems Cloud VPN connection.
    - name: Fix VPN Phase 1 (IKE) and Phase 2 (IPsec) negotiation failures
      id: fix-vpn-phase-1-phase-2-negotiation-failures
      description: Wants to diagnose and fix VPN tunnel instability caused by
        Phase 1 (IKE) and Phase 2 (IPsec) negotiation failures after setup, so
        that they can restore a stable OutSystems Cloud VPN connection.
    - name: Test VPN connectivity
      id: test-vpn-connectivity
      description: Wants to test and troubleshoot VPN connectivity to
        OutSystems Cloud environments using ping, traceroute, telnet, and
        nslookup against the OutSystems DNS servers and front-end domain
        names, so that they can confirm whether DNS resolution and the
        network path to their environments works over the established VPN.
    - name: Configure VPN DNS resolution
      id: configure-vpn-dns-resolution
      description: Wants to configure conditional forwarders on their
        internal DNS servers to resolve OutSystems Cloud environment public
        domain names, internal network domain names, and external database
        hostnames over the VPN, so that traffic routes correctly through the
        internal load balancers instead of failing to resolve.
  - name: Organization region information
    id: organization-region-information
    subtopics:
    - name: View organization regions
      id: view-organization-regions
      description: Wants to view their ODC organization's Runtime region,
        Data platform region, and Platform region on the Organization page
        in ODC Portal, so that they can verify data residency for
        compliance and allowlist the correct IP addresses for networking.
- name: Product security
  guid: f5935fdf-7f64-46b8-bc71-dd69627c33d8
  topics:
  - name: Cloud shared responsibility model
    id: cloud-shared-responsibility-model
    subtopics:
    - name: Shared responsibility overview
      id: shared-responsibility-overview
      description: Wants to understand how security and infrastructure
        responsibilities are divided between OutSystems and the customer in
        OutSystems Cloud (ODC and OutSystems 11 Cloud) deployments, so that
        they know which protections OutSystems provides and where their own
        responsibility begins.
    - name: Cloud customer duties
      id: cloud-customer-duties
      description: Wants to understand which security and application
        lifecycle tasks customers must handle themselves in OutSystems Cloud,
        such as data management, secure development, vulnerability testing,
        and mitigation, so that they can meet their share of the shared
        responsibility model.
    - name: OutSystems cloud duties
      id: outsystems-cloud-duties
      description: Wants to understand which infrastructure and platform
        security tasks OutSystems handles on their behalf in OutSystems
        Cloud, such as platform security, network/firewall configuration,
        encryption, and compute/storage/database management, so that they
        know what protections are already covered without needing action on
        their part.
  - name: Cloud infrastructure maintenance
    id: cloud-infrastructure-maintenance
    subtopics:
    - name: Set maintenance window
      id: set-maintenance-window
      description: Wants to configure the maintenance window (day of week and
        time interval) for a production or non-production OutSystems Cloud
        environment via the LifeTime console, so that database maintenance
        and any related downtime occur at a time that minimizes disruption.
    - name: Cloud maintenance schedule
      id: cloud-maintenance-schedule
      description: Wants to understand the schedule, frequency, advance notice periods,
        and rescheduling rules for OutSystems Cloud system updates, so that they can
        plan around maintenance windows and avoid unexpected service disruption.
    - name: Cloud update downtime
      id: cloud-update-downtime
      description: Wants to understand the expected downtime during OutSystems Cloud
        system updates based on their infrastructure configuration (single front-end,
        multiple front-ends, load balancer), so that they can assess the impact on
        their production environment.
    - name: SQL Server version upgrade
      id: sql-server-2022-upgrade
      description: Wants to understand what changes during the SQL Server 2022 upgrade of
        O11 Cloud databases (version and compatibility-level change) and whether
        it introduces breaking changes or requires application modifications, so
        that they can confirm whether their applications need any adaptation.
    - name: Windows Server upgrade breaking changes
      id: windows-server-upgrade-breaking-changes
      description: Wants to understand and prepare for the breaking changes
        introduced by the Windows Server 2022 upgrade of O11 Cloud environments
        (TLS protocol deprecation, OS-level dependency changes, private IP
        address changes, front-end storage loss, and required Platform Server
        upgrade), so that they can adapt their applications and infrastructure
        before their scheduled upgrade date.
    - name: Update lifecycle states
      id: update-lifecycle-states
      description: Wants to understand the states an ODC platform infrastructure update
        moves through during its life cycle, so that they can track update
        status and know what action, if any, is needed at each stage.
    - name: PCI DSS patching compliance
      id: pci-dss-patching-compliance
      description: Wants to understand how OutSystems Cloud system updates fulfill
        PCI DSS Requirement 6.2 for timely security patching, so that they can confirm
        their environment meets compliance obligations without taking manual action.
    - name: Reschedule platform updates
      id: reschedule-platform-updates
      description: Wants to view upcoming ODC platform infrastructure updates in
        the ODC Portal (Management > Maintain > Platform updates) and reschedule
        any of them to a different date within the allowed time window, so that
        they can prepare each tenant stage for the change at a convenient time.
    - name: Platform update notifications
      id: platform-update-notifications
      description: Wants to know who receives email notifications about ODC platform
        infrastructure updates and what permission determines that, so that they
        can ensure the right people stay informed of scheduled and rescheduled
        updates.
  - name: Vulnerability disclosures
    id: vulnerability-disclosures
    subtopics:
    - name: Vulnerability disclosure
      id: public-vulnerability-disclosure
      description: Wants to understand a specific publicly disclosed OutSystems
        Platform Server vulnerability (affected component, CVSS risk score,
        embargo/disclosure timeline, patched versions), so that they can assess
        their exposure and apply the appropriate patch or workaround to protect
        their OutSystems 11 on-premises or cloud environment.
    - name: Activate remoting security
      id: activate-remoting-security
      description: Wants to activate the Enhanced security for Remoting requests
        setting per environment (including LifeTime) after upgrading to the
        RPM-3056 fixed Platform Server/LifeTime versions and upgrading their
        apps, so that they can complete the mandatory remediation for this
        vulnerability without breaking apps compiled on older, unpatched
        versions.
  - name: Regulatory compliance
    id: regulatory-compliance
    subtopics:
    - name: HIPAA requirements
      id: hipaa-compliance-requirements
      description: Wants to understand what protected health information (PHI) and
        electronic PHI (ePHI) are under HIPAA, the difference between the HIPAA
        Privacy Rule and Security Rule, and who counts as a covered entity or
        business associate, so that they can determine whether their OutSystems
        application handling health data falls under HIPAA obligations.
    - name: Achieve HIPAA compliance
      id: hipaa-odc-compliance
      description: Wants to understand what's required to achieve HIPAA compliance for an
        OutSystems Developer Cloud (ODC) application handling protected health
        information (PHI), such as obtaining a Business Associate Agreement
        (BAA), independent auditor attestation, and access to an audit trail, so
        that they can legally handle PHI in production and meet their
        organization's compliance obligations.
    - name: Achieve PCI compliance
      id: pci-odc-compliance
      description: Wants to achieve PCI DSS compliance for an OutSystems Developer Cloud
        (ODC) application processing credit card payments, by delegating payment
        handling to a third-party PCI-compliant payment gateway rather than
        processing card data directly, and using Sentry for ODC, so that
        cardholder data is never stored or processed within OutSystems
        applications and compliance obligations are met.
