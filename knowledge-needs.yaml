    id: soa-and-microservices
- name: Advanced data handling
  guid: c6a945c1-deaa-4266-9b94-d7b31d9fdf07
  topics:
  - name: When to use Aggregates vs SQL Nodes
    id: agg-vs-sql
  - name: Stored procedures
    id: stored-procedures
  - name: Aggregating data
    id: agregating-data
    subtopics:
    - name: Dynamic sort setup
      id: dynamic-sort-setup
      description: Wants to implement dynamic sorting on calculated attributes in
        an aggregate that uses external entities, so that the sort works correctly
        at runtime without errors or empty results.
    - name: Aggregation functions
      id: aggregation-functions
      description: Wants to understand which aggregation functions are available
        in an Aggregate, what the output contains after applying them, and how
        Group By affects which columns are returned, in OutSystems, so that
        queries return only the expected calculated results.
  - name: SQL
    id: sql
    subtopics:
    - name: Query parameters
      id: query-parameters
    - name: Use SQL
      id: use-sql
    - name: Implement dynamic SQL statements correctly
      id: dynamic-sql-correctly
    - name: SQL operator reference
      id: sql-operator-reference
      description: Wants to know which ANSI-92 operators and functions — comparison,
        logical, arithmetic, string, date/time, conditional, aggregate, and window —
        are supported in SQL queries with external entities in ODC, so they can write
        correct queries without accidentally using unsupported syntax.
    - name: SQL type conversion
      id: sql-type-conversion
      description: Wants to know which type conversion functions (such as CAST,
        DECIMAL_TO_TEXT, TEXT_TO_INTEGER) are available and what behavior to expect
        when converting between data types in SQL queries with external entities in
        ODC, so they can avoid runtime errors and produce correct results.
    - name: SQL NULL behavior
      id: sql-null-behavior
      description: Wants to understand how NULL values behave in SQL operators and
        functions when querying external entities in ODC — including how NULL handling
        differs between push-down and ODC-handled execution in mashup queries — so
        they can write reliable queries that handle NULLs correctly across different
        external systems.
    - name: ANSI-92 syntax basics
      id: ansi-92-syntax-basics
      description: Wants to understand the ANSI-92 SQL syntax rules used in ODC SQL
        nodes — including entity and attribute notation, identifier casing behavior,
        and how to run multiple statements in a single SQL node with transaction
        semantics — so they can write correct queries against external entities without
        syntax errors.
    - name: SQL query execution
      id: sql-query-execution
      description: Wants to understand how ODC parses, normalizes, and executes SQL
        queries against external entities — including push-down behavior for
        single-system queries and performance considerations for mashup queries
        spanning multiple external systems — so they can write efficient and correct
        queries.
    - name: Update SQL statement
      id: update-sql-statement
      description: Wants to update records in an external entity using the ANSI-92
        UPDATE statement in an ODC SQL node — including SET clause syntax, WHERE
        filtering, permissions, return behavior, and data source compatibility —
        so they can correctly modify data in external systems.
  - name: Compound data
    id: compound-data
  - name: Binary data actions
    id: binary-data-actions
    description: Wants to know which actions the BinaryData library provides in ODC,
      including their inputs, outputs, and supported encodings, so that they can
      convert and manipulate binary content correctly in logic flows.
  - name: Dealing with rollbacks
    id: dealing-with-rollbacks
    subtopics:
    - name: Force update conflict
      id: force-update-conflict
      description: Wants to let a user override a detected concurrent-update
        conflict and force-save their changes after being warned, in OutSystems 11,
        so that data isn't silently lost but the user can still choose to overwrite
        when confident their information is current.
    - name: Detect update conflicts
      id: detect-update-conflicts
      description: Wants to implement a pessimistic concurrency strategy that
        detects concurrent update conflicts before saving a record, using
        GetForUpdate to lock the record and comparing audit attributes (such as
        UpdatedOn) between the loaded and current record, in OutSystems 11, so
        that users don't unknowingly overwrite each other's changes.
    - name: Isolation level basics
      id: isolation-level-basics
      description: Wants to understand which operations start and end a database
        transaction in ODC (write operations like Create, Update, Delete, GetForUpdate;
        and Commit, Rollback, or end of Request), and how the Read Committed isolation
        level prevents dirty reads by hiding uncommitted changes from concurrent
        transactions, so that they can reason about data visibility during concurrent
        database operations.
- name: Advanced data modeling
  guid: 9a38cf20-a3dc-491a-8a25-c261c830e9c7
  topics:
  - name: Data performance, caching
    id: data-performance-caching
    subtopics:
    - name: Connection pool usage
      id: connection-pool-usage
      description: Wants to understand when and how to use connection pooling when
        connecting to external databases (SQL Server, Oracle, PostgreSQL, DB2, MySQL)
        via extensions in OutSystems 11 — including connections from OutSystems
        extensions back to the OutSystems database — so that frequent connections do
        not degrade application performance as load scales up.
    - name: Optimize data transfer
      id: optimize-data-transfer
      description: Wants to understand how OutSystems 11 optimizes server-to-client
        data transfer for Screen Aggregates, Data Actions, and Server Actions used
        in client-side Screen Actions logic in Mobile Apps and Reactive Web Apps,
        so that they know when and why the platform automatically reduces the data
        sent to the client.
  - name: Indexes
    id: indexes
  - name: Enforcing data integrity
    id: enforcing-data-integrity
  - name: Exposing data via REST webservices
    id: rest-webservice-data
  - name: Data isolation
    id: data-isolation
  - name: Data archiving / cold data
    id: data-archiving-cold-data
  - name: Data synchronization
    id: data-syncronization
- name: Advanced integrations
  guid: fb5d71a9-9ac6-4fda-adea-e89546e0af89
  topics:
  - name: Webservice customization
    id: webservice-customization
    subtopics:
    - name: Customize request and response
      id: custom-request-response
    - name: API rate limit
      id: api-rate-limit
    - name: Customize headers
      id: customize-headers
  - name: Integration Patterns
    id: integration-patterns
  - name: Extensions
    id: extensions
    subtopics:
    - name: Integrate using custom code
      id: custom-code-integration
    - name: Parse XML XPath
      id: parse-xml-xpath
      description: Wants to extract filtered data from an XML file using XPath expressions
        in a Server Action, by loading the XML document, selecting nodes with an
        XPath expression, and iterating over the matched nodes to read their
        values, using the OutSystems 11 XML Extension, so that only the data
        matching specific criteria is available for downstream business logic
        without processing the entire document.
    - name: Integrate with legacy systems
      id: legacy-systems-integration
      subtopics:
      - name: Access Lotus Notes data
        id: access-lotus-notes-data
        description: Wants to access data from a legacy Lotus Notes/Domino application
          using ODBC and a SQL Server Linked Server, on a 64-bit SQL Server environment,
          so that OutSystems applications can query that legacy data at runtime.
  - name: Handling webservice errors
    id: handle-webservice-errors
- name: Advanced security
  guid: dedf532a-fe2a-4e93-8316-731133ad6ba1
  topics:
  - name: Handling sensitive data
    id: handling-sensitive-data
    subtopics:
    - name: Data masking
      id: data-masking
    - name: Data encryption
      id: data-encryption
  - name: External access control
    id: external-access-control
    subtopics:
    - name: ACLs
      id: acls
    - name: Webservice authentication
      id: webservice-authentication
  - name: Injection attacks
    id: injection-attacks
    subtopics:
    - name: Injection attack types
      id: injection-attack-types
      description: Wants to understand what injection attacks are, why they are dangerous,
        and what categories exist, including SQL injection, XSS, interpreter injection,
        file system attacks, and buffer overflow, in the context of OWASP web security,
        so that they can recognize and reason about this vulnerability class when securing
        ODC applications.
    - name: XSS attack types
      id: xss-attack-types
      description: Wants to understand the three categories of Cross-Site Scripting
        attacks, specifically reflected, stored, and DOM-based XSS, including how each
        propagates and their relative severity, so that they can identify the type of
        XSS risk present in their application and apply the right mitigation.
    - name: Prevent injection ODC
      id: prevent-injection-odc
      description: Wants to understand and apply OutSystems ODC's built-in injection
        protections, including IDE injection warnings, Content Security Policy, platform
        default escaping, and Encode functions (EncodeSQL, EncodeHTML, EncodeJavaScript,
        EncodeURL) and parameterized queries, so that they can protect their ODC
        applications against SQL injection and XSS attacks.
- name: Advanced workflows
  guid: 7a84e09e-c48c-404f-8d9f-728b9f78c88c
  topics:
  - name: Using callbacks
    id: using-callbacks
  - name: Best practices for scalable processes
    id: scalable-process-best-practices
  - name: Extend processes (process entities, APIs, reports)
    id: extend-processes-entities
  - name: Event driven processes
    id: event-driven-processes
  - name: Case Management Framework
    id: case-management-framework
    subtopics:
    - name: Bootstrap CMF app
      id: bootstrap-cmf-app
      description: Wants to create the foundational modules of a case management app
        (core services, workflow, and optional UI) using the Case Management Framework
        in OutSystems 11, so that the basic app structure is in place and ready for
        further case development.
    - name: Bootstrap case config
      id: bootstrap-case-config
      description: Wants to create a bootstrapping timer action that registers the
        case definition and case status definitions into the Case Management Framework
        every time the core services module is published in OutSystems 11, so that
        the configuration is automatically kept in sync with the module.
    - name: Define case status
      id: define-case-status
      description: Wants to define a new case status by adding a record to the
        CaseStatusConfiguration static entity in the core services module in
        OutSystems 11, so that the bootstrapping action can register it with the
        case definition and it becomes available for assignment to case instances.
    - name: Update case status
      id: update-case-status
      description: Wants to update the status of an existing case instance using
        the Case_UpdateStatus action from the CaseServices_API module in OutSystems
        11, so that a case moves to a new valid status when the required conditions
        (valid case ID, valid status, valid state-machine transition) are met.
    - name: Manage CMF delegation
      id: manage-cmf-delegation
      description: Wants to enable users to create, update, or delete a case or
        activity delegation in OutSystems 11 using the Delegation_Create,
        Delegation_CreateOrUpdate, Delegation_Update, and Delegation_Delete actions
        in the CaseConfigurations_API module, so that work can be reassigned to
        another user either for a set time period or indefinitely.
    - name: Use CMF delegation
      id: use-cmf-delegation
      description: Wants to validate an active delegation, retrieve existing
        delegations by ID or user, and correctly pass the DelegatedBy attribute
        when calling case and activity actions in OutSystems 11 using the
        CaseServices_API module, so that delegated actions are properly authorized
        and logged in case history.
    - name: Understand GroupExtended
      id: understand-group-extended
      description: Wants to understand what the GroupExtended entity is in the
        Case Management Framework in OutSystems 11, including how it extends the
        Group system entity, how it supports assigning activities to groups,
        managing group-based case permissions, defining group hierarchies, and
        associating calendars, so that they can decide how to model user groups
        in their case management app.
    - name: Bootstrap CMF groups
      id: bootstrap-cmf-groups
      description: Wants to set up extended case management groups by creating
        a GroupExtendedConfiguration static entity, a Bootstrap_Groups timer,
        and wiring the GroupExtended_CreateOrUpdate action in OutSystems 11,
        and then add group records to the configuration module, so that groups
        are registered in the Group and GroupExtended entities when the module
        is published.
    - name: List case activities
      id: list-case-activities
      description: Wants to retrieve a list of activities assigned to a logged-in
        case worker by adding the Case_GetActivities action and related static
        entity dependencies to the UI module and wiring a Data Action in
        OutSystems 11, so that the activity list can be used as the data source
        for a Table or List widget.
    - name: Enrich activity list
      id: enrich-activity-list
      description: Wants to enrich an activity list with case business entity
        data by modifying the Data Action output parameter to a Record list and
        iterating with a For Each, Aggregate, and ListAppend in OutSystems 11,
        so that case workers can see supplementary case information (such as a
        support ticket subject) alongside each activity.
    - name: List requester cases
      id: list-requester-cases
      description: Wants to retrieve a list of cases created by a logged-in
        requester by adding the Case_GetCases action and RequesterScope static
        entity dependencies to the UI module and wiring a Data Action in
        OutSystems 11, so that the case list can be used as the data source for
        a Table or List widget.
    - name: Enrich requester case list
      id: enrich-requester-case-list
      description: Wants to enrich a requester case list with case business
        entity data by modifying the Data Action output parameter to a Record
        list and iterating with a For Each, Aggregate, and ListAppend in
        OutSystems 11, so that requesters can see supplementary case information
        (such as a support ticket subject) alongside each case they created.
    - name: Translate CMF entities
      id: translate-cmf-entities
      description: Wants to add locales to the Data tab and translate the CMF
        static entities (CaseDefinitionConfiguration, CaseStatusConfiguration,
        Milestones, CaseActions) in the core services module in OutSystems 11,
        so that the Case Management Framework app displays text in the correct
        supported language for end users.
    - name: Enable CMF locale
      id: enable-cmf-locale
      description: Wants to create a SetupCaseConfiguration_Locale server action
        that calls SetCurrentLocale and appends translation records for the case
        definition and case status static entities in OutSystems 11, so that the
        case management app resolves labels in the correct language for a given
        locale at runtime.
    - name: Adapt CMF bootstrap
      id: adapt-cmf-bootstrap
      description: Wants to call the SetupCaseConfiguration_Locale action once
        per target locale in the Bootstrap_CaseConfiguration timer action,
        chaining each call's SetupData output as the next call's input in
        OutSystems 11, so that all desired locale translations are registered
        every time the core services module is published.
    - name: Understand rules engine
      id: understand-rules-engine
      description: Wants to understand the four components of the rules engine
        in the Case Management Framework (Rule, Rule Group, Rule Line, Rule
        Group Output), how they relate to each other, and what result types a
        rule can return, in OutSystems 11, so that they can model business rules
        correctly before setting them up.
    - name: Set up CMF rule
      id: set-up-cmf-rule
      description: Wants to set up a rule in the Case Management Framework by
        creating the Rule, Rule Group, Rule Line, and Rule Group Output records
        using the CaseServices_API in OutSystems 11, so that a business rule is
        ready to be evaluated in a case management application.
    - name: Evaluate CMF rule
      id: evaluate-cmf-rule
      description: Wants to evaluate a rule in the Case Management Framework by
        calling the execution actions in the CaseServices_API Rules Engine folder
        in OutSystems 11, so that the rule result can be used in a case management
        application's logic.
    - name: Fix duplicate transition
      id: fix-duplicate-transition
      description: 'Wants to fix the "We found more than one record for this
        transition" error by deactivating the duplicate CaseStateMachine
        record for a given CaseStatusId and NextCaseStatusId pair using the
        CaseStateMachine_Update action in OutSystems 11, so that the Case
        Management Framework can execute CaseStateMachine_GetByTransition
        successfully.'
    - name: Fix duplicate access grant
      id: fix-duplicate-access-grant
      description: 'Wants to fix the "Access permissions for that Case Definition
        have already been granted to that user/group" error by verifying the
        input parameters passed to the Case Management Framework''s access-granting
        action using Service Studio''s Debugger in OutSystems 11, so that the
        action isn''t called again for a user/group that already has access to
        that case definition.'
    - name: Fix CMF email destination
      id: fix-cmf-email-destination
      description: 'Wants to fix the "Set a destination to send the email" error
        by filling in at least one of the To, Cc, Bcc, ToGroupId, CcGroupId, or
        BccGroupId inputs before calling Email_Send in the Case Management
        Framework in OutSystems 11, so that the framework can successfully
        execute the action.'
    - name: Fix rule data type
      id: fix-rule-data-type
      description: 'Wants to fix the "There was an error processing this rule
        expression. <data-type> can''t be compared with <data-type>" error by
        rewriting the rule so its left and right attribute data types are
        comparable in the Case Management Framework in OutSystems 11, so that
        the rule executes successfully.'
    - name: Fix rule output type
      id: fix-rule-output-type
      description: 'Wants to fix the "The expected rule output type does not
        match this rule type" error by updating the RuleTypeId input value to
        match the configured rule type using the Rule_CreateOrUpdate action in
        the CaseConfigurations_API module in OutSystems 11, so that the Case
        Management Framework can successfully execute the rule.'
    - name: Fix activity action ID
      id: fix-activity-action-id
      description: 'Wants to fix the "Unknown activity action. It must match one
        from ActivityAction." error by verifying the ActivityActionId input
        value against the ActivityAction static entity in the
        CM_ProcessServices_BL module using Service Studio''s Debugger before
        calling Case_PerformActionActivity in the Case Management Framework in
        OutSystems 11, so that the action executes successfully.'
    - name: Fix case purge error
      id: fix-case-purge-error
      description: 'Wants to fix the "Case Definition with the Id
        <case-definition-identifier-value> can''t be purged. Change the
        PurgeTypeId to allow it." error by updating the case definition''s
        PurgeTypeId, DaysToPurgeCase, and DaysToPurgeProcess attributes using
        the CaseDefinition_Update action from the CaseConfigurations_API
        module, or by filling in the missing attributes in the Bootstrap/Setup
        input structures, in OutSystems 11, so that the Case Management
        framework can successfully execute the CaseDefinition_Purge action.'
    - name: Fix activity case mismatch
      id: fix-activity-case-mismatch
      description: 'Wants to fix the "Activity with Id
        <activity-identifier-value> does not belong to Case with Id
        <case-identifier-value>" error by verifying the Activity Identifier
        input value belongs to a process associated with the given case using
        Service Studio''s Debugger before calling Case_DiscardActivity in the
        Case Management Framework in OutSystems 11, so that the action
        executes successfully.'
- name: App Configuration Management
  guid: 22a71e1c-da01-468c-9633-29c791104e7e
  topics:
  - name: App configuration
    id: app-configuration
    subtopics:
    - name: Configure app settings after a deployment
      id: config-app-after-deploy
    - name: App settings
      id: app-settings
    - name: Configure app settings before a deployment
      id: config-app-before-deploy
    - name: Factory Configuration overview
      id: factory-configuration-overview
      description: Wants to understand what the Factory Configuration Forge plugin is
        and how to install it from Forge for OutSystems 11, so that they can use it
        to manage web.config shared configurations and platform-level settings across
        their Service Center Factory.
    - name: Shared configurations
      id: factory-configuration-shared-configs
      description: Wants to create shared configurations in Factory Configuration using
        XSLT templates (from scratch or pre-made samples) and associate them with eSpaces
        in Service Center, so that web.config customizations persist across module
        deployments in OutSystems 11.
    - name: Platform configurations
      id: factory-configuration-platform-configs
      description: Wants to understand which internal platform configurations are available
        in Factory Configuration's Platform Configurations tab (such as brute force
        protection, slow query threshold, and remember login settings) and what database
        parameters they control, so that they can tune platform-wide behavior in
        OutSystems 11.
  - name: Runbooks for app configuration management
    id: runbook-config-mgmt
    subtopics:
    - name: Manual runbooks for app configuration
      id: manual-runbook-config
  - name: Automated runbooks for app configuration management
    id: automated-runbook-mgmt
    subtopics:
    - name: Automated runbooks for app configuration
      id: automated-runbook-config
- name: App architecture
  guid: 6c1b124d-3ad6-456a-926c-0a843667cd0a
  topics:
  - name: Refactoring
    id: refactoring
    subtopics:
    - name: Convert to library
      id: convert-to-library
      description: Wants to convert an existing Mobile or Reactive module to a
        Library module in OutSystems 11, including resolving disallowed elements
        and TrueChange errors before conversion, so that the module publishes
        successfully as a Library.
  - name: Validating your application architecture
    id: validate-app-architecture
  - name: Architecture Canvas
    id: architecture-canvas
  - name: Application composition
    id: application-composition
    subtopics:
    - name: Library module overview
      id: library-module-overview
      description: Wants to understand what a Library module is in OutSystems 11, including
        its stateless, database-agnostic design principles, typical use cases
        such as UI/style guides and reusable connectors or logic utilities,
        which Service Studio elements are available or restricted in a Library,
        and what reference restrictions apply to it, so that they can decide
        when and how to use Libraries in their application architecture.
    - name: Create a Library module
      id: create-library-module
      description: Wants to create a new Library module in Service Studio, by
        creating a Mobile or Reactive Web app (or adding a module to an existing
        one) and choosing Library as the module type, and knows to set the entry
        module to a consuming module when debugging it, so that they have a
        working Library ready to hold reusable stateless components.
  - name: Core module patterns
    id: core-module-patterns
    subtopics:
    - name: Core entity pattern
      id: core-entity-pattern
      description: Wants to understand the core entity pattern in OutSystems 11 — how
        a core module stores data in entities exposed as read-only and centralizes all
        create/update operations — so that multiple applications can consume core business
        data consistently without bypassing the module's encapsulation.
    - name: ECS pattern variations
      id: ecs-pattern-variations
      description: Wants to understand the external core service (ECS) pattern and its
        variations — base ECS, local replica, isolated synchronization, direct integration,
        pub/sub, summary cache, and lazy load — in OutSystems 11, so that the right caching
        and synchronization strategy can be selected when an external system is the system
        of records.
    - name: Transparency service
      id: transparency-service-pattern
      description: Wants to understand the transparency service pattern in OutSystems 11,
        where an integration service with multiple drivers abstracts several external systems
        behind a uniform API, so that core services can retrieve and update data without
        knowing which external system holds it.
    - name: Module reference trade-offs
      id: module-reference-tradeoffs
      description: Wants to understand how to manage module references in OutSystems 11
        — including avoiding circular references, choosing between structures and entities
        for large record flows, and evaluating local web services versus public actions —
        so that the application's reference model stays simple, deployment times are
        minimized, and thread exhaustion is avoided.
    - name: Encapsulate REST APIs
      id: encapsulate-rest-apis
      description: Wants to understand why and how to encapsulate REST API consumption
        inside an ODC library, exposing server actions and public structures instead of
        consuming REST methods directly in the app, so that changes to the REST interface
        only need to be updated once and breaking changes can be managed through library
        versioning.
  - name: Session management
    id: session-management
    subtopics:
    - name: Session lifecycle
      id: session-lifecycle
      description: Wants to understand how a session is created, maintained, and
        ended in OutSystems Traditional Web Apps — including differences between
        Web, Web Service, and Timer sessions — so that they can reason about when
        session state is available during their application's execution.
    - name: Configure session timeout
      id: configure-session-timeout
      description: Wants to configure how long an idle Traditional Web App session
        remains active before the Platform Server automatically ends it, by adjusting
        the session timeout value in the machine.config file, so that end users
        get a session duration appropriate to their app's needs.
    - name: Session variables
      id: session-variables
      description: Wants to understand how session variables persist data during
        a Traditional Web App session — including built-in read-only variables like
        Username and TerminalType, defining custom session variables, their behavior
        in asynchronous logic and consumer/producer module scenarios, and performance
        implications of storing large data — so that they can design session state
        usage correctly for their application.
- name: Asynchronous processes
  guid: d4964d80-c8da-468a-ab3c-8f59aab61aa5
  topics:
  - name: How to process data using Timers
    id: process-data-timers
    subtopics:
    - name: Timer best practices
      id: timer-best-practices
      description: Wants to implement a long-running Timer correctly by applying best
        practices (timeout prevention, idempotent commits, completeness through batching,
        and data integrity) in ODC, so that the Timer never aborts due to timeout and
        all records are eventually processed without data corruption or repeated work.
    - name: Configure timer settings
      id: configure-timer-settings
      description: Wants to configure a Timer's schedule (Daily, Weekly, Monthly, When
        Published, Run Now), timeout, and active flag in ODC Portal per deployment stage,
        so the Timer runs at the right time, within resource limits, and with appropriate
        values in each environment.
    - name: Monitor timer logs
      id: monitor-timer-logs
      description: Wants to monitor timer execution by viewing timer logs in the ODC
        Portal, so that they can check whether a timer is running, review its last
        execution time and duration, and investigate errors using log details and
        related activities.
  - name: How to process massive amounts of data in Batch Processing
    id: batch-data-processing
- name: Basic integrations
  guid: c0892f27-0055-4fe6-bb6f-e5a308d37b2a
  topics:
  - name: Integration Patterns - Basics (decision tree)
    id: integration-pattern-basics
  - name: Expose webservices
    id: expose-webservices
    subtopics:
    - name: Define methods
      id: define-methods
    - name: Error codes
      id: error-codes
    - name: Document APIs
      id: document-apis
    - name: Develop the logic of web services
      id: webservice-logic-dev
    - name: Test SOAP with SoapUI
      id: test-soap-soapui
      description: 'Wants to test a SOAP web service method built in OutSystems by installing
        SoapUI, generating a project from the service''s WSDL, submitting a sample request,
        and inspecting the success/error XML response, so that the method''s behavior can
        be verified before considering it complete.'
    - name: Troubleshoot webservices
      id: troubleshoot-webservices
  - name: Consume webservices
    id: consume-webservices
    subtopics:
    - name: Changing endpoints
      id: changing-endpoints
    - name: Consume and refresh methods
      id: consume-refresh-methods
    - name: Show webservice errors
      id: show-webservice-errors
      description: Wants to handle the outcome of a webservice method call in the
        application logic by checking the method's Result.Success output and
        displaying the Result.ErrorMessage in a feedback message when it's false,
        so that end users are informed when an operation like deleting a record
        fails.
    - name: Structures
      id: structures
    - name: Consume SAP OData
      id: consume-sap-odata
      description: Wants to consume an SAP OData service in OutSystems 11 by downloading
        the JSON Swagger specification from SAP API Business Hub and importing it via
        Service Studio's REST consumer in a dedicated module, so that SAP data and
        operations are available as server actions in the application.
    - name: Fix OData dollar params
      id: fix-odata-dollar-params
      description: Wants to work around SAP OData's $-prefixed system query parameter
        encoding issue by implementing an OnBeforeRequest handler in Service Studio
        that re-adds the dollar sign to matching URL query parameters before each
        request, so that filters, ordering, pagination, and other OData system options
        are transmitted correctly.
    - name: Handle SAP OData errors
      id: handle-sap-odata-errors
      description: Wants to implement an OnAfterResponse handler in Service Studio
        that parses SAP OData error responses across three formats (data errors, fault
        errors, and API errors) and throws typed exceptions, so that error handling
        logic in the consuming application can respond appropriately to different
        failure modes.
- name: Basic workflows
  guid: 368a1c9e-0f21-4970-9645-577590bbf1ca
  topics:
  - name: Emails
    id: emails
    subtopics:
    - name: How to send emails
      id: how-to-send-emails
    - name: How to create emails
      id: how-to-create-emails
    - name: Email link variable
      id: email-link-variable
      description: Wants to generate a direct link to a specific record by building
        the URL with GetEntryURL in the email's Preparation action and passing it
        as an input parameter, in Service Studio for O11 Traditional Web Apps, so
        that clicking the link in the email takes the user straight to that record's
        page instead of a generic landing page.
  - name: BPT
    id: bpt
    subtopics:
    - name: Connecting processes to the UI
      id: connect-process-ui
    - name: Understanding asynchronous processes
      id: async-processes-basics
    - name: Triggering processes, process flows
      id: trigger-processes
    - name: Design process flow
      id: design-process-flow
      description: Wants to design the behavior of a process using the Process
        Flow editor after creating a process, selecting tools from the Process
        Flow Toolbox to be executed in the flow, so that the process's logic is
        defined.
    - name: Process upgrade impact
      id: process-upgrade-activity-impact
      description: Wants to understand how moving activities in a process flow
        affects executing process instances after publishing, in OutSystems 11,
        so that they can predict which instances get suspended and know to
        review them in Service Center.
    - name: BPMN notation
      id: bpmn-notation
    - name: Patterns for processes (automatic, human, decision)
      id: process-decision-patterns
  - name: Workflow Builder
    id: workflow-builder
    subtopics:
    - name: WFB group naming
      id: wfb-group-naming
      description: Wants to understand how Workflow Builder automatically creates
        user groups in the OutSystems Users tool when an app is published to the
        development environment, including the naming conventions for requester and
        activity groups ([WB | App Name | Requesters] and [WB | App Name | Group name]),
        in OutSystems 11, so that IT teams can identify and configure the correct
        groups for end-user access.
    - name: WFB production handoff
      id: wfb-production-handoff
      description: Wants to understand the steps required to move a Workflow Builder
        app from development to production in OutSystems 11, including involving the
        IT team, sharing user group names, and having IT add users in the OutSystems
        Users tool, so that the app is ready for end users to access.
    - name: Update CM dependency
      id: update-cm-dependency
      description: Wants to install or update the Case Management framework
        dependency for a Workflow Builder app in OutSystems 11 by downloading
        the CMF .osp file from Workflow Builder's settings and publishing it
        through Service Center, so that Workflow Builder recognizes the app's
        dependencies as up to date.
