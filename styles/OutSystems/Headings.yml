# Adapted from Microsoft.Headings
# Changed: exceptions
# Previous link: https://docs.microsoft.com/en-us/style-guide/capitalization
#
# Guidelines for the exceptions list
#
# An exception is a word or phrase that keeps its capitalization in a heading.
# Add each term to exactly one group, and keep every group sorted alphabetically.
# Before adding a term, search this file: it may already be
# listed in another group.
#
# Choosing a group: use the first question you answer "yes" to.
#   1. Is it an event name, a UI pattern or widget, a cloud region, a
#      certification or boot camp, or a conference?
#      -> Events, UI Patterns and Widgets, Regions, Certifications and Boot Camps,
#         or Conferences
#   2. Is it the proper name of an OutSystems product, component, or plugin?
#      -> Product (for example Forge, LifeTime, Camera plugin)
#   3. Is it the name of a vendor product, open-source project, platform, or AI tool?
#      -> Third Party (for example GitHub, Docker, macOS, Claude Code)
#   4. Is it a generic technology term that no single vendor owns: an acronym,
#      protocol, standard, file format, language, SQL keyword, or regulation?
#      -> Industry (for example HTML, JSON, TypeScript, SELECT, HIPAA)
#   5. Otherwise, is it OutSystems development vocabulary or an example name?
#      -> Concepts (for example Aggregate, Entity, Screen)
#
# Errors and Jira issue keys hold regex patterns only. Don't add plain terms there.
#
# Edge cases:
#   * A format or language is Industry even when one vendor created it
#     (JSON, CSS, TypeScript). A named product is Third Party (Docker, MongoDB).
#   * If a plugin's name is a product or a generic technology term, list the name
#     without "plugin" in that term's group: OneSignal and Firebase Cloud Messaging
#     in Third Party, SSL Pinning in Industry. "plugin" is lowercase, so the name
#     already covers "OneSignal plugin".
#   * If the name is specific to the OutSystems plugin and is neither a product nor
#     an industry term, list it with the lowercase "plugin" in Product (Camera
#     plugin, File Transfer plugin). Don't list the bare name, because "Camera"
#     alone would then be allowed capitalized anywhere in a heading.
#   * Don't add a phrase when every capitalized word in it is already an exception
#     on its own. Cordova already covers "Cordova-based", and OneSignal already
#     covers "OneSignal plugin". Hyphens don't change this.
extends: capitalization
message: "'%s' should use sentence-style capitalization."
level: error
scope: heading
match: $sentence
indicators:
  - ':'
  - '.'
